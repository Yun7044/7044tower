    function loadUnlockedSkins() {
        try {
            const raw = localStorage.getItem(UNLOCKED_KEY);
            if (!raw) return { classic: true };
            const obj = JSON.parse(raw);
            obj.classic = true;
            return obj;
        } catch (e) { return { classic: true }; }
    }
    function saveUnlockedSkins(obj) {
        try { localStorage.setItem(UNLOCKED_KEY, JSON.stringify(obj)); } catch (e) {}
    }

    let tickets = loadTickets();
    let currentSkinId = loadCurrentSkin();
    let unlockedSkins = loadUnlockedSkins();

    // ============ 主選單插入按鈕 ============
    const menuRow = document.querySelector('.menu-row');
    if (menuRow && !document.getElementById('skinBtn')) {
        const btn = document.createElement('button');
        btn.className = 'menu-action';
        btn.id = 'skinBtn';
        btn.textContent = '🎨 皮膚';
        const leaderboardBtn = document.getElementById('viewLeaderboardBtn');
        if (leaderboardBtn && leaderboardBtn.parentNode === menuRow) {
            menuRow.insertBefore(btn, leaderboardBtn);
        } else {
            menuRow.appendChild(btn);
        }
        btn.addEventListener('click', function() {
            if (typeof initAudio === 'function') initAudio();
            document.getElementById('skinPanel').classList.add('show');
            renderSkins();
        });
    }

    // ============ 渲染預覽色塊 ============
    function makePreviewHTML(skin) {
        const starCount = 6;
        let stars = '';
        for (let i = 0; i < starCount; i++) {
            const sx = (i * 137) % 100;
            const sy = (i * 79) % 50;
            stars += '<div class="pv-star" style="left:' + sx + '%;top:' + sy + '%;opacity:' + (0.4 + (i % 3) * 0.2) + ';"></div>';
        }
        return '<div class="pv-sky" style="background: linear-gradient(180deg, ' + skin.sky[0] + ' 0%, ' + skin.sky[1] + ' 40%, ' + skin.sky[2] + ' 75%, ' + skin.sky[3] + ' 100%);">' +
            stars +
            '<div class="pv-path" style="background: ' + skin.path + '; box-shadow: 0 0 10px ' + skin.pathGlow + ';"></div>' +
            '<div class="pv-tower" style="background: ' + skin.tower + ';"></div>' +
        '</div>';
    }

    // ============ 渲染皮膚卡片 ============
    function renderSkins() {
        const grid = document.getElementById('skinGrid');
        const ticketEl = document.getElementById('ticketCount');
        if (!grid) return;
        ticketEl.textContent = tickets;

        let html = '';
        for (let i = 0; i < SKINS.length; i++) {
            const skin = SKINS[i];
            const isEquipped = skin.id === currentSkinId;
            const isUnlocked = unlockedSkins[skin.id] === true || skin.unlock === 'always';

            let badge = '';
            let cardClass = 'skin-card';
            if (isEquipped) {
                cardClass += ' equipped';
                badge = '<div class="skin-badge">使用中</div>';
            } else if (isUnlocked) {
                badge = '<div class="skin-badge">已解鎖</div>';
            } else {
                cardClass += ' locked';
                badge = '<div class="skin-badge">🔒 鎖定</div>';
            }

            html += '<div class="' + cardClass + '" data-skin-id="' + skin.id + '">' +
                badge +
                '<div class="skin-preview">' + makePreviewHTML(skin) + '</div>' +
                '<div class="skin-name">' + skin.name + '</div>' +
                '<div class="skin-desc">' + skin.desc + '</div>' +
            '</div>';
        }
        grid.innerHTML = html;

        // 綁定點擊
        grid.querySelectorAll('.skin-card').forEach(function(card) {
            card.addEventListener('click', function() {
                const id = card.dataset.skinId;
                showSkinDetail(id);
            });
        });
    }

    // ============ 皮膚詳情 ============
    let detailSkinId = null;

    function showSkinDetail(id) {
        const skin = SKINS.find(function(s) { return s.id === id; });
        if (!skin) return;
        detailSkinId = id;

        const modal = document.getElementById('skinDetailModal');
        document.getElementById('sdPreview').innerHTML = makePreviewHTML(skin);
        document.getElementById('sdName').textContent = skin.name;
        document.getElementById('sdDesc').textContent = skin.desc;

        const isEquipped = skin.id === currentSkinId;
        const isUnlocked = unlockedSkins[skin.id] === true || skin.unlock === 'always';
        const actionBtn = document.getElementById('sdAction');

        let condText = '';
        if (isEquipped) {
            condText = '✅ 目前使用中';
            actionBtn.textContent = '已裝備';
            actionBtn.disabled = true;
        } else if (isUnlocked) {
            condText = '✅ 已解鎖';
            actionBtn.textContent = '使用';
            actionBtn.disabled = false;
        } else if (skin.unlock === 'shop_300' || skin.unlock === 'shop_400') {
            condText = '🎟️ ' + skin.condition + '｜你有 ' + tickets + ' 券';
            actionBtn.textContent = (tickets >= skin.price) ? '購買' : '券不足';
            actionBtn.disabled = tickets < skin.price;
        } else {
            condText = '🔒 ' + skin.condition;
            actionBtn.textContent = '條件未達成';
            actionBtn.disabled = true;
        }

        document.getElementById('sdCondition').textContent = condText;
        modal.classList.add('show');
    }

    // ============ 按鈕綁定 ============
    document.getElementById('closeSkin').addEventListener('pointerdown', function(e) {
        e.preventDefault();
        document.getElementById('skinPanel').classList.remove('show');
    }, { passive: false });

    document.getElementById('sdClose').addEventListener('pointerdown', function(e) {
        e.preventDefault();
        document.getElementById('skinDetailModal').classList.remove('show');
    }, { passive: false });

    document.getElementById('sdAction').addEventListener('pointerdown', function(e) {
        e.preventDefault();
        if (!detailSkinId) return;
        const skin = SKINS.find(function(s) { return s.id === detailSkinId; });
        if (!skin) return;

        const isUnlocked = unlockedSkins[skin.id] === true || skin.unlock === 'always';

        if (isUnlocked) {
            // 第一批：只切換 currentSkinId，視覺效果留到第二批
            currentSkinId = skin.id;
            saveCurrentSkin(skin.id);
            document.getElementById('skinDetailModal').classList.remove('show');
            renderSkins();
            if (typeof log === 'function') log('🎨 已裝備皮膚：' + skin.name, 2000);
        } else if (skin.price && tickets >= skin.price) {
            // 第一批：先不實際扣券，避免出問題
            if (typeof log === 'function') log('🎨 商店功能開發中，敬請期待', 2000);
        }
    }, { passive: false });

    // ============ 對外 API（第二批會用到） ============
    window.__skinAPI = {
        getCurrent: function() { return currentSkinId; },
        getTickets: function() { return tickets; },
        addTickets: function(n) {
            tickets += n;
            saveTickets(tickets);
            const el = document.getElementById('ticketCount');
            if (el) el.textContent = tickets;
        },
        unlock: function(id) {
            unlockedSkins[id] = true;
            saveUnlockedSkins(unlockedSkins);
        },
        getSkin: function(id) { return SKINS.find(function(s) { return s.id === id; }); },
    };

    console.log('[皮膚] 皮膚系統載入完成｜券：' + tickets + '｜當前皮膚：' + currentSkinId);
})();
</script>

<script>
// ============================================================
// 皮膚系統：第二批（購買 + 通關給券 + 視覺套用）
// ============================================================
(function() {
    'use strict';
    console.log('[皮膚2] 購買與視覺系統載入中...');

    // ============ 皮膚定義（與第一批同步） ============
    const SKINS = {
        classic: { sky: ['#15062a', '#1a0840', '#0a0418', '#050208'], path: '#a060ff', pathGlow: '#a060ff', accent: '#ffd700' },
        grass:   { sky: ['#0a2a0a', '#1a4a1a', '#0a1a0a', '#050805'], path: '#4ec472', pathGlow: '#88d888', accent: '#4ec472' },
        deepsea: { sky: ['#041a2a', '#0a3a5a', '#04141a', '#020508'], path: '#4a90ff', pathGlow: '#00e5ff', accent: '#4a90ff' },
        inferno: { sky: ['#2a0a05', '#5a1a0a', '#1a0502', '#0a0200'], path: '#ff4500', pathGlow: '#ffd700', accent: '#ff4500' },
        bio:     { sky: ['#0a1a0a', '#1a3a1a', '#050a05', '#020502'], path: '#66FF66', pathGlow: '#00e5ff', accent: '#66FF66' },
        gold:    { sky: ['#2a1a05', '#4a3010', '#1a0f02', '#0a0500'], path: '#ffd700', pathGlow: '#ffaa00', accent: '#ffd700' },
        dark:    { sky: ['#050508', '#0a0518', '#020205', '#000000'], path: '#6040a0', pathGlow: '#a060ff', accent: '#a060ff' },
        white:   { sky: ['#e0e8ff', '#b8d0ff', '#a0b8e0', '#8098c0'], path: '#ffffff', pathGlow: '#b8d0ff', accent: '#ffffff' },
    };

    function hexToRgba(hex, a) {
        const h = hex.replace('#', '');
        const r = parseInt(h.substring(0, 2), 16);
        const g = parseInt(h.substring(2, 4), 16);
        const b = parseInt(h.substring(4, 6), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }

    function getCurrentSkin() {
        if (!window.__skinAPI) return SKINS.classic;
        const id = window.__skinAPI.getCurrent();
        return SKINS[id] || SKINS.classic;
    }

    // ============ 覆蓋 sdAction 按鈕 ============
    const oldActionBtn = document.getElementById('sdAction');
    if (oldActionBtn) {
        const newActionBtn = oldActionBtn.cloneNode(true);
        oldActionBtn.parentNode.replaceChild(newActionBtn, oldActionBtn);

        newActionBtn.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (typeof initAudio === 'function') initAudio();

            const detailSkinId = getDetailSkinId();
            if (!detailSkinId) return;

            const skinData = window.__skinAPI ? window.__skinAPI.getSkin(detailSkinId) : null;
            if (!skinData) return;

            const currentId = window.__skinAPI ? window.__skinAPI.getCurrent() : 'classic';
            const tickets = window.__skinAPI ? window.__skinAPI.getTickets() : 0;
            const unlocked = isSkinUnlocked(detailSkinId);

            if (detailSkinId === currentId) return;

            if (unlocked) {
                // 直接裝備
                try { localStorage.setItem('towerDefenseCurrentSkin_v1', detailSkinId); } catch (err) {}
                if (typeof log === 'function') log('🎨 已裝備：' + skinData.name, 2000);
                refreshAll();
                closeDetail();
                return;
            }

            // 商店購買
            if (skinData.price) {
                if (tickets < skinData.price) {
                    if (typeof log === 'function') log('🎟️ 皮膚券不足（需 ' + skinData.price + '）', 2000);
                    return;
                }
                // 扣券
                if (window.__skinAPI) {
                    window.__skinAPI.addTickets(-skinData.price);
                    window.__skinAPI.unlock(detailSkinId);
                }
                // 自動裝備
                try { localStorage.setItem('towerDefenseCurrentSkin_v1', detailSkinId); } catch (err) {}
                if (typeof log === 'function') log('🎨 購買並裝備：' + skinData.name, 2500);
                if (typeof sfxGold === 'function') sfxGold();
                refreshAll();
                closeDetail();
                return;
            }

            // 未達條件
            if (typeof log === 'function') log('🔒 ' + skinData.condition, 2500);
        }, { passive: false });
    }

    function getDetailSkinId() {
        // 從彈窗的顯示名稱反查
        const nameEl = document.getElementById('sdName');
        if (!nameEl || !window.__skinAPI) return null;
        const name = nameEl.textContent;
        const allSkins = ['classic', 'grass', 'deepsea', 'inferno', 'bio', 'gold', 'dark', 'white'];
        for (let i = 0; i < allSkins.length; i++) {
            const s = window.__skinAPI.getSkin(allSkins[i]);
            if (s && s.name === name) return allSkins[i];
        }
        return null;
    }

    function isSkinUnlocked(id) {
        try {
            const raw = localStorage.getItem('towerDefenseUnlockedSkins_v1');
            if (!raw) return id === 'classic';
            const obj = JSON.parse(raw);
            return obj[id] === true || id === 'classic';
        } catch (e) { return id === 'classic'; }
    }

    function closeDetail() {
        const modal = document.getElementById('skinDetailModal');
        if (modal) modal.classList.remove('show');
    }

    function refreshAll() {
        // 重新渲染皮膚面板
        const panel = document.getElementById('skinPanel');
        if (panel && panel.classList.contains('show')) {
            // 觸發原本的 renderSkins（透過重新點擊重繪）
            const evt = new Event('refresh');
            panel.dispatchEvent(evt);
        }
        // 更新券數量
        if (window.__skinAPI) {
            const el = document.getElementById('ticketCount');
            if (el) el.textContent = window.__skinAPI.getTickets();
        }
        // 重新整理面板卡片（最簡單的方式：手動呼叫 renderSkins）
        if (typeof window.__renderSkins === 'function') {
            window.__renderSkins();
        } else {
            // 關掉再開
            if (panel) {
                panel.classList.remove('show');
                setTimeout(function() { panel.classList.add('show'); }, 50);
            }
        }
    }

    // ============ 通關給皮膚券 ============
    const _prevFinishGame = window.finishGame || finishGame;
    const originalFinishGame = (typeof finishGame === 'function') ? finishGame : null;

    // 包裝 finishGame
    const _finishGameWrapper = function(didVictory) {
        if (originalFinishGame) {
            originalFinishGame.call(this, didVictory);
        }

        if (!didVictory) return;

        // 通關獎勵
        const diff = typeof currentDifficulty !== 'undefined' ? currentDifficulty : null;
        if (!diff) return;

        let reward = 0;
        if (diff === 'easy') reward = 30;
        else if (diff === 'normal') reward = 80;
        else if (diff === 'hard') reward = 200;

        // 檢查首次通關
        const firstKey = 'towerDefenseFirstClear_' + diff;
        let isFirstClear = false;
        try {
            if (!localStorage.getItem(firstKey)) {
                localStorage.setItem(firstKey, '1');
                isFirstClear = true;
                reward += 50; // 首通額外 +50
            }
        } catch (e) {}

        if (reward > 0 && window.__skinAPI) {
            window.__skinAPI.addTickets(reward);
            setTimeout(function() {
                if (typeof log === 'function') {
                    const msg = isFirstClear
                        ? '🎟️ 首次通關！+' + reward + ' 皮膚券'
                        : '🎟️ 通關獎勵：+' + reward + ' 皮膚券';
                    log(msg, 4000);
                }
            }, 800);
        }
    };

    // 覆蓋全域 finishGame
    try {
        finishGame = _finishGameWrapper;
    } catch (e) {
        window.finishGame = _finishGameWrapper;
    }

    // ============ 視覺套用：背景 ============
    const _prevDrawBackground = drawBackground;
    drawBackground = function() {
        const skin = getCurrentSkin();
        const sky = skin.sky;

        // 天空漸層（用皮膚色）
        const grad = ctx.createLinearGradient(0, 0, 0, BASE_H);
        grad.addColorStop(0, sky[0]);
        grad.addColorStop(0.35, sky[1]);
        grad.addColorStop(0.7, sky[2]);
        grad.addColorStop(1, sky[3]);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, BASE_W, BASE_H);

        // 星雲光暈（用皮膚的 accent 色調）
        const nebula1 = ctx.createRadialGradient(240, 90, 20, 240, 90, 260);
        nebula1.addColorStop(0, hexToRgba(skin.pathGlow, 0.22));
        nebula1.addColorStop(0.5, hexToRgba(skin.pathGlow, 0.08));
        nebula1.addColorStop(1, 'transparent');
        ctx.fillStyle = nebula1;
        ctx.fillRect(0, 0, 500, 350);

        const nebula2 = ctx.createRadialGradient(720, 180, 20, 720, 180, 280);
        nebula2.addColorStop(0, hexToRgba(skin.accent, 0.20));
        nebula2.addColorStop(0.5, hexToRgba(skin.accent, 0.08));
        nebula2.addColorStop(1, 'transparent');
        ctx.fillStyle = nebula2;
        ctx.fillRect(450, 0, 510, 400);

        // 星星（白色系皮膚用深色星星，其他用白色）
        const isLightSkin = (skin === SKINS.white);
        const now = performance.now();
        for (let i = 0; i < 80; i++) {
            const sx = (i * 137.5) % BASE_W;
            const sy = (i * 73.3) % BASE_H;
            const baseSize = 0.4 + ((i * 17) % 10) / 10;
            const twinkle = 0.5 + 0.5 * Math.sin(now / 1200 + i * 1.7);
            const sr = baseSize * (0.6 + twinkle * 0.5);
            const alpha = 0.35 + twinkle * 0.45;
            if (isLightSkin) {
                ctx.fillStyle = 'rgba(40, 60, 100, ' + alpha + ')';
            } else {
                ctx.fillStyle = 'rgba(255, 245, 220, ' + alpha + ')';
            }
            ctx.beginPath();
            ctx.arc(sx, sy, sr, 0, Math.PI * 2);
            ctx.fill();
        }

        // 遠山（用皮膚色）
        ctx.save();
        const darken = function(hex, factor) {
            const h = hex.replace('#', '');
            const r = Math.max(0, Math.floor(parseInt(h.substring(0, 2), 16) * factor));
            const g = Math.max(0, Math.floor(parseInt(h.substring(2, 4), 16) * factor));
            const b = Math.max(0, Math.floor(parseInt(h.substring(4, 6), 16) * factor));
            return 'rgb(' + r + ',' + g + ',' + b + ')';
        };

        ctx.fillStyle = hexToRgba(skin.sky[2], 0.9);
        ctx.beginPath();
        ctx.moveTo(0, BASE_H);
        const peaks1 = [[0, 420], [80, 340], [160, 380], [260, 300], [360, 360], [480, 280], [580, 340], [700, 290], [820, 350], [960, 300]];
        for (let i = 0; i < peaks1.length; i++) ctx.lineTo(peaks1[i][0], peaks1[i][1]);
        ctx.lineTo(BASE_W, BASE_H);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = hexToRgba(skin.sky[3], 0.95);
        ctx.beginPath();
        ctx.moveTo(0, BASE_H);
        const peaks2 = [[0, 470], [120, 400], [240, 440], [380, 380], [500, 430], [640, 390], [780, 440], [900, 400], [960, 430]];
        for (let i = 0; i < peaks2.length; i++) ctx.lineTo(peaks2[i][0], peaks2[i][1]);
        ctx.lineTo(BASE_W, BASE_H);
        ctx.closePath();
        ctx.fill();

        const footGlow = ctx.createRadialGradient(BASE_W / 2, BASE_H, 0, BASE_W / 2, BASE_H, 400);
        footGlow.addColorStop(0, hexToRgba(skin.pathGlow, 0.15));
        footGlow.addColorStop(1, 'transparent');
        ctx.fillStyle = footGlow;
        ctx.fillRect(0, BASE_H - 300, BASE_W, 300);
        ctx.restore();
    };

    // ============ 視覺套用：路徑 ============
    const _prevDrawPath = drawPath;
    drawPath = function() {
        const skin = getCurrentSkin();

        ctx.save();

        // 外層光暈
        ctx.beginPath();
        ctx.moveTo(PATH[0].x, PATH[0].y);
        for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
        ctx.strokeStyle = hexToRgba(skin.pathGlow, 0.18);
        ctx.lineWidth = 58;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        ctx.strokeStyle = hexToRgba(skin.pathGlow, 0.30);
        ctx.lineWidth = 48;
        ctx.stroke();

        ctx.strokeStyle = '#2a2438';
        ctx.lineWidth = 38;
        ctx.stroke();

        // 石紋
        ctx.strokeStyle = 'rgba(70, 60, 100, 0.5)';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < PATH.length - 1; i++) {
            const a = PATH[i], b = PATH[i + 1];
            const len = Math.hypot(b.x - a.x, b.y - a.y);
            const angle = Math.atan2(b.y - a.y, b.x - a.x);
            const perpX = -Math.sin(angle), perpY = Math.cos(angle);
            const segLen = 22;
            const numSegs = Math.floor(len / segLen);
            for (let j = 0; j < numSegs; j++) {
                const t = (j + 0.5) / numSegs;
                const cx = a.x + (b.x - a.x) * t;
                const cy = a.y + (b.y - a.y) * t;
                const halfW = 16;
                ctx.beginPath();
                ctx.moveTo(cx - perpX * halfW, cy - perpY * halfW);
                ctx.lineTo(cx + perpX * halfW, cy + perpY * halfW);
                ctx.stroke();
            }
        }

        // 內層發光邊（用皮膚色）
        ctx.strokeStyle = hexToRgba(skin.path, 0.85);
        ctx.lineWidth = 3;
        ctx.shadowColor = skin.path;
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // 金塔履帶
        if (hasGoldTower) {
            ctx.save();
            ctx.setLineDash([12, 18]);
            ctx.lineDashOffset = (performance.now() / 25) % 30;
            ctx.strokeStyle = 'rgba(200, 150, 20, 0.55)';
            ctx.lineWidth = 38;
            ctx.stroke();
            ctx.setLineDash([6, 24]);
            ctx.lineDashOffset = (performance.now() / 25) % 30;
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.75)';
            ctx.lineWidth = 10;
            ctx.stroke();
            ctx.restore();
        }

        ctx.restore();
    };

    // ============ 視覺套用：塔底盤（可選，用皮膚的 accent 微調外框） ============
    const _prevDrawTowerBase = drawTowerBase;
    drawTowerBase = function(x, y, color, isSpecial) {
        _prevDrawTowerBase.call(this, x, y, color, isSpecial);
        // 加一層淡淡的皮膚色外暈
        const skin = getCurrentSkin();
        if (skin !== SKINS.classic) {
            ctx.save();
            ctx.strokeStyle = hexToRgba(skin.accent, 0.15);
            ctx.lineWidth = 1.5;
            const r = 70 * 0.55;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = -Math.PI / 2 + i * Math.PI / 3;
                const px = x + Math.cos(a) * r;
                const py = y + Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }
    };

    // ============ 主選單按鈕高亮當前皮膚 ============
    function refreshSkinPanel() {
        // 讓第一批的 renderSkins 重新觸發
        // 因為第一批的 renderSkins 是封閉的，最簡單方式：模擬點擊面板開關
        const panel = document.getElementById('skinPanel');
        if (!panel) return;
        const isOpen = panel.classList.contains('show');
        if (isOpen) {
            // 找到面板內某個 tab 或觸發重繪
            // 用一個 hack：呼叫皮膚按鈕的 click 事件
            const btn = document.getElementById('skinBtn');
            if (btn) btn.click();

        }
    }, 300);

    console.log('[皮膚3] 修正系統載入完成，目前皮膚：' + readCurrentSkin());
})();

        const mountains = '<div style="position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(180deg,transparent 0%,' + c.sky[2] + ' 50%,' + c.sky[3] + ' 100%);clip-path:polygon(0% 100%,0% 65%,12% 40%,25% 55%,40% 25%,55% 50%,70% 30%,85% 55%,100% 35%,100% 100%);"></div>';
        const path = '<div style="position:absolute;left:-5%;right:-5%;top:52%;height:24%;transform:translateY(-50%);border-radius:50px;background:' + c.path + ';box-shadow:0 0 20px ' + c.glow + ',0 0 40px ' + c.glow + ';opacity:0.85;"></div>';
        const tower = '<div style="position:absolute;bottom:18%;left:50%;width:14%;aspect-ratio:1;transform:translateX(-50%);clip-path:polygon(50% 0%,82% 30%,68% 100%,32% 100%,18% 30%);background:' + c.tower + ';box-shadow:0 0 15px ' + c.glow + ';"></div>';
        return '<div style="position:absolute;inset:0;background:' + skyGrad + ';overflow:hidden;">' + stars + path + tower + mountains + '</div>';
    }

    function openDetail(id) {
        const meta = SKIN_META[id];
        const colors = SKIN_COLORS[id];
        if (!meta || !colors) return;
        detailId = id;

        document.getElementById('sdV3Preview').innerHTML = makeBigPreview(id);
        document.getElementById('sdV3Name').textContent = meta.name;
        document.getElementById('sdV3Desc').textContent = meta.desc;

        const current = readCurrent();
        const unlocked = readUnlocked();
        const isUnlocked = unlocked[id] === true || id === 'classic';
        const isEquipped = current === id;
        const tickets = readTickets();
        const actionBtn = document.getElementById('sdV3Action');
        const condEl = document.getElementById('sdV3Condition');

        if (isEquipped) {
            condEl.textContent = '✅ 目前使用中';
            condEl.style.color = '#4ec472';
            condEl.style.borderColor = 'rgba(78,196,114,0.4)';
            condEl.style.background = 'rgba(78,196,114,0.08)';
            actionBtn.textContent = '已裝備';
            actionBtn.disabled = true;
            actionBtn.style.background = '#444';
            actionBtn.style.color = '#888';
        } else if (isUnlocked) {
            condEl.textContent = '✅ 已解鎖';
            condEl.style.color = '#4ec472';
            condEl.style.borderColor = 'rgba(78,196,114,0.4)';
            condEl.style.background = 'rgba(78,196,114,0.08)';
            actionBtn.textContent = '使用';
            actionBtn.disabled = false;
            actionBtn.style.background = 'linear-gradient(135deg,#ffd700,#ff8800)';
            actionBtn.style.color = '#0a0a14';
        } else if (meta.price) {
            condEl.textContent = '🎟️ ' + meta.condition + '｜你有 ' + tickets + ' 券';
            condEl.style.color = '#ffd700';
            condEl.style.borderColor = 'rgba(255,215,0,0.3)';
            condEl.style.background = 'rgba(255,215,0,0.08)';
            if (tickets >= meta.price) {
                actionBtn.textContent = '購買 (' + meta.price + '🎟️)';
                actionBtn.disabled = false;
                actionBtn.style.background = 'linear-gradient(135deg,#ffd700,#ff8800)';
                actionBtn.style.color = '#0a0a14';
            } else {
                actionBtn.textContent = '券不足';
                actionBtn.disabled = true;
                actionBtn.style.background = '#444';
                actionBtn.style.color = '#888';
            }
        } else {
            condEl.textContent = '🔒 ' + meta.condition;
            condEl.style.color = '#ff8888';
            condEl.style.borderColor = 'rgba(255,136,136,0.3)';
            condEl.style.background = 'rgba(255,136,136,0.08)';
            actionBtn.textContent = '條件未達成';
            actionBtn.disabled = true;
            actionBtn.style.background = '#444';
            actionBtn.style.color = '#888';
        }

        modal.style.display = 'flex';
    }

    function closeDetail() {
        modal.style.display = 'none';
        detailId = null;
    }

    function refreshPanel() {
        const panel = document.getElementById('skinPanelV3');
        if (panel && panel.style.display !== 'none') {
            const btn = document.getElementById('skinBtnV3');
            if (btn) {
                panel.style.display = 'none';
                setTimeout(function() { btn.click(); }, 30);
            }
        }
    }

    document.getElementById('sdV3Close').addEventListener('pointerdown', function(e) {
        e.preventDefault(); e.stopPropagation(); closeDetail();
    }, { passive: false });

    document.getElementById('sdV3Action').addEventListener('pointerdown', function(e) {
        e.preventDefault(); e.stopPropagation();
        if (!detailId) return;
        const id = detailId;
        const meta = SKIN_META[id];
        if (!meta) return;

        const current = readCurrent();
        const unlocked = readUnlocked();
        const isUnlocked = unlocked[id] === true || id === 'classic';

        if (id === current) return;

        if (isUnlocked) {
            writeCurrent(id);
            if (typeof log === 'function') log('🎨 已裝備：' + meta.name, 2000);
            if (typeof sfxPlace === 'function') sfxPlace();
            closeDetail();
            refreshPanel();
            return;
        }

        if (meta.price) {
            const tickets = readTickets();
            if (tickets < meta.price) return;
            if (confirm('確定花 ' + meta.price + ' 皮膚券購買「' + meta.name + '」嗎？')) {
                writeTickets(tickets - meta.price);
                const u = readUnlocked();
                u[id] = true;
                writeUnlocked(u);
                writeCurrent(id);
                if (typeof log === 'function') log('🎨 購買並裝備：' + meta.name, 2500);
                if (typeof sfxGold === 'function') sfxGold();
                closeDetail();
                refreshPanel();
            }
        }
    }, { passive: false });

    // ============ 攔截卡片點擊（捕獲階段，比原本的 handler 早執行） ============
    const grid = document.getElementById('skinGridV3');
    if (grid) {
        grid.addEventListener('click', function(e) {
            const card = e.target.closest('.skin-card-v3');
            if (!card) return;
            e.stopImmediatePropagation();
            e.preventDefault();
            openDetail(card.dataset.skinId);
        }, true);
        console.log('[皮膚4] 卡片點擊攔截已綁定');
    } else {
        console.warn('[皮膚4] 找不到 skinGridV3，可能第三批載入失敗');
    }

    console.log('[皮膚4] 詳情預覽載入完成');
})();
</script>

<script>
// ============================================================
// 大廳背景切換系統（改良版：圖片載入失敗會 fallback）
// ============================================================
(function() {
    'use strict';
    console.log('[大廳] 背景切換系統載入中...');

    // ============ 圖片對應表 ============
    const SKIN_BG = {
        classic: 'bg-classic.jpg',
        deepsea: 'bg-deepsea.jpg',
        inferno: 'bg-inferno.jpg',
        dark:    'bg-dark.jpg',
        gold:    'bg-gold.jpg',
        // 沒有圖的皮膚：草原、生物、純白 → 沿用 bg.jpg
    };

    const DEFAULT_BG = 'bg.jpg';

    function getCurrentSkin() {
        try {
            return localStorage.getItem('towerDefenseCurrentSkin_v1') || 'classic';
        } catch (e) {
            return 'classic';
        }
    }

    // 檢查圖片是否存在（避免 404 造成空白背景）
    const _bgCache = {};
    function checkImageExists(src, callback) {
        if (_bgCache[src] !== undefined) {
            callback(_bgCache[src]);
            return;
        }
        const img = new Image();
        img.onload = function() {
            _bgCache[src] = true;
            callback(true);
        };
        img.onerror = function() {
            _bgCache[src] = false;
            callback(false);
        };
        img.src = src;
    }

    function applyMenuBg(skinId) {
        const menu = document.getElementById('mainMenu');
        if (!menu) return;

        const bgFile = SKIN_BG[skinId];

        const overlay = 'linear-gradient(180deg, rgba(10,5,25,0.15) 0%, rgba(5,2,15,0.4) 50%, rgba(5,2,15,0.75) 100%)';

        if (!bgFile) {
            menu.style.background = overlay + ', url("' + DEFAULT_BG + '") center center / cover no-repeat';
            return;
        }

        checkImageExists(bgFile, function(exists) {
            if (exists) {
                menu.style.background = overlay + ', url("' + bgFile + '") center center / cover no-repeat';
                console.log('[大廳] 套用背景：' + bgFile);
            } else {
                menu.style.background = overlay + ', url("' + DEFAULT_BG + '") center center / cover no-repeat';
                console.log('[大廳] 找不到 ' + bgFile + '，使用預設背景');
            }
        });
    }

    // ============ 監聽皮膚變更 ============
    let lastSkin = getCurrentSkin();
    applyMenuBg(lastSkin);

    setInterval(function() {
        const current = getCurrentSkin();
        if (current !== lastSkin) {
            lastSkin = current;
            console.log('[大廳] 偵測到皮膚變更：' + current);
            applyMenuBg(current);
        }
    }, 300);

    // ============ 皮膚面板開啟時也重新套用（保險） ============
    const skinBtn = document.getElementById('skinBtnV3') || document.getElementById('skinBtn');
    if (skinBtn) {
        skinBtn.addEventListener('click', function() {
            setTimeout(function() {
                applyMenuBg(getCurrentSkin());
            }, 200);
        });
    }

    console.log('[大廳] 背景切換系統載入完成，目前皮膚：' + lastSkin);
})();
</script>

<script>
// ============================================================
// 皮膚系統：修正事件穿透
// ============================================================
(function() {
    'use strict';
    console.log('[皮膚5] 事件穿透修正載入中...');

    // ============ 修 1：詳情彈窗開啟時，皮膚面板完全隔離 ============
    const modal = document.getElementById('skinDetailV3');
    const panel = document.getElementById('skinPanelV3');

    if (modal && panel) {
        // 用 MutationObserver 監聽 modal 的 display 變化
        const observer = new MutationObserver(function() {
            const isOpen = modal.style.display === 'flex';
            if (isOpen) {
                // 彈窗開啟：禁用皮膚面板所有事件
                panel.style.pointerEvents = 'none';
                // 額外保險：讓面板稍微變暗，視覺上也知道它在後面
                panel.style.opacity = '0.4';
                panel.style.transition = 'opacity 0.2s';
            } else {
                panel.style.pointerEvents = 'auto';
                panel.style.opacity = '1';
            }
        });
        observer.observe(modal, { attributes: true, attributeFilter: ['style'] });
        console.log('[皮膚5] 彈窗隔離器已綁定');
    }

    // ============ 修 2：點彈窗背景也能關閉 ============
    if (modal) {
        modal.addEventListener('pointerdown', function(e) {
            // 只有點到「modal 本身」才關（不是點到內部的白框）
            if (e.target === modal) {
                e.preventDefault();
                e.stopPropagation();
                modal.style.display = 'none';
            }
        }, true); // 捕獲階段攔截
    }

    // ============ 修 3：關閉按鈕的防連點 ============
    const closeBtn = document.getElementById('sdV3Close');
    if (closeBtn) {
        let lastCloseTime = 0;
        closeBtn.addEventListener('pointerdown', function(e) {
            const now = performance.now();
            if (now - lastCloseTime < 300) {
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            lastCloseTime = now;
        }, true);
    }

    // ============ 修 4：卡片點擊防連點 ============
    // 皮膚面板的卡片如果被連點，會連續彈出兩個彈窗（或先開再關）
    let lastCardClickTime = 0;
    const grid = document.getElementById('skinGridV3');
    if (grid) {
        grid.addEventListener('click', function(e) {
            const now = performance.now();
            if (now - lastCardClickTime < 400) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return;
            }
            lastCardClickTime = now;
        }, true);
        console.log('[皮膚5] 卡片防連點已綁定');
    }

    // ============ 修 5：點卡片時，自動滾動到該卡片位置（可選） ============
    // 避免「手指還在下方，但點到的是上面卡片」的錯位感
    // （這個是 nice-to-have，不做也不會壞）

    // ============ 修 6：彈窗開啟時禁止頁面滾動（iOS 常有的問題） ============
    if (modal) {
        const scrollObserver = new MutationObserver(function() {
            if (modal.style.display === 'flex') {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        });
        scrollObserver.observe(modal, { attributes: true, attributeFilter: ['style'] });
    }

    console.log('[皮膚5] 事件穿透修正載入完成');
})();
</script>

<script>
// ============================================================
// 皮膚詳情彈窗改造：右上角叉叉 + 全寬使用按鈕
// ============================================================
(function() {
    'use strict';
    console.log('[皮膚6] 彈窗改造載入中...');

    const modal = document.getElementById('skinDetailV3');
    if (!modal) {
        console.error('[皮膚6] 找不到 skinDetailV3');
        return;
    }

    // ============ 重新建構內部結構 ============
    const box = modal.querySelector('div');
    if (!box) return;

    // 改造外框樣式（加上相對定位，讓叉叉能絕對定位）
    box.style.position = 'relative';
    box.style.paddingTop = '40px'; // 給叉叉留空間

    // 重建 HTML（保留預覽圖、名稱、描述、條件，移除底部按鈕列）
    box.innerHTML =
        '<button id="sdV3Close2" style="' +
            'position:absolute;top:12px;right:12px;' +
            'width:36px;height:36px;' +

            'background:rgba(60,30,50,0.9);' +

            'font-size:16px;' +

            'cursor:pointer;' +
            'font-family:inherit;' +
            'display:flex;align-items:center;justify-content:center;' +
            'transition:0.15s;' +
            'padding:0;' +
            'z-index:10;' +
        '" onpointerover="this.style.background=\'rgba(120,60,90,0.95)\'" onpointerout="this.style.background=\'rgba(60,30,50,0.9)\'">✕</button>' +
        '<div id="sdV3Preview" style="width:100%;aspect-ratio:1.6/1;border-radius:10px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.15);"></div>' +
        '<div id="sdV3Name" style="font-size:20px;font-weight:900;color:#fff;letter-spacing:3px;margin-bottom:8px;"></div>' +
        '<div id="sdV3Desc" style="font-size:13px;color:#aaa;line-height:1.6;margin-bottom:12px;min-height:42px;"></div>' +
        '<div id="sdV3Condition" style="font-size:12px;color:#ffd700;padding:8px 12px;background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.3);border-radius:8px;margin-bottom:16px;line-height:1.5;"></div>' +
        '<button id="sdV3Action2" style="' +
            'width:100%;' +
            'padding:14px;' +
            'border-radius:10px;' +
            'border:none;' +
            'font-weight:900;' +
            'font-size:15px;' +
            'cursor:pointer;' +
            'font-family:inherit;' +
            'letter-spacing:3px;' +
            'transition:0.15s;' +
            'background:linear-gradient(135deg,#ffd700,#ff8800);' +
            'color:#0a0a14;' +
            'box-shadow:0 4px 16px rgba(255,215,0,0.35);' +
        '">使用</button>';

    console.log('[皮膚6] 彈窗結構已重建');

    // ============ 重新綁定：叉叉關閉 ============
    const closeBtn = document.getElementById('sdV3Close2');
    if (closeBtn) {
        closeBtn.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            e.stopPropagation();
            modal.style.display = 'none';
            // 恢復皮膚面板可點
            const panel = document.getElementById('skinPanelV3');
            if (panel) {
                panel.style.pointerEvents = 'auto';
                panel.style.opacity = '1';
            }
        }, { passive: false });
    }

    // ============ 重新綁定：全寬使用按鈕 ============
    const actionBtn = document.getElementById('sdV3Action2');
    if (actionBtn) {
        actionBtn.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            e.stopPropagation();
            handleAction();
        }, { passive: false });
    }

    // ============ 點彈窗背景關閉 ============
    modal.addEventListener('pointerdown', function(e) {
        if (e.target === modal) {
            e.preventDefault();
            modal.style.display = 'none';
            const panel = document.getElementById('skinPanelV3');
            if (panel) {
                panel.style.pointerEvents = 'auto';
                panel.style.opacity = '1';
            }
        }
    }, true);

    // ============ 處理使用 / 購買 ============
    function handleAction() {
        const nameEl = document.getElementById('sdV3Name');
        const actionEl = document.getElementById('sdV3Action2');
        if (!nameEl || !actionEl) return;

        const name = nameEl.textContent;
        const skinId = findSkinIdByName(name);
        if (!skinId) return;

        // 已裝備
        if (actionEl.textContent === '已裝備') return;

        // 未解鎖 → 條件未達成
        if (actionEl.textContent === '條件未達成') {
            if (typeof log === 'function') log('🔒 ' + name + '：條件尚未達成', 2000);
            return;
        }

        // 未解鎖 → 券不足
        if (actionEl.textContent === '券不足') {
            if (typeof log === 'function') log('🎟️ 皮膚券不足', 2000);
            return;
        }

        const meta = getSkinMeta(skinId);
        if (!meta) return;

        const current = readCurrent();
        const unlocked = readUnlocked();
        const isUnlocked = unlocked[skinId] === true || skinId === 'classic';

        if (isUnlocked) {
            // 直接使用
            writeCurrent(skinId);
            if (typeof log === 'function') log('🎨 已裝備：' + name, 2000);
            if (typeof sfxPlace === 'function') sfxPlace();
            modal.style.display = 'none';
            const panel = document.getElementById('skinPanelV3');
            if (panel) {
                panel.style.pointerEvents = 'auto';
                panel.style.opacity = '1';
            }
            refreshPanel();
            return;
        }

        // 商店購買
        if (meta.price) {
            const tickets = readTickets();
            if (tickets < meta.price) {
                if (typeof log === 'function') log('🎟️ 券不足（需 ' + meta.price + '）', 2000);
                return;
            }
            if (confirm('確定花 ' + meta.price + ' 皮膚券購買「' + name + '」嗎？')) {
                writeTickets(tickets - meta.price);
                const u = readUnlocked();
                u[skinId] = true;
                writeUnlocked(u);
                writeCurrent(skinId);
                if (typeof log === 'function') log('🎨 購買並裝備：' + name, 2500);
                if (typeof sfxGold === 'function') sfxGold();
                modal.style.display = 'none';
                const panel = document.getElementById('skinPanelV3');
                if (panel) {
                    panel.style.pointerEvents = 'auto';
                    panel.style.opacity = '1';
                }
                refreshPanel();
            }
        }
    }

    // ============ 工具函式 ============
    const SKIN_LIST = [
        { id: 'classic', name: '經典' },
        { id: 'grass', name: '草原' },
        { id: 'deepsea', name: '深海' },
        { id: 'inferno', name: '烈焰' },
        { id: 'bio', name: '生物' },
        { id: 'gold', name: '黃金' },
        { id: 'dark', name: '暗黑' },
        { id: 'white', name: '純白' },
    ];

    const SKIN_META = {
        classic: { price: 0 },
        grass: { price: 0 },
        deepsea: { price: 300 },
        inferno: { price: 400 },
        bio: { price: 0 },
        gold: { price: 0 },
        dark: { price: 0 },
        white: { price: 0 },
    };

    function findSkinIdByName(name) {
        for (let i = 0; i < SKIN_LIST.length; i++) {
            if (SKIN_LIST[i].name === name) return SKIN_LIST[i].id;
        }
        return null;
    }

    function getSkinMeta(id) {
        return SKIN_META[id] || {};
    }

    function readCurrent() {
        try { return localStorage.getItem('towerDefenseCurrentSkin_v1') || 'classic'; }
        catch (e) { return 'classic'; }
    }
    function readTickets() {
        try { return parseInt(localStorage.getItem('towerDefenseSkinTickets_v1') || '0', 10) || 0; }
        catch (e) { return 0; }
    }
    function readUnlocked() {
        try {
            const r = localStorage.getItem('towerDefenseUnlockedSkins_v1');
            if (!r) return { classic: true };
            const o = JSON.parse(r);
            o.classic = true;
            return o;
        } catch (e) { return { classic: true }; }
    }
    function writeCurrent(id) {
        try { localStorage.setItem('towerDefenseCurrentSkin_v1', id); } catch (e) {}
    }
    function writeTickets(n) {
        try { localStorage.setItem('towerDefenseSkinTickets_v1', String(Math.max(0, n))); } catch (e) {}
    }
    function writeUnlocked(o) {
        try { localStorage.setItem('towerDefenseUnlockedSkins_v1', JSON.stringify(o)); } catch (e) {}
    }

    function refreshPanel() {
        const panel = document.getElementById('skinPanelV3');
        if (panel && panel.style.display !== 'none') {
            const btn = document.getElementById('skinBtnV3');
            if (btn) {
                panel.style.display = 'none';
                setTimeout(function() { btn.click(); }, 30);
            }
        }
    }

    // ============ 每次彈窗顯示時，重新計算按鈕狀態 ============
    // 因為原本第四批的 openDetail 會設定按鈕文字，我們需要攔截這個行為
    // 用 MutationObserver 監聽 sdV3Name 的文字變化
    const nameEl = document.getElementById('sdV3Name');
    if (nameEl) {
        const nameObserver = new MutationObserver(function() {
            // 名稱變了 → 重算按鈕狀態
            const name = nameEl.textContent;
            const skinId = findSkinIdByName(name);
            if (!skinId) return;
            updateActionButton(skinId);
        });
        nameObserver.observe(nameEl, { childList: true, characterData: true, subtree: true });
    }

    function updateActionButton(skinId) {
        const actionEl = document.getElementById('sdV3Action2');
        if (!actionEl) return;

        const meta = getSkinMeta(skinId);
        const current = readCurrent();
        const unlocked = readUnlocked();
        const isUnlocked = unlocked[skinId] === true || skinId === 'classic';
        const isEquipped = current === skinId;
        const tickets = readTickets();

        if (isEquipped) {
            actionEl.textContent = '已裝備';
            actionEl.disabled = true;
            actionEl.style.background = '#444';
            actionEl.style.color = '#888';
            actionEl.style.cursor = 'not-allowed';
            actionEl.style.boxShadow = 'none';
        } else if (isUnlocked) {
            actionEl.textContent = '使用';
            actionEl.disabled = false;
            actionEl.style.background = 'linear-gradient(135deg,#ffd700,#ff8800)';
            actionEl.style.color = '#0a0a14';
            actionEl.style.cursor = 'pointer';
            actionEl.style.boxShadow = '0 4px 16px rgba(255,215,0,0.35)';
        } else if (meta.price > 0) {
            if (tickets >= meta.price) {
                actionEl.textContent = '購買（' + meta.price + ' 🎟️）';
                actionEl.disabled = false;
                actionEl.style.background = 'linear-gradient(135deg,#ffd700,#ff8800)';
                actionEl.style.color = '#0a0a14';
                actionEl.style.cursor = 'pointer';
                actionEl.style.boxShadow = '0 4px 16px rgba(255,215,0,0.35)';
            } else {
                actionEl.textContent = '券不足（需 ' + meta.price + ' 🎟️）';
                actionEl.disabled = true;
                actionEl.style.background = '#444';
                actionEl.style.color = '#888';
                actionEl.style.cursor = 'not-allowed';
                actionEl.style.boxShadow = 'none';

        } else {
            actionEl.textContent = '條件未達成';
            actionEl.disabled = true;
            actionEl.style.background = '#444';
            actionEl.style.color = '#888';
            actionEl.style.cursor = 'not-allowed';
            actionEl.style.boxShadow = 'none';
        }
    }

    console.log('[皮膚6] 彈窗改造載入完成');
})();
</script>

        if (fixed > 0) {
            console.log('[皮膚8] ★ 補上 ' + fixed + ' 個佔位元素');

    const ok = ensurePlaceholders();

<script>
// ============================================================
// 皮膚解鎖修正：通關自動解鎖對應皮膚
// ============================================================
(function() {
    'use strict';
    console.log('[皮膚9] 解鎖修正載入中...');

    const UNLOCKED_KEY = 'towerDefenseUnlockedSkins_v1';

    function readUnlocked() {
        try {
            const r = localStorage.getItem(UNLOCKED_KEY);
            if (!r) return { classic: true };
            const o = JSON.parse(r);
            o.classic = true;
            return o;
        } catch (e) { return { classic: true }; }
    }

    function writeUnlocked(o) {
        try { localStorage.setItem(UNLOCKED_KEY, JSON.stringify(o)); } catch (e) {}
    }

    function unlockSkin(id, skinName) {
        const u = readUnlocked();
        if (u[id] === true) return false;
        u[id] = true;
        writeUnlocked(u);
        if (typeof log === 'function') log('🎨 解鎖新皮膚：' + skinName + '！', 3000);
        if (typeof sfxGold === 'function') sfxGold();
        console.log('[皮膚9] 解鎖：' + id);
        return true;
    }

    // ============ 包裝 finishGame 處理通關解鎖 ============
    const _originalFinishGame = finishGame;

    finishGame = function(didVictory) {
        // 先呼叫原版
        _originalFinishGame.call(this, didVictory);

        if (!didVictory) return;

        const diff = typeof currentDifficulty !== 'undefined' ? currentDifficulty : null;
        if (!diff) return;

        // 取得起始生命（判斷無傷）
        const startLives = (typeof DIFFICULTIES !== 'undefined' && DIFFICULTIES[diff])
            ? DIFFICULTIES[diff].startLives
            : 20;

        const isPerfect = (typeof lives !== 'undefined' && lives === startLives);

        console.log('[皮膚9] 通關：' + diff + '，剩餘生命：' + lives + ' / ' + startLives + '，無傷：' + isPerfect);

        // 依難度解鎖
        if (diff === 'easy') {
            unlockSkin('grass', '草原');
        } else if (diff === 'normal') {
            unlockSkin('gold', '黃金');
        } else if (diff === 'hard') {
            unlockSkin('dark', '暗黑');
        }

        // 無傷通關（任一難度）→ 純白
        if (isPerfect) {
            unlockSkin('white', '純白');
        }
    };

    // ============ 首次進化 → 解鎖生物 ============
    const _originalEvolve = window.evolveSelectedTower;
    if (typeof _originalEvolve === 'function') {
        window.evolveSelectedTower = function(branch) {
            const result = _originalEvolve.call(this, branch);
            // 進化成功後解鎖生物
            setTimeout(function() {
                unlockSkin('bio', '生物');
            }, 200);
            return result;
        };
    }

    // ============ 頁面載入時，檢查玩家是否已經通關過（補救舊進度） ============
    setTimeout(function() {
        // 檢查玩家各難度的最佳紀錄，如果通關過就補解鎖
        const firstEasyKey = 'towerDefenseFirstClear_easy';
        const firstNormalKey = 'towerDefenseFirstClear_normal';
        const firstHardKey = 'towerDefenseFirstClear_hard';

        try {
            if (localStorage.getItem(firstEasyKey)) {
                unlockSkin('grass', '草原');
            }
            if (localStorage.getItem(firstNormalKey)) {
                unlockSkin('gold', '黃金');
            }
            if (localStorage.getItem(firstHardKey)) {
                unlockSkin('dark', '暗黑');
            }
        } catch (e) {}
    }, 1500);

    console.log('[皮膚9] 解鎖修正載入完成');
})();
</script>
