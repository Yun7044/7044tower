<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #game {
    position: fixed; display: block;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

   /* ===== UI 收起 ===== */
  #topBar, #bottomBar {
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.3s ease;
  }
  body.ui-hidden #topBar {
    transform: translateY(-130%);
    opacity: 0;
    pointer-events: none;
  }
  body.ui-hidden #bottomBar {
    transform: translateY(130%);
    opacity: 0;
    pointer-events: none;
  }
  body.ui-hidden #statsPanel {
    transform: translateX(130%);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.3s, opacity 0.3s;
  }
  body.ui-hidden #bossBar {
    transform: translate(-50%, -130%);
    opacity: 0;
    transition: transform 0.35s, opacity 0.3s;
  }
  #statsPanel {
    transition: transform 0.3s, opacity 0.3s;
  }
  #bossBar {
    transition: transform 0.35s, opacity 0.3s;
  }
 
      #mainMenu {
    position: fixed; inset: 0;
    background:
      linear-gradient(180deg, rgba(10, 5, 25, 0.15) 0%, rgba(5, 2, 15, 0.4) 50%, rgba(5, 2, 15, 0.75) 100%),
      url('bg.jpg') center center / cover no-repeat;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px 20px; z-index: 50; gap: 12px;
    overflow-y: auto;
  }
  #mainMenu.show { display: flex; }

  #mainMenu::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(1px 1px at 15% 20%, #fff, transparent),
      radial-gradient(1px 1px at 80% 15%, #ffe680, transparent),
      radial-gradient(2px 2px at 25% 70%, #fff, transparent),
      radial-gradient(1px 1px at 65% 85%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, #ffe680, transparent),
      radial-gradient(1px 1px at 40% 40%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 25%, #fff, transparent);
    background-size: 100% 100%;
    opacity: 0.6;
    animation: starTwinkle 5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes starTwinkle {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }

  #mainMenu h1 {
    position: relative;
    font-size: clamp(48px, 14vw, 76px);
    font-weight: 900;
    letter-spacing: 14px;
    background: linear-gradient(180deg, #fff6c0 0%, #ffd700 35%, #e8a000 65%, #b87000 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter:
      drop-shadow(0 0 24px rgba(255, 215, 0, 0.85))
      drop-shadow(0 0 50px rgba(255, 180, 0, 0.4));
    margin-bottom: 4px;
    text-align: center;
    padding-left: 14px;
  }

  #mainMenu .subtitle {
    position: relative;
    font-size: 13px;
    color: #e8d48a;
    letter-spacing: 8px;
    margin-bottom: 4px;
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
  }
  #mainMenu .subtitle::before,
  #mainMenu .subtitle::after {
    content: '◆';
    color: #ffd700;
    font-size: 9px;
    margin: 0 12px;
    vertical-align: middle;
    text-shadow: 0 0 8px #ffd700;
  }

  #mainMenu .player-name {
    position: relative;
    font-size: 13px;
    color: #ffd700;
    margin-bottom: 14px;
    padding: 7px 22px;
    border-radius: 20px;
    background: rgba(20, 15, 40, 0.85);
    border: 1.5px solid rgba(255, 215, 0, 0.55);
    box-shadow:
      0 0 16px rgba(255, 215, 0, 0.25),
      inset 0 0 12px rgba(255, 215, 0, 0.08);
    letter-spacing: 2px;
    cursor: pointer;
  }
  #mainMenu .player-name::before {
    content: '👑 ';
    color: #ffd700;
  }

  .diff-btn {
    position: relative;
    width: min(340px, 88vw);
    padding: 14px 20px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(30, 20, 60, 0.95) 0%, rgba(15, 10, 35, 0.95) 100%);
    color: #fff; cursor: pointer;
    display: flex; align-items: center; gap: 14px;
    transition: 0.25s;
    font-family: inherit; text-align: left;
    overflow: hidden;
  }
  .diff-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 10px;
    pointer-events: none;
    background:
      linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%);
  }
  .diff-btn:active { transform: scale(0.985); }
  .diff-btn:hover { transform: translateX(3px); }

  .diff-btn[data-difficulty="easy"] {
    border: 2px solid #3a7a4a;
    box-shadow:
      0 0 0 1px rgba(46, 204, 113, 0.2),
      0 4px 20px rgba(46, 204, 113, 0.15),
      inset 0 0 24px rgba(46, 204, 113, 0.08);
  }
  .diff-btn[data-difficulty="easy"]:hover {
    border-color: #4ec472;
    box-shadow:
      0 0 0 1px rgba(46, 204, 113, 0.4),
      0 6px 28px rgba(46, 204, 113, 0.35),
      inset 0 0 30px rgba(46, 204, 113, 0.15);
  }
  .diff-btn[data-difficulty="normal"] {
    border: 2px solid #8a6a1a;
    box-shadow:
      0 0 0 1px rgba(241, 196, 15, 0.2),
      0 4px 20px rgba(241, 196, 15, 0.15),
      inset 0 0 24px rgba(241, 196, 15, 0.08);
  }
  .diff-btn[data-difficulty="normal"]:hover {
    border-color: #ffd700;
    box-shadow:
      0 0 0 1px rgba(255, 215, 0, 0.4),
      0 6px 28px rgba(255, 215, 0, 0.35),
      inset 0 0 30px rgba(255, 215, 0, 0.15);
  }
  .diff-btn[data-difficulty="hard"] {
    border: 2px solid #8a2020;
    box-shadow:
      0 0 0 1px rgba(231, 76, 60, 0.2),
      0 4px 20px rgba(231, 76, 60, 0.15),
      inset 0 0 24px rgba(231, 76, 60, 0.08);
  }
  .diff-btn[data-difficulty="hard"]:hover {
    border-color: #ff4444;
    box-shadow:
      0 0 0 1px rgba(231, 76, 60, 0.4),
      0 6px 28px rgba(231, 76, 60, 0.35),
      inset 0 0 30px rgba(231, 76, 60, 0.15);
  }

  .diff-btn .badge {
    font-size: 26px;
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
    position: relative;
  }
  .diff-btn[data-difficulty="easy"] .badge {
    background: radial-gradient(circle, rgba(46, 204, 113, 0.3) 0%, rgba(46, 204, 113, 0.05) 100%);
    border: 1.5px solid rgba(46, 204, 113, 0.6);
    box-shadow: 0 0 16px rgba(46, 204, 113, 0.5), inset 0 0 12px rgba(46, 204, 113, 0.2);
  }
  .diff-btn[data-difficulty="normal"] .badge {
    background: radial-gradient(circle, rgba(241, 196, 15, 0.3) 0%, rgba(241, 196, 15, 0.05) 100%);
    border: 1.5px solid rgba(241, 196, 15, 0.6);
    box-shadow: 0 0 16px rgba(241, 196, 15, 0.5), inset 0 0 12px rgba(241, 196, 15, 0.2);
  }
  .diff-btn[data-difficulty="hard"] .badge {
    background: radial-gradient(circle, rgba(231, 76, 60, 0.3) 0%, rgba(231, 76, 60, 0.05) 100%);
    border: 1.5px solid rgba(231, 76, 60, 0.6);
    box-shadow: 0 0 16px rgba(231, 76, 60, 0.5), inset 0 0 12px rgba(231, 76, 60, 0.2);
  }

  .diff-btn .info { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .diff-btn .title {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
  }
  .diff-btn[data-difficulty="easy"] .title { color: #b8ffcc; text-shadow: 0 0 10px rgba(46, 204, 113, 0.5); }
  .diff-btn[data-difficulty="normal"] .title { color: #fff2a8; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
  .diff-btn[data-difficulty="hard"] .title { color: #ffb8b8; text-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }

  .diff-btn .desc {
    font-size: 11px;
    color: #998;
    letter-spacing: 1px;
  }
  .diff-btn .record {
    font-size: 11px;
    font-weight: 700;
    margin-top: 3px;
    letter-spacing: 1px;
    color: #bbb;
    text-align: right;
  }
  .diff-btn[data-difficulty="easy"] .record { color: #7ec894; }
  .diff-btn[data-difficulty="normal"] .record { color: #d4b84a; }
  .diff-btn[data-difficulty="hard"] .record { color: #d88080; }

async function updateNameOnServer() {
  if (!db || !currentUid) return;
  for (const diff of ['easy', 'normal', 'hard']) {

      const ref = db.collection('leaderboard').doc(diff).collection('scores').doc(currentUid);

let lbCurrentTab = 'easy';

async function fetchLeaderboard(difficulty) {
  if (!db) return [];
  const snap = await db.collection('leaderboard').doc(difficulty).collection('scores')
    .orderBy('wave', 'desc').orderBy('damage', 'desc').limit(50).get();
  const results = [];
  snap.forEach(d => {
    const data = d.data();
    results.push({
      uid: d.id,
      name: data.name || '無名',
      wave: data.wave || 0,
      damage: data.damage || 0,
      victory: data.victory || false,
    });
  });
  return results;
}

async function recordScore(difficulty, waveReached, totalDamage, towerStats, didVictory) {
  if (!firebaseReady || !currentUid || !playerName) {
    console.log('[Firebase] 未就緒，跳過上傳');
    return;
  }
  try {
    const ref = db.collection('leaderboard').doc(difficulty).collection('scores').doc(currentUid);
    const snap = await ref.get();
    if (snap.exists) {
      const old = snap.data();
      if (old.wave > waveReached) return;
      if (old.wave === waveReached && (old.damage || 0) >= totalDamage) return;
    }
    await ref.set({
      name: playerName,
      wave: waveReached,
      damage: Math.floor(totalDamage),
      victory: !!didVictory,
      towerStats: towerStats || {},
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    console.log('[Firebase] 已上傳成績');
  } catch (e) {
    console.error('[Firebase] 上傳失敗:', e);
  }
}

async function fetchBestRecord(difficulty) {
  if (!firebaseReady || !currentUid) return null;
  try {
    const ref = db.collection('leaderboard').doc(difficulty).collection('scores').doc(currentUid);
    const snap = await ref.get();
    return snap.exists ? snap.data() : null;
  } catch (e) {
    return null;
  }
}

async function updateMenuRecords() {
  for (const diff of ['easy', 'normal', 'hard']) {
    const el = document.getElementById('rec' + diff.charAt(0).toUpperCase() + diff.slice(1));
    if (el) el.textContent = '載入中...';
  }
  for (const diff of ['easy', 'normal', 'hard']) {
    const rec = await fetchBestRecord(diff);
    const el = document.getElementById('rec' + diff.charAt(0).toUpperCase() + diff.slice(1));
    if (!el) continue;
    if (!rec) {
      el.textContent = '尚無紀錄';
    } else {
      const v = rec.victory ? ' 👑' : '';
      el.textContent = '我的最佳：第 ' + rec.wave + ' 波 ｜ ' + formatNum(rec.damage) + v;
    }
  }
}

async function renderLeaderboard() {
  lbList.innerHTML = '<div class="lb-status">載入中...</div>';
  if (!firebaseReady) {
    lbList.innerHTML = '<div class="lb-status error">Firebase 連線中，請稍後再試</div>';
    return;
  }
  try {
    const list = await fetchLeaderboard(lbCurrentTab);
    if (list.length === 0) {
      lbList.innerHTML =
        '<div class="lb-empty">' +
          '<div class="icon">🏆</div>' +
          '<div>還沒有紀錄</div>' +
          '<div style="font-size:12px;margin-top:6px;color:#444;">去挑戰一下吧</div>' +
        '</div>';
      return;
    }
    let html = '';
    for (let i = 0; i < list.length; i++) {
      const rec = list[i];
      const rank = i + 1;
      const crown = rec.victory ? ' 👑' : '';
      const cls = [
        rank <= 3 ? 'rank-' + rank : '',
        rec.uid === currentUid ? 'is-me' : ''
      ].filter(Boolean).join(' ');
      const nameDisplay = rec.uid === currentUid ? rec.name + '（你）' : rec.name;
      html +=
        '<div class="lb-row ' + cls + '">' +
          '<div class="lb-rank">' + rank + '</div>' +
          '<div class="lb-info">' +
            '<div class="lb-name">' + escapeHtml(nameDisplay) + '</div>' +
            '<div class="lb-wave">第 ' + rec.wave + ' 波' + crown + '</div>' +
            '<div class="lb-damage">傷害 ' + formatNum(rec.damage) + '</div>' +
          '</div>' +
        '</div>';
    }
    lbList.innerHTML = html;
  } catch (e) {
    console.error('[Leaderboard] 讀取失敗:', e);
    let msg = '載入失敗，請檢查網路';
    if (e && e.message && e.message.indexOf('index') >= 0) {
      msg = '需要建立索引，請查看 Console 的連結';
    }
    lbList.innerHTML = '<div class="lb-status error">' + msg + '</div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function resize() {
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  const scale = Math.min(winW / BASE_W, winH / BASE_H);
  const dispW = BASE_W * scale, dispH = BASE_H * scale;
  canvas.style.width = dispW + 'px';
  canvas.style.height = dispH + 'px';

// ============ 音效 ============
let audioCtx = null, muted = false, musicEnabled = true, musicStarted = false, musicGain = null;
function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.35;
      musicGain.connect(audioCtx.destination);
    } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().then(() => {
      if (musicEnabled && !musicStarted && gameState === 'playing') {
        musicStarted = true; startBgm();
      }
    }).catch(() => {});
  } else if (audioCtx && audioCtx.state === 'running' && musicEnabled && !musicStarted && gameState === 'playing') {
    musicStarted = true; startBgm();
  }
}
function playTone(opts) {
  if (!audioCtx || muted) return;
  const o = opts || {};
  const freq = o.freq || 440;
  const slideTo = o.slideTo || null;
  const duration = o.duration || 0.1;
  const type = o.type || 'sine';
  const volume = o.volume || 0.3;
  const delay = o.delay || 0;
  try {
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + duration);
  } catch (e) {}
}
const throttleMap = {};
function throttled(key, ms, fn) {
  const now = performance.now();
  if (throttleMap[key] && now - throttleMap[key] < ms) return;
  throttleMap[key] = now; fn();
}

  'G3','D4','G3','D4','G3','D4','G3','D4',
];

// 低音根音
const BGM_BASS = ['A2', 'F2', 'C3', 'G2'];

// 超低頻墊底
const BGM_SUB = ['A1', 'F1', 'C2', 'G1'];

// 和弦墊（每小節一組三和音）
const BGM_PADS = [
  ['A3', 'C4', 'E4'],   // Am
  ['F3', 'A3', 'C4'],   // F
  ['C4', 'E4', 'G4'],   // C
  ['G3', 'B4', 'D5'],   // G
];

// 星光琶音音池
const BGM_STARS = ['C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'E6'];

let bgmPlaying = false;
let bgmTimer = null;
let bgmNextTime = 0;
let bgmStep = 0;

// 一般音符（可選 attack 時間，做出「飄」的進入感）
function scheduleBgmNote(freq, time, duration, volume, type, attack) {
  if (!audioCtx || !musicGain) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, time);
    const att = attack || 0.03;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(volume, time + att);
    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
    osc.connect(gain);
    gain.connect(musicGain);
    osc.start(time);
    osc.stop(time + duration + 0.05);
  } catch (e) {}
}

// 星光音：兩顆微微 detune 的 sine 疊在一起，做出 chorus 空靈感
function scheduleShimmer(freq, time, duration, volume) {
  if (!audioCtx || !musicGain) return;
  try {
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = 'sine';
    osc2.type = 'sine';
    osc1.frequency.setValueAtTime(freq, time);
    osc2.frequency.setValueAtTime(freq * 1.005, time);
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(volume, time + 0.5);
    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(musicGain);
    osc1.start(time); osc1.stop(time + duration + 0.05);
    osc2.start(time); osc2.stop(time + duration + 0.05);
  } catch (e) {}
}

function bgmScheduler() {
  if (!audioCtx || !bgmPlaying || document.hidden) return;
  const horizon = audioCtx.currentTime + BGM_LOOKAHEAD;

  while (bgmNextTime < horizon) {
    const step = bgmStep % 32;
    const bar = Math.floor(step / 8);
    const stepInBar = step % 8;

    // === 主旋律（triangle + 高八度輕微重疊）===
    const melodyNote = BGM_MELODY[step];
    if (melodyNote && NOTES[melodyNote]) {
      scheduleBgmNote(NOTES[melodyNote], bgmNextTime, 0.5, 0.20, 'triangle', 0.02);
      scheduleBgmNote(NOTES[melodyNote] * 2, bgmNextTime, 0.4, 0.05, 'sine', 0.05);
    }

    // === 低音（每小節，長 sustain）===
    if (stepInBar === 0) {
      const bassNote = BGM_BASS[bar];
      if (bassNote && NOTES[bassNote]) {
        scheduleBgmNote(NOTES[bassNote], bgmNextTime, 1.6, 0.30, 'sine', 0.08);
      }
    }

    // === 超低頻 Sub Bass（每小節，慢 attack 飄進來）===
    if (stepInBar === 0) {
      const subNote = BGM_SUB[bar];
      if (subNote && NOTES[subNote]) {
        scheduleBgmNote(NOTES[subNote], bgmNextTime, 2.5, 0.20, 'sine', 0.15);
      }
    }

    // === Pad 和弦（每小節第一個音觸發，慢 attack 0.6 秒）===
    if (stepInBar === 0) {
      const chord = BGM_PADS[bar];
      for (let i = 0; i < chord.length; i++) {
        scheduleBgmNote(NOTES[chord[i]], bgmNextTime, 2.8, 0.06, 'sine', 0.6);
      }
    }

    // === 星光琶音（每 4 步一次，很輕）===
    if (step % 4 === 2) {
      const starNote = BGM_STARS[Math.floor(Math.random() * BGM_STARS.length)];
      scheduleShimmer(NOTES[starNote], bgmNextTime, 1.5, 0.022);
    }

    // === 高頻閃爍（稀疏，開場和過半各一次）===
    if (step === 0 || step === 16) {
      const freq = 1200 + Math.random() * 800;
      scheduleShimmer(freq, bgmNextTime, 3.0, 0.012);
    }

    bgmNextTime += BGM_TEMPO;
    bgmStep++;
  }
}

function startBgm() {
  if (bgmPlaying || !audioCtx || muted) return;
  bgmPlaying = true;
  bgmNextTime = audioCtx.currentTime + 0.1;
  bgmStep = 0;
  if (bgmTimer) clearInterval(bgmTimer);
  bgmTimer = setInterval(bgmScheduler, BGM_INTERVAL);
}

function stopBgm() {
  if (!bgmPlaying) return;
  bgmPlaying = false;
  if (bgmTimer) clearInterval(bgmTimer);
  bgmTimer = null;
}
document.addEventListener('visibilitychange', function() {
  if (document.hidden) stopBgm();
  else if (musicEnabled && !muted && musicStarted && gameState === 'playing') startBgm();
});

let PATH = PATHS.hard;
let PATH_SEGMENTS = [];
let PATH_TOTAL = 0;

function setPath(difficulty) {
  PATH = PATHS[difficulty] || PATHS.hard;
  PATH_SEGMENTS = [];
  PATH_TOTAL = 0;
  for (let i = 0; i < PATH.length - 1; i++) {
    const a = PATH[i], b = PATH[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    PATH_SEGMENTS.push({ a: a, b: b, len: len, start: PATH_TOTAL });
    PATH_TOTAL += len;
  }
}
setPath('hard');
 
function getPosOnPath(distance) {
  if (distance <= 0) {
    const a = PATH[0], b = PATH[1];
    return { x: a.x, y: a.y, angle: Math.atan2(b.y - a.y, b.x - a.x) };
  }
  if (distance >= PATH_TOTAL) {
    const a = PATH[PATH.length - 2], b = PATH[PATH.length - 1];
    return { x: b.x, y: b.y, angle: Math.atan2(b.y - a.y, b.x - a.x) };
  }
  for (let i = 0; i < PATH_SEGMENTS.length; i++) {
    const seg = PATH_SEGMENTS[i];
    if (distance <= seg.start + seg.len) {
      const t = (distance - seg.start) / seg.len;
      return {
        x: seg.a.x + (seg.b.x - seg.a.x) * t,
        y: seg.a.y + (seg.b.y - seg.a.y) * t,
        angle: Math.atan2(seg.b.y - seg.a.y, seg.b.x - seg.a.x),
      };
    }
  }
  return { x: PATH[PATH.length - 1].x, y: PATH[PATH.length - 1].y, angle: 0 };
}

function getSaveKey() { return SAVE_KEY_PREFIX + (currentDifficulty || 'default'); }
function saveGame() {
  if (!currentDifficulty || gameState !== 'playing') return;
  try {
    const towerData = [];
    for (let i = 0; i < SPOTS.length; i++) {
      const s = SPOTS[i];
      if (s.tower) towerData.push({ idx: i, type: s.tower.type, level: s.tower.level });
    }
    const data = {
      version: 1, difficulty: currentDifficulty, money: money, lives: lives, wave: wave,
      damageStats: damageStats, unlocked: Object.assign({}, unlocked), towers: towerData, timestamp: Date.now(),
    };
    localStorage.setItem(getSaveKey(), JSON.stringify(data));
  } catch (e) {}
}
function loadGame() {
  if (!currentDifficulty) return false;
  try {
    const raw = localStorage.getItem(getSaveKey());
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || data.version !== 1 || data.difficulty !== currentDifficulty || data.wave === 0) return false;
    money = data.money || DIFFICULTIES[currentDifficulty].startMoney;
    lives = data.lives || DIFFICULTIES[currentDifficulty].startLives;
    wave = data.wave || 0;
    damageStats = data.damageStats || {};
    if (data.unlocked) {
      for (const k in data.unlocked) {
        if (unlocked.hasOwnProperty(k)) unlocked[k] = data.unlocked[k];
      }
    }
    for (let i = 0; i < SPOTS.length; i++) SPOTS[i].tower = null;
    const towers = data.towers || [];
    for (let i = 0; i < towers.length; i++) {
      const t = towers[i];
      const spot = SPOTS[t.idx];
      if (!spot) continue;
      const tower = createTower(spot, t.type);
      if (!tower) continue;
      tower.level = Math.min(t.level || 1, MAX_TOWER_LEVEL);
      if (tower.applyLevel) tower.applyLevel();
      spot.tower = tower;
    }
    for (const type in unlocked) {
      const btn = document.querySelector('.shop-btn[data-type="' + type + '"]');
      if (!btn) continue;
      if (unlocked[type]) btn.classList.remove('locked');
      else btn.classList.add('locked');
    }
    updateUI();
    return true;
  } catch (e) { return false; }
}

function fmt(n, d) {
  if (d === undefined) d = 1;
  if (!isFinite(n)) return '∞';

}
function previewLine(label, cur, next, unit, d) {
  if (unit === undefined) unit = '';
  if (d === undefined) d = 1;
  const cs = fmt(cur, d) + unit;
  if (next === null || next === undefined || Math.abs(next - cur) < 0.001) {
    return label + '：' + cs + ' <span class="same">(不變)</span>';
  }
  const diff = next - cur, sign = diff > 0 ? '+' : '';
  return label + '：' + cs + ' → ' + fmt(next, d) + unit + ' <span class="up">(' + sign + fmt(diff, d) + ')</span>';
}

    lines.push('小怪：10 秒 1 發');
    lines.push('Boss：100 發/秒');
    return lines.join('\n');
  }
  if (cfg.damage !== undefined) {
    const cd = cfg.damage * Math.pow(1.5, lv - 1), nd = cfg.damage * Math.pow(1.5, nl - 1);
    lines.push(maxed ? '傷害：' + fmt(cd, 1) : previewLine('傷害', cd, nd, '', 1));
  }
  if (cfg.fireInterval !== undefined) {
    const ci = cfg.fireInterval * Math.pow(0.88, lv - 1), ni = cfg.fireInterval * Math.pow(0.88, nl - 1);
    lines.push(maxed ? '攻速：' + fmt(ci, 2) + 's' : previewLine('攻速', ci, ni, 's', 2));
  }
  if (cfg.range !== undefined && isFinite(cfg.range)) {
    const cr = cfg.range + 20 * (lv - 1), nr = cfg.range + 20 * nl - 20;
    lines.push(maxed ? '射程：' + fmt(cr / 90, 1) + ' 格' : previewLine('射程', cr / 90, nr / 90, ' 格'));
  }
  if (tower.type === 'white') lines.push('秒殺：' + (cfg.killChance * 100).toFixed(0) + '% (不變)');
  if (tower.type === 'blue') lines.push('命中：5% ｜ 命中即秒殺');
  if (tower.type === 'purple') lines.push('緩速：' + (100 - cfg.slowFactor * 100).toFixed(0) + '% 持續 ' + cfg.slowDuration + 's');
  if (tower.type === 'cyan') lines.push('對 Boss ×' + cfg.antiBossMultiplier);
  if (tower.type === 'amethyst') lines.push('增益：周圍 +' + (cfg.critRateBuff * 100).toFixed(0) + '% 爆擊率');
  if (tower.type === 'jade') lines.push('增益：周圍 +' + (cfg.critDmgBuff * 100).toFixed(0) + '% 爆擊傷害');
  return lines.join('\n');
}
function updateTowerPanel() {
  if (gameState !== 'playing') { towerPanel.classList.add('hidden'); return; }
  if (!selectedTower || !SPOTS.some(function(s) { return s.tower === selectedTower; })) {
    towerPanel.classList.add('hidden'); return;
  }
  towerPanel.classList.remove('hidden');
  const cfg = TOWER_TYPES[selectedTower.type];
  towerName.textContent = cfg.name + ' Lv.' + selectedTower.level;
  towerStats.innerHTML = getTowerPreviewHTML(selectedTower);
  if (selectedTower.type === 'magenta') { upgradeBtn.disabled = true; upgradeBtn.textContent = '不可升級'; return; }
  if (selectedTower.type === 'silver') { upgradeBtn.disabled = true; upgradeBtn.textContent = '自動成長'; return; }
  if (selectedTower.level >= MAX_TOWER_LEVEL) { upgradeBtn.disabled = true; upgradeBtn.textContent = 'MAX'; }
  else {
    const cost = getUpgradeCost(selectedTower);
    upgradeBtn.disabled = money < cost;
    upgradeBtn.textContent = '升級 ' + cost;
  }
}
function upgradeTower(tower) {
  if (!tower || tower.level >= MAX_TOWER_LEVEL) return;
  if (tower.type === 'silver' || tower.type === 'magenta') return;
  const cost = getUpgradeCost(tower);
  if (money < cost) { log('金幣不足'); return; }
  money -= cost;
  tower.level++;
  if (tower.applyLevel) tower.applyLevel();
  sfxUpgrade();
  updateUI(); updateTowerPanel();
  log(TOWER_TYPES[tower.type].name + ' → Lv.' + tower.level);
  saveGame();
}

// ============ 增益 ============
function recomputeBuffs() {
  for (let i = 0; i < SPOTS.length; i++) {
    if (SPOTS[i].tower) { SPOTS[i].tower.critRateBonus = 0; SPOTS[i].tower.critDmgBonus = 0; }
  }
  for (let i = 0; i < SPOTS.length; i++) {
    const spot = SPOTS[i];
    if (!spot.tower) continue;
    const t = spot.tower;
    if (t.type === 'amethyst') {
      const buff = TOWER_TYPES.amethyst.critRateBuff;
      const adj = getAdjacentSpots(spot);
      for (let j = 0; j < adj.length; j++) {
        if (adj[j].tower && adj[j].tower !== t) adj[j].tower.critRateBonus += buff;
      }
    } else if (t.type === 'jade') {
      const buff = TOWER_TYPES.jade.critDmgBuff;
      const adj = getAdjacentSpots(spot);
      for (let j = 0; j < adj.length; j++) {
        if (adj[j].tower && adj[j].tower !== t) adj[j].tower.critDmgBonus += buff;
      }
    }
  }
}

// ============ 敵人 ============
function Enemy(hp, speed, isBoss) {
  this.hp = hp;
  this.maxHp = hp;
  this.baseSpeed = speed;
  this.slowFactor = 1;
  this.slowTimer = 0;
  this.distance = 0;
  this.alive = true;
  this.reachedEnd = false;
  this.isBoss = !!isBoss;
  this.elapsed = 0;
  this.damageReduction = this.isBoss ? 0.4 : 0;
}
Enemy.prototype.takeDamage = function(amount) {
  const actual = amount * (1 - this.damageReduction);
  this.hp -= actual;
  if (this.hp <= 0) this.alive = false;
  return actual;
};
Enemy.prototype.update = function(dt) {
  if (!this.alive) return;
  if (this.hp <= 0) { this.alive = false; return; }
  this.elapsed += dt;
  let rm = 1;
  if (this.isBoss) rm = Math.min(2.2, 1 + this.elapsed * 0.025);
  if (this.slowTimer > 0) { this.slowTimer -= dt; if (this.slowTimer <= 0) this.slowFactor = 1; }
  let es = this.slowFactor;
  if (this.isBoss) es = 1 - (1 - this.slowFactor) * 0.5;
  let speed = this.baseSpeed * es * rm;
  if (hasGoldTower) speed += TOWER_TYPES.gold.conveyorSpeed * (this.isBoss ? TOWER_TYPES.gold.conveyorBossFactor : 1);
  this.distance += speed * dt;
  if (this.distance >= PATH_TOTAL) { this.alive = false; this.reachedEnd = true; }
  if (this.distance < 0) this.distance = 0;
};
Enemy.prototype.getPos = function() { return getPosOnPath(this.distance); };
Enemy.prototype.draw = function() {
  if (!this.alive) return;
  const p = this.getPos();
  const r = this.isBoss ? 22 : 13;

  // Boss 暴走光暈
  if (this.isBoss && this.elapsed > 1) {
    const rage = Math.min(1, (this.elapsed - 1) / 20);
    const glow = 0.3 + 0.4 * Math.sin(this.elapsed * 6) * rage;
    ctx.fillStyle = 'rgba(231, 76, 60, ' + glow + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, r + 10, 0, Math.PI * 2);
    ctx.fill();
  }

  // 本體漸層
  const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
  if (this.isBoss) {
    grad.addColorStop(0, '#c68642');
    grad.addColorStop(1, '#5a2e0a');
  } else {
    grad.addColorStop(0, '#ff7675');
    grad.addColorStop(1, '#c0392b');
  }
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.fill();

  // 外框
  ctx.strokeStyle = this.isBoss ? '#ffd700' : 'rgba(80, 10, 10, 0.9)';
  ctx.lineWidth = this.isBoss ? 2 : 1.5;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.stroke();

  // 「怪物」兩個字壓扁
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(1.4, 0.72);

  ctx.fillStyle = 'rgba(10, 0, 0, 0.94)';
  ctx.font = 'bold ' + (r * 1.15) + 'px "Noto Sans CJK TC", "Microsoft JhengHei", "PingFang TC", "Hiragino Sans", "Yu Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const offset = r * 0.575;
  ctx.fillText('怪', 0, -offset);
  ctx.fillText('物', 0, offset);
  ctx.restore();

  // Boss 王冠
  if (this.isBoss) {
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.fillStyle = '#ffd700';
    const cy = p.y - r - 5, cw = r * 1.2;
    ctx.beginPath();
    ctx.moveTo(p.x - cw / 2, cy);
    ctx.lineTo(p.x - cw / 2, cy - 7);
    ctx.lineTo(p.x - cw / 4, cy - 2);
    ctx.lineTo(p.x, cy - 10);
    ctx.lineTo(p.x + cw / 4, cy - 2);
    ctx.lineTo(p.x + cw / 2, cy - 7);
    ctx.lineTo(p.x + cw / 2, cy);
    ctx.closePath();
    ctx.fill();
  }

  // 緩速光環
  if (this.slowTimer > 0) {
    ctx.strokeStyle = 'rgba(155, 89, 182, 0.85)';
    ctx.lineWidth = this.isBoss ? 3 : 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r + 3, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 血條（非 Boss）
  if (!this.isBoss) {
    const w = 24;
    const hpPct = Math.max(0, this.hp / this.maxHp);
    ctx.fillStyle = '#000000aa';
    ctx.fillRect(p.x - w / 2, p.y - r - 8, w, 3);
    ctx.fillStyle = hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f1c40f' : '#e74c3c';
    ctx.fillRect(p.x - w / 2, p.y - r - 8, w * hpPct, 3);
  }
};

// 通用：六邊形塔底盤
function drawTowerBase(x, y, color, isSpecial) {
  const size = 70;
  const r = size * 0.52;
  const points = [];
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    points.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r });
  }

  // 地面陰影
  ctx.save();
  ctx.translate(x, y + 6);
  ctx.scale(1, 0.55);
  ctx.translate(-x, -y);
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < 6; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fill();
  ctx.restore();

  // 六邊形主體
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < 6; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();

  if (isSpecial) {
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
  }
  ctx.fillStyle = color;
  ctx.fill();
  if (isSpecial) ctx.restore();

  // 明暗疊加（上亮下暗）
  const shade = ctx.createLinearGradient(x, y - r, x, y + r);
  shade.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
  shade.addColorStop(0.45, 'rgba(255, 255, 255, 0.05)');
  shade.addColorStop(0.7, 'rgba(0, 0, 0, 0.1)');
  shade.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
  ctx.fillStyle = shade;
  ctx.fill();

  // 深色外框
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // 內圈裝飾線
  const inset = 5;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    const px = x + Math.cos(a) * (r - inset);
    const py = y + Math.sin(a) * (r - inset);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
  ctx.lineWidth = 1;
  ctx.stroke();
}
 
// ============ 塔圖案 ============
function drawTowerIcon(type, x, y, size) {
  ctx.save();
  const s = size;
  let i, a, r, px, py;

  // ============ 通用：水晶柱繪製 ============
  function drawCrystalShard(cx, cy, h, w, tilt, fill1, fill2, glow) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt || 0);
    // 主體
    ctx.beginPath();
    ctx.moveTo(0, -h);
    ctx.lineTo(-w, -h * 0.3);
    ctx.lineTo(-w * 0.7, h * 0.85);
    ctx.lineTo(w * 0.7, h * 0.85);
    ctx.lineTo(w, -h * 0.3);
    ctx.closePath();
    if (glow) {
      ctx.shadowColor = glow;
      ctx.shadowBlur = 14;
    }
    const g = ctx.createLinearGradient(-w, -h, w, h);
    g.addColorStop(0, fill1);
    g.addColorStop(0.5, fill2);
    g.addColorStop(1, fill1);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowBlur = 0;
    // 左側高光面
    ctx.beginPath();
    ctx.moveTo(0, -h);
    ctx.lineTo(-w * 0.5, -h * 0.2);
    ctx.lineTo(-w * 0.3, h * 0.7);
    ctx.lineTo(0, h * 0.8);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.fill();
    // 邊框
    ctx.beginPath();
    ctx.moveTo(0, -h);
    ctx.lineTo(-w, -h * 0.3);
    ctx.lineTo(-w * 0.7, h * 0.85);
    ctx.lineTo(w * 0.7, h * 0.85);
    ctx.lineTo(w, -h * 0.3);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // 尖端光點
    if (glow) {
      ctx.shadowColor = glow;
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.arc(0, -h, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  switch (type) {
    // ===== 白塔：粗糙不規則碎晶 =====
    case 'white': {
      const shards = [
        { dx: -6, dy: 6, h: 0.16, w: 0.05, tilt: -0.25 },
        { dx: 0, dy: 8, h: 0.26, w: 0.07, tilt: 0.05 },
        { dx: 7, dy: 5, h: 0.14, w: 0.045, tilt: 0.3 },
        { dx: -3, dy: 10, h: 0.11, w: 0.04, tilt: -0.15 },
      ];
      for (let k = 0; k < shards.length; k++) {
        const sh = shards[k];
        drawCrystalShard(x + sh.dx, y + sh.dy, s * sh.h, s * sh.w, sh.tilt, '#ffffff', '#c0c0c0', null);
      }
      // 碎光點
      for (let k = 0; k < 7; k++) {
        const ang = k * 0.9 + 0.4;
        const rad = s * 0.22 + (k % 3) * s * 0.05;
        const px2 = x + Math.cos(ang) * rad;
        const py2 = y + Math.sin(ang) * rad * 0.7 - s * 0.05;
        ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.5 + (k % 3) * 0.15) + ')';
        ctx.beginPath();
        ctx.arc(px2, py2, 1.2 + (k % 2) * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }

    // ===== 綠塔：圓潤翡翠 + 藤蔓 =====
    case 'green': {
      const h = s * 0.32, w = s * 0.22;
      ctx.save();
      ctx.shadowColor = '#2ecc71';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.ellipse(x, y - s * 0.02, w, h, 0, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(x - w * 0.4, y - h * 0.4, 2, x, y, w * 1.2);
      g.addColorStop(0, '#b8ffd8');
      g.addColorStop(0.5, '#2ecc71');
      g.addColorStop(1, '#0a5030');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x - w * 0.4, y - h * 0.45, w * 0.3, h * 0.25, -0.6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fill();
      ctx.restore();
      // 藤蔓
      ctx.save();
      ctx.strokeStyle = '#0a4d26';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      for (let k = 0; k < 4; k++) {
        const baseA = k * Math.PI / 2 + Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(baseA) * w * 0.9, y + Math.sin(baseA) * h * 0.9);
        ctx.quadraticCurveTo(
          x + Math.cos(baseA) * w * 1.3,
          y + Math.sin(baseA) * h * 1.3,
          x + Math.cos(baseA + 0.5) * w * 1.4,
          y + Math.sin(baseA + 0.5) * h * 1.4
        );
        ctx.stroke();
      }
      // 葉子
      for (let k = 0; k < 5; k++) {
        const a2 = k * Math.PI * 0.4 + 0.3;
        const rad2 = s * 0.3;
        const lx = x + Math.cos(a2) * rad2;
        const ly = y + Math.sin(a2) * rad2 * 0.8;
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(a2);
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.06, s * 0.025, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#2ecc71';
        ctx.fill();
        ctx.strokeStyle = '#0a4d26';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
      break;
    }

    // ===== 藍塔：尖銳細長 + 光弧 =====
    case 'blue': {
      drawCrystalShard(x, y, s * 0.5, s * 0.16, 0, '#b8e0ff', '#3498db', 'rgba(52,152,219,0.9)');
      // 快速旋轉光弧
      ctx.save();
      ctx.strokeStyle = 'rgba(150, 220, 255, 0.8)';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(150, 220, 255, 0.8)';
      ctx.shadowBlur = 8;
      const spin = performance.now() / 500;
      for (let k = 0; k < 3; k++) {
        const aStart = -0.6 + k * 0.5 + spin;
        const rad = s * 0.28 + k * s * 0.03;
        ctx.beginPath();
        ctx.arc(x, y, rad, aStart, aStart + 0.7);
        ctx.stroke();
      }
      ctx.restore();
      break;
    }

    // ===== 青藍塔：冰晶、透明 =====
    case 'cyan': {
      const h = s * 0.44, w = s * 0.13;
      ctx.save();
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(x, y - h);
      ctx.lineTo(x - w, y - h * 0.3);
      ctx.lineTo(x - w * 0.7, y + h * 0.85);
      ctx.lineTo(x + w * 0.7, y + h * 0.85);
      ctx.lineTo(x + w, y - h * 0.3);
      ctx.closePath();
      const g = ctx.createLinearGradient(x, y - h, x, y + h);
      g.addColorStop(0, 'rgba(220, 255, 255, 0.95)');
      g.addColorStop(0.5, 'rgba(100, 240, 255, 0.85)');
      g.addColorStop(1, 'rgba(0, 180, 220, 0.95)');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
      // 側邊冰刺
      for (let k = 0; k < 4; k++) {
        const sign = k % 2 === 0 ? 1 : -1;
        const yOff = -s * 0.15 + k * s * 0.12;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x + sign * w * 0.7, y + yOff);
        ctx.lineTo(x + sign * (w + s * 0.06), y + yOff + s * 0.02);
        ctx.lineTo(x + sign * w * 0.7, y + yOff + s * 0.04);
        ctx.closePath();
        ctx.fillStyle = 'rgba(200, 255, 255, 0.9)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.restore();
      }
      // 寒氣
      for (let k = 0; k < 4; k++) {
        const a2 = k * Math.PI / 2 + 0.3;
        const rad2 = s * 0.3;
        ctx.fillStyle = 'rgba(220, 255, 255, 0.85)';
        ctx.beginPath();
        ctx.arc(x + Math.cos(a2) * rad2, y + Math.sin(a2) * rad2 * 0.8, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }

    // ===== 紫塔：水晶 + 符文環 =====
    case 'purple': {
      drawCrystalShard(x, y, s * 0.42, s * 0.2, 0, '#d8a8ff', '#9b59b6', 'rgba(155,89,182,0.9)');
      // 符文環
      ctx.save();
      ctx.strokeStyle = 'rgba(200, 140, 255, 0.85)';
      ctx.lineWidth = 1.8;
      ctx.shadowColor = 'rgba(200, 140, 255, 0.9)';
      ctx.shadowBlur = 8;
      const spin = performance.now() / 1500;
      for (let k = 0; k < 3; k++) {
        const a2 = k * Math.PI * 2 / 3 - Math.PI / 2 + spin;
        const rad2 = s * 0.3;
        const rx = x + Math.cos(a2) * rad2;
        const ry = y + Math.sin(a2) * rad2 * 0.9;
        ctx.beginPath();
        ctx.arc(rx, ry, s * 0.05, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(200, 140, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(rx, ry, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      // 緩速波紋
      ctx.beginPath();
      ctx.arc(x, y, s * 0.3, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(200, 140, 255, 0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
      break;
    }

    // ===== 橙塔：水晶 + 閃電 =====
    case 'orange': {
      drawCrystalShard(x, y, s * 0.42, s * 0.2, 0, '#ffc880', '#e67e22', 'rgba(230,126,34,0.9)');
      // 閃電
      ctx.save();
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = 12;

function drawLevelStars(level, x, y, size) {

  ctx.restore();
}

function Tower(spot, type) {

}
Object.defineProperty(Tower.prototype, 'x', { get: function() { return this.spot.x; } });
Object.defineProperty(Tower.prototype, 'y', { get: function() { return this.spot.y; } });

  this.range = (this.config.range || 220) + 20 * (lv - 1);

  this.antiBossMultiplier = this.config.antiBossMultiplier;
};

Tower.prototype.update = function(dt) {
  this.fireFlash = Math.max(0, this.fireFlash - dt * 6);
  if (this.hastedTimer > 0) {
    this.hastedTimer -= dt;
    if (this.hastedTimer <= 0) this.fireInterval = this.baseFireInterval;
  }
  this.cooldown -= dt;
  if (this.cooldown > 0) return;
  const target = this.findTarget();
  if (target) { this.fire(target); this.cooldown = this.fireInterval; }
};
Tower.prototype.findTarget = function() {
  let best = null, bd = this.range;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.alive) continue;
    const p = e.getPos();
    const d = Math.hypot(p.x - this.x, p.y - this.y);

};

};

  ctx.restore();

};

  const x = this.x, y = this.y, size = 70, half = size / 2;
  if (selectedTower === this) {
    ctx.fillStyle = 'rgba(255, 215, 0, 0.08)';
    ctx.beginPath(); ctx.arc(x, y, this.range, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
  }
  if (this.type === 'amethyst' || this.type === 'jade') {
    const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 300);
    ctx.save(); ctx.shadowColor = this.config.color; ctx.shadowBlur = 18 * pulse;
    ctx.strokeStyle = this.config.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, half + 8, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  if (this.critRateBonus > 0) {
    ctx.save(); ctx.strokeStyle = 'rgba(176, 136, 255, 0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, half + 3, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  if (this.critDmgBonus > 0) {
    ctx.save(); ctx.strokeStyle = 'rgba(102, 255, 102, 0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, half + 6, 0, Math.PI * 2); ctx.stroke(); ctx.restore();

      ctx.fillRect(x - half, y - half, size, size); ctx.restore();

    ctx.strokeStyle = 'rgba(231, 76, 60, ' + (0.6 + 0.4 * Math.sin(this.hastedTimer * 12)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, half + 5, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }

Object.defineProperty(BossTower.prototype, 'y', { get: function() { return this.spot.y; } });

  const lv = this.level;
  this.buffTargets = this.config.buffTargets + (lv - 1);
  this.buffDuration = this.config.buffDuration + (lv - 1) * 2;
  this.buffInterval = Math.max(2, this.config.buffInterval - (lv - 1) * 0.5);
};
BossTower.prototype.applyHaste = function() {};
BossTower.prototype.update = function(dt) {
  this.buffFlash = Math.max(0, this.buffFlash - dt * 3);
  for (let i = 0; i < this.activeBuffs.length; i++) this.activeBuffs[i].timer -= dt;
  const self = this;
  this.activeBuffs = this.activeBuffs.filter(function(b) {
    return b.timer > 0 && SPOTS.some(function(s) { return s.tower === b.tower; });
  });

    this.triggerBuff();
    this.buffTimer = this.buffInterval;
  }
};
BossTower.prototype.triggerBuff = function() {

    .filter(function(t) { return t && t !== self && typeof t.applyHaste === 'function'; });
  if (others.length === 0) return;
  for (let i = others.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = others[i]; others[i] = others[j]; others[j] = tmp;

// ============ 子彈 ============
function Bullet(tower, target) {
  this.x = tower.x; this.y = tower.y;
  this.target = target; this.alive = true;
  this.speed = 600; this.color = tower.config.color;
  this.towerType = tower.type;
  this.damage = tower.damage;
  this.killChance = tower.killChance || 0;
  this.slowFactor = tower.slowFactor;
  this.slowDuration = tower.slowDuration;
  this.antiBossMultiplier = tower.antiBossMultiplier;
  this.isHit = Math.random() < tower.hitChance;
  this.critRate = tower.critRate || 0;
  this.critDamage = tower.critDamage || 2.0;
}
Bullet.prototype.update = function(dt) {
  if (!this.alive) return;
  if (!this.target.alive) { this.alive = false; return; }
  const tp = this.target.getPos();
  const dx = tp.x - this.x, dy = tp.y - this.y;
  const dist = Math.hypot(dx, dy), move = this.speed * dt;
  if (dist <= move) {
    if (this.isHit) {
      const pk = this.killChance > 0 && Math.random() < this.killChance;
      if (pk) {
        if (this.target.isBoss) {
          const d = this.target.takeDamage(this.target.maxHp * 0.01);
          addDamage(this.towerType, d);
        } else {
          addDamage(this.towerType, this.target.hp);
          this.target.hp = 0;
          this.target.alive = false;
        }
      } else {
        let dmg = this.damage;
        if (this.target.isBoss && this.antiBossMultiplier) dmg *= this.antiBossMultiplier;
        if (this.critRate > 0 && Math.random() < this.critRate) dmg *= this.critDamage;
        const actual = this.target.takeDamage(dmg);
        addDamage(this.towerType, actual);
      }
      if (this.slowFactor !== undefined) {
        this.target.slowFactor = this.slowFactor;
        this.target.slowTimer = this.slowDuration;
      }
      sfxHit();
    }
    this.alive = false;
  } else {
    this.x += (dx / dist) * move;
    this.y += (dy / dist) * move;
  }
};
Bullet.prototype.draw = function() {
  if (!this.alive) return;
  ctx.fillStyle = this.color;
  ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI * 2); ctx.fill();
};
function SilverBullet(tower, target) {
  this.x = tower.x; this.y = tower.y;
  this.target = target; this.alive = true;
  this.speed = 900; this.color = '#e0e0e0';
  this.towerType = 'silver';
  this.damage = tower.config.baseDamage * (1 + (tower.level - 1) * 0.25);
  this.critRate = tower.critRate || 0;
  this.critDamage = tower.critDamage || 2.0;
}
SilverBullet.prototype.update = function(dt) {
  if (!this.alive) return;
  if (!this.target.alive) { this.alive = false; return; }
  const tp = this.target.getPos();
  const dx = tp.x - this.x, dy = tp.y - this.y;
  const dist = Math.hypot(dx, dy), move = this.speed * dt;
  if (dist <= move) {
    let dmg = this.damage;
    if (this.critRate > 0 && Math.random() < this.critRate) dmg *= this.critDamage;
    const actual = this.target.takeDamage(dmg);
    addDamage(this.towerType, actual);
    this.alive = false;
  } else {
    this.x += (dx / dist) * move;
    this.y += (dy / dist) * move;
  }
};
SilverBullet.prototype.draw = function() {
  if (!this.alive) return;
  ctx.fillStyle = this.color;
  ctx.beginPath(); ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2); ctx.fill();
};

// ============ 合成 ============
const COMBOS = {
  'white+white': function() {
    const r = Math.random();
    if (r < 0.45) return 'green';
    if (r < 0.90) return 'blue';
    return 'cyan';
  },
  'purple+purple': function() { return 'orange'; },
  'orange+orange': function() { return 'red'; },
};
function canCombine(a, b) {
  if (!a || !b || a === b) return false;
  if (a.type === 'magenta' || b.type === 'magenta') return false;
  return !!COMBOS[a.type + '+' + b.type];
}
function createTower(spot, type) {
  if (type === 'orange') return new BeamTower(spot);
  if (type === 'red') return new BossTower(spot);
  if (type === 'silver') return new SilverTower(spot);
  if (type === 'magenta') return new MagentaTower(spot);
  if (type === 'fireArrow') return new FireArrowTower(spot);
  if (!TOWER_TYPES[type]) return null;
  return new Tower(spot, type);
}
function unlockButton(type) {
  const btn = document.querySelector('.shop-btn[data-type="' + type + '"]');
  if (!btn) return;
  btn.classList.remove('locked');
  btn.classList.add('just-unlocked');
  setTimeout(function() { btn.classList.remove('just-unlocked'); }, 2000);
}
function combineTowers(a, b) {
  const key = a.type + '+' + b.type;
  const resultType = COMBOS[key]();
  const spotA = a.spot, spotB = b.spot;
  spotA.tower = null; spotB.tower = null;
  const newTower = createTower(spotA, resultType);
  spotA.tower = newTower;
  sfxCombine();
  if (resultType === 'green' && !unlocked.green) { unlocked.green = true; unlockButton('green'); log('✨ 綠塔解鎖！'); }
  else if (resultType === 'blue' && !unlocked.blue) { unlocked.blue = true; unlockButton('blue'); log('💙 藍塔解鎖！'); }
  else if (resultType === 'orange' && !unlocked.orange) { unlocked.orange = true; unlockButton('orange'); log('🔥 橙塔解鎖！'); }
  else if (resultType === 'cyan') log('⚡ 青藍塔！專剋 Boss', 3000);
  else if (resultType === 'red') log('💼 紅塔！無良老闆登場');
  else {
    const names = { green: '綠塔', blue: '藍塔', orange: '橙塔', red: '紅塔' };
    log('合成：' + (names[resultType] || resultType));
  }
  selectedTower = null;
  updateTowerPanel(); updateUI(); saveGame();
}
function combineGold(towerList) {
  const firstSpot = towerList[0].spot;
  for (let i = 0; i < towerList.length; i++) towerList[i].spot.tower = null;
  const newTower = new Tower(firstSpot, 'gold');
  firstSpot.tower = newTower;
  goldBanner.classList.add('show');
  setTimeout(function() { goldBanner.classList.remove('show'); }, 1800);
  sfxGold();
  log('✨✨✨ 金色傳說！', 4000);
  selectedTower = null;
  updateTowerPanel(); updateUI(); saveGame();
}

// ============ 波次 ============
function startWave() {
  if (waveActive || gameOver || gameState !== 'playing') return;
  const cfg = DIFFICULTIES[currentDifficulty];
  if (wave >= cfg.maxWave) return;
  wave++;
  waveActive = true;
  autoNextTimer = 0;
  const isBossWave = wave % 10 === 0;
  const baseHp = Math.floor(45 * Math.pow(cfg.hpGrowth, wave - 1));
  const baseSpeed = Math.min(180, 70 + (wave - 1) * 4);
  const count = 5 + Math.floor(wave * 1.5);
  spawnQueue = [];
  for (let i = 0; i < count; i++) {
    spawnQueue.push({ hp: baseHp, speed: baseSpeed, delay: i * 0.55, isBoss: false });
  }
  if (isBossWave) {
    const bossHp = Math.floor(baseHp * 20);
    const bossSpeed = baseSpeed * 0.6;
    spawnQueue.push({ hp: bossHp, speed: bossSpeed, delay: count * 0.55 + 2.5, isBoss: true });
    log('⚠️ 第 ' + wave + ' 波：BOSS！', 3000);
    sfxBoss();
  }
  spawnTimer = 0;
  startWaveBtn.disabled = true;
  updateUI(); saveGame();
}

// ============ 指標 ============
function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (BASE_W / rect.width),
    y: (e.clientY - rect.top) * (BASE_H / rect.height),
  };
}
function findSpotAt(x, y) {
  const r = SPOT_SIZE * 0.55;
  for (let i = 0; i < SPOTS.length; i++) {
    const spot = SPOTS[i];
    if (Math.hypot(x - spot.x, y - spot.y) <= r) return spot;
  }
  return null;
}
function handleTowerTap(tower) {
  if (tower.type === 'magenta') { selectedTower = tower; updateTowerPanel(); return; }
  comboSequence.push({ type: tower.type, tower: tower });
  if (comboSequence.length === GOLD_RECIPE.length) {
    let fm = true;
    for (let i = 0; i < GOLD_RECIPE.length; i++) {
      if (comboSequence[i].type !== GOLD_RECIPE[i]) { fm = false; break; }
    }
    if (fm) {
      combineGold(comboSequence.map(function(c) { return c.tower; }));
      comboSequence = [];
      return;
    }
  }
  let ip = true;
  for (let i = 0; i < comboSequence.length; i++) {
    if (comboSequence[i].type !== GOLD_RECIPE[i]) { ip = false; break; }
  }
  if (!ip) comboSequence = tower.type === GOLD_RECIPE[0] ? [{ type: tower.type, tower: tower }] : [];
  selectedTower = tower;
  updateTowerPanel();
}
function startDragAt(x, y) {
  if (gameOver || gameState !== 'playing') return;
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const pos = { x: (x - rect.left) * (BASE_W / rect.width), y: (y - rect.top) * (BASE_H / rect.height) };
  const spot = findSpotAt(pos.x, pos.y);
  if (!spot) {
    // 如果目前有選中任何東西 → 只取消選中
    if (selectedTower || shopSelected || removeMode) {
      selectedTower = null;
      comboSequence = [];
      shopSelected = null;
      removeMode = false;
      removeBtn.classList.remove('active');
      document.querySelectorAll('.shop-btn').forEach(function(b) {
        b.classList.remove('selected');
      });
      updateTowerPanel();
      return;
    }
    // 什麼都沒選 → 切換 UI 顯示
    toggleUI();
    return;
  }
  if (removeMode) {
    if (spot.tower) {
      const t = spot.tower;
      const refund = Math.floor((TOWER_TYPES[t.type].baseCost || 0) * 0.5);
      money += refund;
      spot.tower = null;
      selectedTower = null; comboSequence = [];
      sfxRemove();
      updateUI(); updateTowerPanel();
      log('已撤除，返還 ' + refund + ' 💰');
      saveGame();
    }
    return;
  }
  if (shopSelected) {
    if (spot.tower) return;
    const cfg = TOWER_TYPES[shopSelected];
    if (money < cfg.cost) { log('金幣不足'); return; }
    money -= cfg.cost;
    spot.tower = createTower(spot, shopSelected);
    sfxPlace();
    updateUI(); saveGame();
    return;
  }
  if (spot.tower) {
    if (inputMode === 'mouse') {
      if (selectedTower && selectedTower !== spot.tower) {
        const a = selectedTower, b = spot.tower;
        if (canCombine(a, b)) { combineTowers(a, b); selectedTower = null; return; }
        else {
          const aSpot = a.spot, bSpot = b.spot;
          aSpot.tower = b; bSpot.tower = a;
          a.spot = bSpot; b.spot = aSpot;
          sfxPlace(); saveGame();
          selectedTower = null; updateTowerPanel();
          return;
        }
      }
      handleTowerTap(spot.tower);
      return;
    }
    drag = {
      tower: spot.tower, spot: spot,
      startX: pos.x, startY: pos.y,
      currentX: pos.x, currentY: pos.y,
      isDragging: false,
    };
  } else {
    selectedTower = null; comboSequence = [];
    updateTowerPanel();
  }
}
function moveDragTo(x, y) {
  if (!drag) return;
  const rect = canvas.getBoundingClientRect();
  const pos = { x: (x - rect.left) * (BASE_W / rect.width), y: (y - rect.top) * (BASE_H / rect.height) };
  drag.currentX = pos.x; drag.currentY = pos.y;
  if (!drag.isDragging) {
    const dx = pos.x - drag.startX, dy = pos.y - drag.startY;
    if (Math.hypot(dx, dy) > 8) {
      drag.isDragging = true;
      selectedTower = null; comboSequence = [];
      updateTowerPanel();
    }
  }
}
function endDragAt(x, y) {
  if (!drag) return;
  const rect = canvas.getBoundingClientRect();
  const pos = { x: (x - rect.left) * (BASE_W / rect.width), y: (y - rect.top) * (BASE_H / rect.height) };
  if (drag.isDragging) {
    const targetSpot = findSpotAt(pos.x, pos.y);
    if (targetSpot && targetSpot !== drag.spot) {
      const a = drag.tower, aSpot = drag.spot;
      const b = targetSpot.tower;
      if (!b) {
        aSpot.tower = null; targetSpot.tower = a;
        a.spot = targetSpot;
        sfxPlace(); saveGame();
      } else if (canCombine(a, b)) combineTowers(a, b);
      else {
        aSpot.tower = b; targetSpot.tower = a;
        a.spot = targetSpot; b.spot = aSpot;
        sfxPlace(); saveGame();
      }
    }
  } else handleTowerTap(drag.tower);
  drag = null;
}

function showTutorialStep() {

  tutorialProgress.textContent = (tutorialStep + 1) + ' / ' + TUTORIAL_STEPS.length;
  tutorialIndicator.style.display = 'none';

  // 換步驟時閃一下
  if (tutorialStep > 0) {
    tutorialFlash.classList.remove('flash');
    void tutorialFlash.offsetWidth;
    tutorialFlash.classList.add('flash');
  }

  clearInterval(tutorialTypeTimer);
  tutorialTypeTimer = setInterval(typeNextChar, 22);
}

function typeNextChar() {
  if (tutorialCharIndex >= tutorialFullText.length) {
    clearInterval(tutorialTypeTimer);
    tutorialTyping = false;
    tutorialIndicator.style.display = 'block';
    return;
  }
  tutorialText.textContent += tutorialFullText[tutorialCharIndex];
  tutorialCharIndex++;
}

function advanceTutorial() {
  // 打字中 → 立刻全部顯示
  if (tutorialTyping) {
    clearInterval(tutorialTypeTimer);
    tutorialText.textContent = tutorialFullText;
    tutorialTyping = false;
    tutorialIndicator.style.display = 'block';
    return;
  }
  // 已顯示完 → 下一步
  tutorialStep++;
  showTutorialStep();
}

function endTutorial() {
  clearInterval(tutorialTypeTimer);
  tutorialOverlay.classList.remove('show');
  try { localStorage.setItem(TUTORIAL_KEY, '1'); } catch (e) {}
}

// ============ 繪製 ============
function drawBackground() {
  // 天空漸層（深紫→黑）
  const sky = ctx.createLinearGradient(0, 0, 0, BASE_H);
  sky.addColorStop(0, '#15062a');
  sky.addColorStop(0.35, '#1a0840');
  sky.addColorStop(0.7, '#0a0418');
  sky.addColorStop(1, '#050208');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  // 星雲光暈
  const nebula1 = ctx.createRadialGradient(240, 90, 20, 240, 90, 260);
  nebula1.addColorStop(0, 'rgba(120, 60, 200, 0.22)');
  nebula1.addColorStop(0.5, 'rgba(80, 30, 140, 0.08)');
  nebula1.addColorStop(1, 'transparent');
  ctx.fillStyle = nebula1;
  ctx.fillRect(0, 0, 500, 350);

  const nebula2 = ctx.createRadialGradient(720, 180, 20, 720, 180, 280);
  nebula2.addColorStop(0, 'rgba(60, 40, 180, 0.20)');
  nebula2.addColorStop(0.5, 'rgba(40, 20, 120, 0.08)');
  nebula2.addColorStop(1, 'transparent');
  ctx.fillStyle = nebula2;
  ctx.fillRect(450, 0, 510, 400);

  // 星星
  const now = performance.now();
  for (let i = 0; i < 80; i++) {
    const sx = (i * 137.5) % BASE_W;
    const sy = (i * 73.3) % BASE_H;
    const baseSize = 0.4 + ((i * 17) % 10) / 10;
    const twinkle = 0.5 + 0.5 * Math.sin(now / 1200 + i * 1.7);
    const sr = baseSize * (0.6 + twinkle * 0.5);
    const alpha = 0.35 + twinkle * 0.45;
    ctx.fillStyle = 'rgba(255, 245, 220, ' + alpha + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }

  // 遠處山脈（用暗色塊疊出剪影）
  drawMountains();
}

function drawMountains() {
  ctx.save();
  // 遠山
  ctx.fillStyle = 'rgba(20, 8, 40, 0.9)';
  ctx.beginPath();
  ctx.moveTo(0, BASE_H);
  const peaks1 = [
    [0, 420], [80, 340], [160, 380], [260, 300], [360, 360],
    [480, 280], [580, 340], [700, 290], [820, 350], [960, 300],
  ];
  for (let i = 0; i < peaks1.length; i++) {
    ctx.lineTo(peaks1[i][0], peaks1[i][1]);
  }
  ctx.lineTo(BASE_W, BASE_H);
  ctx.closePath();
  ctx.fill();

  // 近山（更暗、更矮）
  ctx.fillStyle = 'rgba(10, 4, 22, 0.95)';
  ctx.beginPath();
  ctx.moveTo(0, BASE_H);
  const peaks2 = [
    [0, 470], [120, 400], [240, 440], [380, 380], [500, 430],
    [640, 390], [780, 440], [900, 400], [960, 430],
  ];
  for (let i = 0; i < peaks2.length; i++) {
    ctx.lineTo(peaks2[i][0], peaks2[i][1]);
  }
  ctx.lineTo(BASE_W, BASE_H);
  ctx.closePath();
  ctx.fill();

  // 山腳紫色光暈
  const footGlow = ctx.createRadialGradient(BASE_W / 2, BASE_H, 0, BASE_W / 2, BASE_H, 400);
  footGlow.addColorStop(0, 'rgba(120, 60, 200, 0.15)');
  footGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = footGlow;
  ctx.fillRect(0, BASE_H - 300, BASE_W, 300);
  ctx.restore();
}
 
function drawPath() {
  ctx.save();

  // === 外層紫色光暈（最寬、最透明）===
  ctx.beginPath();
  ctx.moveTo(PATH[0].x, PATH[0].y);
  for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
  ctx.strokeStyle = 'rgba(140, 80, 220, 0.18)';
  ctx.lineWidth = 58;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  // === 中層紫色光暈 ===
  ctx.strokeStyle = 'rgba(160, 100, 240, 0.30)';
  ctx.lineWidth = 48;
  ctx.stroke();

  // === 石頭路面（深灰帶微紫）===
  ctx.strokeStyle = '#2a2438';
  ctx.lineWidth = 38;
  ctx.stroke();

  // === 路面上的石紋（短線交錯）===
  ctx.strokeStyle = 'rgba(70, 60, 100, 0.5)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < PATH.length - 1; i++) {
    const a = PATH[i], b = PATH[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    const angle = Math.atan2(b.y - a.y, b.x - a.x);
    const perpX = -Math.sin(angle), perpY = Math.cos(angle);
    const segLen = 22;
    const numSegs = Math.floor(len / segLen);
    for (let j = 0; j < numSegs; j++) {
      const t = (j + 0.5) / numSegs;
      const cx = a.x + (b.x - a.x) * t;
      const cy = a.y + (b.y - a.y) * t;
      const halfW = 16;
      ctx.beginPath();
      ctx.moveTo(cx - perpX * halfW, cy - perpY * halfW);
      ctx.lineTo(cx + perpX * halfW, cy + perpY * halfW);
      ctx.stroke();
    }
  }

  // === 內層發光邊（紫色亮線）===
  ctx.strokeStyle = 'rgba(180, 120, 255, 0.8)';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#a060ff';
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // === 金塔履帶 ===
  if (hasGoldTower) {
    ctx.save();
    ctx.setLineDash([12, 18]);
    ctx.lineDashOffset = (performance.now() / 25) % 30;
    ctx.strokeStyle = 'rgba(200, 150, 20, 0.55)';
    ctx.lineWidth = 38;
    ctx.stroke();

    ctx.setLineDash([6, 24]);
    ctx.lineDashOffset = (performance.now() / 25) % 30;
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.75)';
    ctx.lineWidth = 10;
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}
 
function drawSpot(spot) {
  const x = spot.x, y = spot.y, size = SPOT_SIZE, half = size / 2;

  // 特殊格子：起始格（發光綠）
  if (spot.special === 'glow') {
    drawHexSpot(x, y, half, {
      fill1: '#f8f8f8', fill2: '#c8c8c8',
      stroke: '#ffffff',
      glow: 'rgba(255, 255, 255, 0.9)',
    });
    // 綠色向上箭頭
    ctx.fillStyle = '#2ecc71';
    ctx.strokeStyle = '#1a8a45';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const ax = x - 18 + i * 18;
      const ay = y + 6;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - 7, ay + 10);
      ctx.lineTo(ax - 3, ay + 10);
      ctx.lineTo(ax - 3, ay + 20);
      ctx.lineTo(ax + 3, ay + 20);
      ctx.lineTo(ax + 3, ay + 10);
      ctx.lineTo(ax + 7, ay + 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    return;
  }

  // 特殊格子：黑洞
  if (spot.special === 'void') {
    drawHexSpot(x, y, half, {
      fill1: '#0a0518', fill2: '#000000',
      stroke: '#3a2060',
      glow: 'rgba(80, 40, 140, 0.6)',
    });
    // 螺旋
    ctx.save();
    ctx.strokeStyle = 'rgba(140, 90, 220, 0.55)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      const startR = 4 + i * 9;
      for (let a = 0; a < Math.PI * 4; a += 0.2) {
        const r = startR + a * 1.8;
        if (r > half - 6) break;
        const px = x + Math.cos(a + i) * r;
        const py = y + Math.sin(a + i) * r;
        if (a === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
    return;
  }

  // 普通格子：暗色六邊形石塊
  drawHexSpot(x, y, half, {
    fill1: '#2a2438', fill2: '#15101f',
    stroke: '#4a3a6a',
    glow: 'rgba(90, 60, 140, 0.4)',
  });
}

// 通用六邊形繪製
function drawHexSpot(cx, cy, half, opts) {
  const r = half * 0.98;
  ctx.save();

  // 外發光
  if (opts.glow) {
    ctx.shadowColor = opts.glow;
    ctx.shadowBlur = 14;
  }

  // 六邊形路徑
  const points = [];
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    points.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
  }

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < 6; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();

  // 填充（徑向漸層做出立體感）
  const grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r * 1.1);
  grad.addColorStop(0, opts.fill1);
  grad.addColorStop(1, opts.fill2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.shadowBlur = 0;

  // 深色描邊
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // 內圈亮色描邊
  ctx.strokeStyle = opts.stroke;
  ctx.lineWidth = 1.5;
  const inset = 4;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    const px = cx + Math.cos(a) * (r - inset);
    const py = cy + Math.sin(a) * (r - inset);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();

  ctx.restore();
}
function drawDragGhost() {
  if (!drag || !drag.isDragging) return;
  const x = drag.currentX, y = drag.currentY;
  const t = drag.tower, size = 70, half = size / 2;
  const targetSpot = findSpotAt(x, y);
  let tv = false, ts = false, tsp = null;
  if (targetSpot && targetSpot !== drag.spot) {
    if (!targetSpot.tower) { tv = true; tsp = { x: targetSpot.x, y: targetSpot.y }; }
    else if (canCombine(t, targetSpot.tower)) { tv = true; tsp = { x: targetSpot.x, y: targetSpot.y }; }
    else { ts = true; tsp = { x: targetSpot.x, y: targetSpot.y }; }
  }
  if (tsp) {
    ctx.save();
    if (tv) { ctx.strokeStyle = '#2ecc71'; ctx.shadowColor = '#2ecc71'; }
    else if (ts) { ctx.strokeStyle = '#f1c40f'; ctx.shadowColor = '#f1c40f'; }
    else { ctx.strokeStyle = '#e74c3c'; ctx.shadowColor = '#e74c3c'; }
    ctx.lineWidth = 4; ctx.shadowBlur = 12;
    ctx.strokeRect(tsp.x - half - 5, tsp.y - half - 5, size + 10, size + 10);
    ctx.restore();
  }
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.translate(x, y);
  ctx.fillStyle = '#00000088';
  ctx.fillRect(-half + 2, -half + 3, size, size);
  let color = '#ffffff';
  if (TOWER_TYPES[t.type]) color = TOWER_TYPES[t.type].color;
  ctx.fillStyle = color;
  ctx.fillRect(-half, -half, size, size);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  ctx.strokeRect(-half, -half, size, size);
  ctx.restore();
  drawTowerIcon(t.type, x, y, size);
}

// ============ 遊戲迴圈 ============
let statsTimer = 0, saveTimer = 0;
function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  if (gameState !== 'playing') { requestAnimationFrame(gameLoop); return; }
  dt *= speedMultiplier;
  hasGoldTower = SPOTS.some(function(s) { return s.tower && s.tower.type === 'gold'; });
  recomputeBuffs();
  if (!gameOver) {
    if (waveActive) {
      spawnTimer += dt;
      while (spawnQueue.length > 0 && spawnQueue[0].delay <= spawnTimer) {
        const s = spawnQueue.shift();
        enemies.push(new Enemy(s.hp, s.speed, s.isBoss));
      }
      if (spawnQueue.length === 0 && enemies.filter(function(e) { return e.alive; }).length === 0) {
        waveActive = false;
        startWaveBtn.disabled = false;
        if (autoNext) autoNextTimer = 2.0;
        saveGame();
        const cfg = DIFFICULTIES[currentDifficulty];
        if (wave >= cfg.maxWave) finishGame(true);
      }
    } else if (autoNext && autoNextTimer > 0) {
      autoNextTimer -= dt;
      if (autoNextTimer <= 0) startWave();
    }
    for (let i = 0; i < enemies.length; i++) enemies[i].update(dt);
    for (let i = 0; i < SPOTS.length; i++) {
      if (SPOTS[i].tower) SPOTS[i].tower.update(dt);
    }
    for (let i = 0; i < bullets.length; i++) bullets[i].update(dt);
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) {
        if (e.reachedEnd) lives -= e.isBoss ? 10 : 1;
        else { money += e.isBoss ? 250 : 10; if (!e.isBoss) sfxCoin(); }
        updateUI();
      }
    }
    enemies = enemies.filter(function(e) { return e.alive; });
    bullets = bullets.filter(function(b) { return b.alive; });
    if (lives <= 0 && !gameOver) finishGame(false);
    saveTimer += dt;
    if (saveTimer >= SAVE_INTERVAL) { saveTimer = 0; saveGame(); }
  }
  updateTowerPanel();
  statsTimer += dt;
  if (statsTimer > 0.2) { statsTimer = 0; renderStats(); }
  drawBackground();
  drawPath();
  for (let i = 0; i < SPOTS.length; i++) drawSpot(SPOTS[i]);
  for (let i = 0; i < SPOTS.length; i++) {
    if (SPOTS[i].tower) SPOTS[i].tower.draw();
  }
  for (let i = 0; i < enemies.length; i++) enemies[i].draw();
  for (let i = 0; i < bullets.length; i++) bullets[i].draw();
  drawDragGhost();
  const boss = enemies.find(function(e) { return e.isBoss && e.alive; });
  if (boss) {
    bossBar.classList.add('show');
    bossHpEl.style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%';
  } else bossBar.classList.remove('show');
  requestAnimationFrame(gameLoop);
}

function checkShowBranchUI(tower) {
    const branchBox = document.getElementById('branch-options');
    if (!branchBox) return;
    
    // 條件：滿級或指定等級 (如 Lv.3) 且尚未進化
    if (tower.level >= 3 && !tower.branch) {
        branchBox.style.display = 'flex';
        const typeKey = tower.baseType || tower.type;
        const evo = EVOLUTION_DATA[typeKey];
        if (evo) {
            document.getElementById('branch-a-title').innerText = `分支 A: ${evo.A.name}`;
            document.getElementById('branch-a-desc').innerText = evo.A.desc;
            document.getElementById('branch-b-title').innerText = `分支 B: ${evo.B.name}`;
            document.getElementById('branch-b-desc').innerText = evo.B.desc;
        }
    } else {
        branchBox.style.display = 'none';
    }
}
