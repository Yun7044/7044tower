<script>
(function() {
  'use strict';

  const W = 960, H = 540;

  // ------------------------------------------------------------
  // 共用計時
  // ------------------------------------------------------------
  let _lastT = performance.now();
  let _dt = 0.016;
  let _time = 0;
  function _tick() {
    const now = performance.now();
    _dt = Math.min((now - _lastT) / 1000, 0.1);
    _lastT = now;
    _time += _dt;
  }

  // ============================================================
  // A. 螢火蟲（漂浮光點）
  // ============================================================
  const FIREFLY_MAX = 28;
  const fireflies = [];
  for (let i = 0; i < FIREFLY_MAX; i++) {
    fireflies.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.5) * 11,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 1.7,
      size: 0.8 + Math.random() * 1.5,
      hue: Math.random() < 0.5 ? 45 : (Math.random() < 0.5 ? 285 : 190),
      alpha: 0.25 + Math.random() * 0.5,
    });
  }

  function updateFireflies(dt) {
    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];
      f.phase += dt * f.speed * 1.6;
      f.x += (f.vx + Math.sin(f.phase * 0.8) * 9) * dt;
      f.y += (f.vy + Math.cos(f.phase * 0.6) * 7) * dt;
      if (f.x < -30) f.x = W + 30;
      else if (f.x > W + 30) f.x = -30;
      if (f.y < -30) f.y = H + 30;
      else if (f.y > H + 30) f.y = -30;
    }
  }

  function drawFireflies() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];
      const pulse = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(f.phase * 2.1));
      const a = f.alpha * pulse;
      const r = f.size * (0.8 + pulse * 0.6);
      ctx.fillStyle = 'hsla(' + f.hue + ', 100%, 65%, ' + (a * 0.16) + ')';
      ctx.beginPath(); ctx.arc(f.x, f.y, r * 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'hsla(' + f.hue + ', 100%, 72%, ' + (a * 0.42) + ')';
      ctx.beginPath(); ctx.arc(f.x, f.y, r * 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'hsla(' + f.hue + ', 100%, 94%, ' + a + ')';
      ctx.beginPath(); ctx.arc(f.x, f.y, r * 0.75, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ============================================================
  // B. 路邊火把
  // ============================================================
  let _torchKey = '';
  let _torches = [];

  function buildTorches() {
    const key = (typeof currentDifficulty === 'string' ? currentDifficulty : '-') + '|' +
                (typeof PATH_TOTAL === 'number' ? PATH_TOTAL.toFixed(1) : '0');
    if (key === _torchKey) return _torches;
    _torchKey = key;
    _torches = [];
    if (typeof PATH_TOTAL !== 'number' || PATH_TOTAL <= 0) return _torches;

    const spacing = 195;
    let d = 95;
    let side = 1;
    while (d < PATH_TOTAL - 55) {
      const p = getPosOnPath(d);
      const nx = -Math.sin(p.angle) * side;
      const ny = Math.cos(p.angle) * side;
      const off = 40;
      const tx = p.x + nx * off;
      const ty = p.y + ny * off;
      if (tx > 16 && tx < W - 16 && ty > 16 && ty < H - 16) {
        _torches.push({ x: tx, y: ty, phase: Math.random() * Math.PI * 2 });
      }
      d += spacing;
      side = -side;
    }
    return _torches;
  }

  function drawTorches(t) {
    const list = buildTorches();
    for (let i = 0; i < list.length; i++) {
      const tr = list[i];
      const flick = 0.72 + 0.28 * Math.sin(t * 8.5 + tr.phase) * Math.sin(t * 3.1 + tr.phase * 1.7);

      // 光暈
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(tr.x, tr.y - 8, 0, tr.x, tr.y - 8, 52);
      g.addColorStop(0, 'rgba(255, 190, 90, ' + (0.30 * flick) + ')');
      g.addColorStop(0.4, 'rgba(255, 120, 40, ' + (0.10 * flick) + ')');
      g.addColorStop(1, 'rgba(255, 80, 0, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(tr.x, tr.y - 8, 52, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // 木桿
      ctx.save();
      ctx.strokeStyle = '#3a2418';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tr.x, tr.y + 17); ctx.lineTo(tr.x, tr.y - 6); ctx.stroke();
      ctx.strokeStyle = 'rgba(140, 95, 60, 0.55)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(tr.x - 1, tr.y + 15); ctx.lineTo(tr.x - 1, tr.y - 5); ctx.stroke();

      // 頂端托盤
      ctx.fillStyle = '#2a1a10';
      ctx.beginPath(); ctx.ellipse(tr.x, tr.y - 6, 5.5, 2.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(160, 110, 60, 0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 火焰
      const fh = 10 + flick * 6;
      const fg = ctx.createLinearGradient(tr.x, tr.y - 7 - fh, tr.x, tr.y - 5);
      fg.addColorStop(0, 'rgba(255, 245, 175, 1)');
      fg.addColorStop(0.45, 'rgba(255, 170, 40, 0.95)');
      fg.addColorStop(1, 'rgba(255, 80, 0, 0.6)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(tr.x - 4.5, tr.y - 6);
      ctx.quadraticCurveTo(tr.x - 5.5, tr.y - 6 - fh * 0.55, tr.x, tr.y - 6 - fh);
      ctx.quadraticCurveTo(tr.x + 5.5, tr.y - 6 - fh * 0.55, tr.x + 4.5, tr.y - 6);
      ctx.closePath();
      ctx.fill();

      // 內焰
      ctx.fillStyle = 'rgba(255, 252, 225, 0.92)';
      ctx.beginPath();
      ctx.moveTo(tr.x - 1.9, tr.y - 6);
      ctx.quadraticCurveTo(tr.x - 2.1, tr.y - 6 - fh * 0.42, tr.x, tr.y - 6 - fh * 0.64);
      ctx.quadraticCurveTo(tr.x + 2.1, tr.y - 6 - fh * 0.42, tr.x + 1.9, tr.y - 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 飄散火星
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 3; k++) {
        const sp = (t * (0.8 + k * 0.25) + tr.phase * 0.4 + k * 0.37) % 1;
        const ex = tr.x + Math.sin(sp * 8 + tr.phase + k) * (5 + sp * 13);
        const ey = tr.y - 8 - sp * 40;
        ctx.fillStyle = 'rgba(255, ' + Math.floor(190 - sp * 90) + ', 70, ' + ((1 - sp) * 0.75) + ')';
        ctx.beginPath(); ctx.arc(ex, ey, 1.3 * (1 - sp * 0.5), 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  // ============================================================
  // C. 地面水晶裝飾
  // ============================================================
  const CRYSTALS = [];
  let _crystalKey = '';

  function buildCrystals() {
    const key = (typeof currentDifficulty === 'string' ? currentDifficulty : '-') + '|' +
                (typeof PATH_TOTAL === 'number' ? PATH_TOTAL.toFixed(0) : '0');
    if (key === _crystalKey) return;
    _crystalKey = key;
    CRYSTALS.length = 0;

    let tries = 0;
    while (CRYSTALS.length < 15 && tries < 320) {
      tries++;
      const x = 34 + Math.random() * (W - 68);
      const y = 34 + Math.random() * (H - 68);
      let ok = true;

      for (let i = 0; i < SPOTS.length; i++) {
        if (Math.hypot(x - SPOTS[i].x, y - SPOTS[i].y) < 76) { ok = false; break; }
      }
      if (!ok) continue;

      if (typeof PATH_TOTAL === 'number' && PATH_TOTAL > 0) {
        for (let d = 0; d <= PATH_TOTAL; d += 30) {
          const p = getPosOnPath(d);
          if (Math.hypot(x - p.x, y - p.y) < 46) { ok = false; break; }
        }
      }
      if (!ok) continue;

      const hue = [285, 195, 160, 45][Math.floor(Math.random() * 4)];
      const n = 2 + Math.floor(Math.random() * 3);
      const shards = [];
      for (let i = 0; i < n; i++) {
        shards.push({
          dx: (i - (n - 1) / 2) * (6 + Math.random() * 5),
          h: 8 + Math.random() * 15,
          w: 2.5 + Math.random() * 2.5,
          tilt: (Math.random() - 0.5) * 0.5,
        });
      }
      CRYSTALS.push({ x: x, y: y, hue: hue, shards: shards, phase: Math.random() * Math.PI * 2 });
    }
  }

  function drawCrystals(t) {
    buildCrystals();
    for (let i = 0; i < CRYSTALS.length; i++) {
      const c = CRYSTALS[i];
      const pulse = 0.6 + 0.4 * Math.sin(t * 1.6 + c.phase);

      // 地面陰影
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
      ctx.beginPath(); ctx.ellipse(c.x, c.y + 3, 15, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // 環境光暈
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'hsla(' + c.hue + ', 90%, 60%, ' + (0.075 * pulse) + ')';
      ctx.beginPath(); ctx.arc(c.x, c.y, 30, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // 水晶柱
      for (let j = 0; j < c.shards.length; j++) {
        const s = c.shards[j];
        ctx.save();
        ctx.translate(c.x + s.dx, c.y);
        ctx.rotate(s.tilt);
        const g = ctx.createLinearGradient(0, -s.h, 0, 3);
        g.addColorStop(0, 'hsla(' + c.hue + ', 95%, 86%, 0.95)');
        g.addColorStop(0.55, 'hsla(' + c.hue + ', 85%, 60%, 0.9)');
        g.addColorStop(1, 'hsla(' + c.hue + ', 70%, 33%, 0.92)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, -s.h);
        ctx.lineTo(-s.w, -s.h * 0.25);
        ctx.lineTo(-s.w * 0.6, 3);
        ctx.lineTo(s.w * 0.6, 3);
        ctx.lineTo(s.w, -s.h * 0.25);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'hsla(' + c.hue + ', 100%, 92%, 0.5)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        // 高光
        ctx.beginPath();
        ctx.moveTo(0, -s.h);
        ctx.lineTo(-s.w * 0.45, -s.h * 0.15);
        ctx.lineTo(-s.w * 0.25, 2);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.fill();
        ctx.restore();
      }
    }
  }

  // ============================================================
  // D. 路徑流動能量光點
  // ============================================================
  const SPARKS = [];
  for (let i = 0; i < 16; i++) {
    SPARKS.push({
      d: Math.random(),
      speed: 0.012 + Math.random() * 0.022,
      off: (Math.random() - 0.5) * 20,
      size: 1 + Math.random() * 1.8,
      hue: 275 + Math.random() * 60,
      phase: Math.random() * Math.PI * 2,
    });
  }

  function updateSparks(dt) {
    for (let i = 0; i < SPARKS.length; i++) {
      const s = SPARKS[i];
      s.d += s.speed * dt;
      s.phase += dt * 3;
      if (s.d > 1) { s.d -= 1; s.off = (Math.random() - 0.5) * 20; }
    }
  }

  function drawSparks() {
    if (typeof PATH_TOTAL !== 'number' || PATH_TOTAL <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < SPARKS.length; i++) {
      const s = SPARKS[i];
      const p = getPosOnPath(s.d * PATH_TOTAL);
      const nx = -Math.sin(p.angle), ny = Math.cos(p.angle);
      const x = p.x + nx * s.off;
      const y = p.y + ny * s.off;
      const a = 0.35 + 0.35 * Math.sin(s.phase);
      ctx.fillStyle = 'hsla(' + s.hue + ', 100%, 75%, ' + (a * 0.22) + ')';
      ctx.beginPath(); ctx.arc(x, y, s.size * 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'hsla(' + s.hue + ', 100%, 90%, ' + a + ')';
      ctx.beginPath(); ctx.arc(x, y, s.size * 0.9, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ============================================================
  // E. 地面霧氣
  // ============================================================
  function drawGroundFog(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
      const y = H - 20 - i * 38;
      const speed = 14 + i * 9;
      const cx = ((t * speed + i * 420) % (W + 560)) - 280;
      const g = ctx.createRadialGradient(cx, y, 0, cx, y, 280);
      g.addColorStop(0, 'rgba(120, 70, 190, ' + (0.055 - i * 0.008) + ')');
      g.addColorStop(1, 'rgba(120, 70, 190, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - 280, y - 140, 560, 280);
    }
    ctx.restore();
  }

  // ============================================================
  // F. 流星
  // ============================================================
  let _meteor = null;
  let _meteorCd = 6 + Math.random() * 8;

  function updateMeteor(dt) {
    if (_meteor) {
      _meteor.t += dt;
      _meteor.x += _meteor.vx * dt;
      _meteor.y += _meteor.vy * dt;
      if (_meteor.t > _meteor.life) _meteor = null;
      return;
    }
    _meteorCd -= dt;
    if (_meteorCd <= 0) {
      _meteorCd = 7 + Math.random() * 11;
      const dirX = Math.random() < 0.5 ? 1 : -1;
      const spd = 600 + Math.random() * 320;
      _meteor = {
        x: dirX > 0 ? -80 : W + 80,
        y: -30 + Math.random() * 180,
        vx: dirX * spd,
        vy: spd * (0.35 + Math.random() * 0.25),
        t: 0,
        life: 1.6 + Math.random() * 0.8,
      };
    }
  }

  function drawMeteor() {
    if (!_meteor) return;
    const m = _meteor;
    const fade = Math.sin((m.t / m.life) * Math.PI);
    const tx = m.x - m.vx * 0.085;
    const ty = m.y - m.vy * 0.085;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(tx, ty, m.x, m.y);
    g.addColorStop(0, 'rgba(180, 220, 255, 0)');
    g.addColorStop(0.6, 'rgba(200, 230, 255, ' + (0.35 * fade) + ')');
    g.addColorStop(1, 'rgba(255, 255, 255, ' + (0.9 * fade) + ')');
    ctx.strokeStyle = g;
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(m.x, m.y); ctx.stroke();

    ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.95 * fade) + ')';
    ctx.beginPath(); ctx.arc(m.x, m.y, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(200, 230, 255, ' + (0.28 * fade) + ')';
    ctx.beginPath(); ctx.arc(m.x, m.y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ============================================================
  // G. 頂層光暈（增加縱深）
  // ============================================================
  function drawTopAurora(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const shift = Math.sin(t * 0.12) * 40;
    const g = ctx.createRadialGradient(W * 0.62 + shift, -40, 0, W * 0.62 + shift, -40, 420);
    g.addColorStop(0, 'rgba(90, 130, 255, 0.10)');
    g.addColorStop(0.5, 'rgba(70, 90, 200, 0.045)');
    g.addColorStop(1, 'rgba(70, 90, 200, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, 340);
    ctx.restore();
  }

  // ============================================================
  // 掛鉤：包裝 drawBackground
  // ============================================================
  const _origDrawBackground = window.drawBackground;
  window.drawBackground = function() {
    _tick();
    _origDrawBackground();
    drawTopAurora(_time);
    updateMeteor(_dt);
    drawMeteor();
    drawGroundFog(_time);
    drawCrystals(_time);
    updateSparks(_dt);
  };

  // ============================================================
  // 掛鉤：包裝 drawPath
  // ============================================================
  const _origDrawPath = window.drawPath;
  window.drawPath = function() {
    _origDrawPath();
    drawSparks();
    drawTorches(_time);
    updateFireflies(_dt);
    drawFireflies();
  };

  console.log('[美術] 場景裝飾系統載入完成');
})();
</script>

<script>
// ============================================================
// 橙塔進化系統
// ============================================================
(function() {
    'use strict';
    console.log('[進化] 橙塔進化系統載入中...');

    const _evo = new WeakMap();
    function getEvo(t) {
        if (!t) return null;
        if (!_evo.has(t)) {
            _evo.set(t, {
                evolution: null,
                baseType: t.type,
                baseConfig: t.config,
                focusTarget: null,
                focusTime: 0,
            });
        }
        return _evo.get(t);
    }

    const _prevUpdate = BeamTower.prototype.update;
    BeamTower.prototype.update = function(dt) {
        const st = getEvo(this);
        if (!st.evolution || st.baseType !== 'orange') {
            return _prevUpdate.call(this, dt);
        }
        this.pulse += dt;
        if (this.hastedTimer > 0) this.hastedTimer -= dt;
        const dm = this.hastedTimer > 0 ? 3 : 1;

        if (st.evolution === 'A') {
            let best = null, bestHp = -1;
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (!e.alive) continue;
                if (e.hp > bestHp) { bestHp = e.hp; best = e; }
            }
            if (!best) { st.focusTarget = null; st.focusTime = 0; this.beamTargets = []; return; }
            if (st.focusTarget !== best) { st.focusTarget = best; st.focusTime = 0; }
            st.focusTime += dt;
            const mult = Math.min(6, 1 + st.focusTime * 0.5);
            const dps = this.dps * mult * dm;
            this.beamTargets = [best];
            const actual = best.takeDamage(dps * dt);
            if (actual > 0) addDamage('orange', actual);
            return;
        }

        if (st.evolution === 'B') {
            this.reacquireTimer -= dt;
            if (this.reacquireTimer <= 0) {
                this.beamTargets = this.pickRandom(this.beamCount);
                this.reacquireTimer = this.config.reacquireInterval;
            }
            this.beamTargets = this.beamTargets.filter(function(e) { return e.alive; });
            for (let i = 0; i < this.beamTargets.length; i++) {
                const target = this.beamTargets[i];
                const actual = target.takeDamage(this.dps * dt * dm);
                addDamage('orange', actual);
            }
            for (let i = 0; i < this.beamTargets.length; i++) {
                const main = this.beamTargets[i];
                if (!main.alive) continue;
                const mp = main.getPos();
                for (let j = 0; j < enemies.length; j++) {
                    const e = enemies[j];
                    if (!e.alive || e === main) continue;
                    const p = e.getPos();
                    if (Math.hypot(p.x - mp.x, p.y - mp.y) <= 100) {
                        const actual = e.takeDamage(this.dps * 0.5 * dt * dm);
                        if (actual > 0) addDamage('orange', actual);
                    }
                }
            }
            return;
        }
        _prevUpdate.call(this, dt);
    };

    function drawOrangeEvolvedIcon(branch, x, y, size) {
        ctx.save();
        const s = size;
        if (branch === 'A') {
            const h = s * 0.44, w = s * 0.22;
            const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 150);
            ctx.shadowColor = '#ff4500';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + w, y - h * 0.3);
            ctx.lineTo(x + w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w, y - h * 0.3);
            ctx.closePath();
            const g = ctx.createLinearGradient(x, y - h, x, y + h);
            g.addColorStop(0, '#ffe0a0');
            g.addColorStop(0.4, '#ff4500');
            g.addColorStop(1, '#4a1200');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffd0a0';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = 'rgba(255, 255, 200, ' + pulse + ')';
            ctx.shadowColor = '#ffcc00';
            ctx.shadowBlur = 18 * pulse;
            ctx.beginPath();
            ctx.arc(x, y, 5 + pulse * 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 140, 60, ' + (0.5 + pulse * 0.4) + ')';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, s * 0.35 + pulse * 4, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            const h = s * 0.44, w = s * 0.22;
            ctx.shadowColor = '#ff8c00';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + w, y - h * 0.3);
            ctx.lineTo(x + w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w, y - h * 0.3);
            ctx.closePath();
            const g = ctx.createLinearGradient(x, y - h, x, y + h);
            g.addColorStop(0, '#fff8c0');
            g.addColorStop(0.4, '#ff8c00');
            g.addColorStop(1, '#6a2800');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffe0a0';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            const spin = performance.now() / 400;
            ctx.strokeStyle = 'rgba(255, 220, 140, 0.9)';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#ffcc00';
            ctx.shadowBlur = 12;
            for (let i = 0; i < 8; i++) {
                const a = i * Math.PI / 4 + spin;
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(a) * s * 0.32, y + Math.sin(a) * s * 0.32);
                ctx.lineTo(x + Math.cos(a) * s * 0.46, y + Math.sin(a) * s * 0.46);
                ctx.stroke();
            }
        }
        ctx.restore();
    }

    const _prevDrawBody = BeamTower.prototype.drawBody;
    BeamTower.prototype.drawBody = function(x, y, alpha) {
        const st = getEvo(this);
        if (st.evolution && st.baseType === 'orange') {
            ctx.save();
            ctx.globalAlpha = alpha;
            const color = st.evolution === 'A' ? '#ff4500' : '#ff8c00';
            drawTowerBase(x, y, color, true);
            ctx.restore();
            drawOrangeEvolvedIcon(st.evolution, x, y, 70);
            return;
        }
        _prevDrawBody.call(this, x, y, alpha);
    };

    function canEvolve(t) {
        if (!t) return false;
        const st = getEvo(t);
        return !st.evolution && st.baseType === 'orange' && t.level >= 3;
    }

    function doOrangeEvolve(branch) {
        const t = selectedTower;
        if (!t || !canEvolve(t)) return;
        const st = getEvo(t);
        st.evolution = branch;
        if (branch === 'A') {
            t.config = Object.assign({}, st.baseConfig, { name: '聚能伽馬塔', color: '#ff4500' });
            log('☢️ 橙塔進化為【聚能伽馬塔】！', 3000);
        } else {
            t.config = Object.assign({}, st.baseConfig, { name: '超新星塔', color: '#ff8c00' });
            log('✨ 橙塔進化為【超新星塔】！', 3000);
        }
        sfxUpgrade();
        updateUI();
        updateTowerPanel();
        saveGame();
    }

(function() {
    'use strict';

    function getEvolutionFromConfig(tower) {
        const n = tower.config && tower.config.name;
        if (n === '墨綠塔') return { base: 'green', branch: 'A' };
        if (n === '天狼之塔') return { base: 'green', branch: 'B' };
        if (n === '質量塔') return { base: 'purple', branch: 'A' };
        if (n === '霜凍塔') return { base: 'purple', branch: 'B' };
        if (n === '電磁鏈塔') return { base: 'blue', branch: 'A' };
        if (n === '超頻藍塔') return { base: 'blue', branch: 'B' };
        if (n === '聚能伽馬塔') return { base: 'orange', branch: 'A' };
        if (n === '超新星塔') return { base: 'orange', branch: 'B' };
        if (n === '全金屬狂潮塔') return { base: 'silver', branch: 'A' };
        if (n === '霰彈加特林塔') return { base: 'silver', branch: 'B' };
        return null;
    }

    saveGame = function() {
        if (!currentDifficulty || gameState !== 'playing') return;
        try {
            const towerData = [];
            for (let i = 0; i < SPOTS.length; i++) {
                const s = SPOTS[i];
                if (s.tower) {
                    const evo = getEvolutionFromConfig(s.tower);
                    towerData.push({
                        idx: i,
                        type: evo ? evo.base : s.tower.type,
                        level: s.tower.level,
                        evolution: evo ? evo.branch : null,
                    });
                }
            }
            const data = {
                version: 1,
                difficulty: currentDifficulty,
                money: money,
                lives: lives,
                wave: wave,
                damageStats: damageStats,
                unlocked: Object.assign({}, unlocked),
                towers: towerData,
                timestamp: Date.now(),
            };
            localStorage.setItem(getSaveKey(), JSON.stringify(data));
        } catch (e) {}
    };

    loadGame = function() {
        if (!currentDifficulty) return false;
        try {
            const raw = localStorage.getItem(getSaveKey());
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (!data || data.version !== 1 || data.difficulty !== currentDifficulty || data.wave === 0) return false;
            money = data.money || DIFFICULTIES[currentDifficulty].startMoney;
            lives = data.lives || DIFFICULTIES[currentDifficulty].startLives;
            wave = data.wave || 0;
            damageStats = data.damageStats || {};
            if (data.unlocked) {
                for (const k in data.unlocked) {
                    if (unlocked.hasOwnProperty(k)) unlocked[k] = data.unlocked[k];
                }
            }
            for (let i = 0; i < SPOTS.length; i++) SPOTS[i].tower = null;
            const towers = data.towers || [];
            for (let i = 0; i < towers.length; i++) {
                const t = towers[i];
                const spot = SPOTS[t.idx];
                if (!spot) continue;
                const tower = createTower(spot, t.type);
                if (!tower) continue;
                tower.level = Math.min(t.level || 1, MAX_TOWER_LEVEL);
                if (tower.applyLevel) tower.applyLevel();
                spot.tower = tower;
                if (t.evolution) {
                    const oldSel = selectedTower;
                    selectedTower = tower;
                    try { window.evolveSelectedTower(t.evolution); } catch (e) {}
                    selectedTower = oldSel;
                }
            }
            for (const type in unlocked) {
                const btn = document.querySelector('.shop-btn[data-type="' + type + '"]');
                if (!btn) continue;
                if (unlocked[type]) btn.classList.remove('locked');
                else btn.classList.add('locked');
            }
            updateUI();
            return true;
        } catch (e) { return false; }
    };

    console.log('[存檔] 最終整合完成');
})();

<script>

// 傷害數字彈出系統
// ============================================================
(function() {
    'use strict';
    console.log('[傷害數字] 載入中...');

    const _damageNumbers = [];
    const _lastDmgTime = new WeakMap();
    const THROTTLE_MS = 100;
    const MAX_NUMBERS = 60;

    function spawnDamageNumber(enemy, dmg, killed) {
        if (!enemy || dmg <= 0) return;
        const p = enemy.getPos();
        const jitterX = (Math.random() - 0.5) * 24;
        const dmgInt = Math.round(dmg);

        let text, color, size, isKO = false;

        if (killed && !enemy.isBoss) {
            // 秒殺 / 擊殺 → 金色 K.O.
            isKO = true;
            text = 'K.O.';
            color = '#ffd700';
            size = 26;
        } else if (dmg >= 500) {
            text = '-' + dmgInt;
            color = '#ff3333';
            size = 22;
        } else if (dmg >= 100) {
            text = '-' + dmgInt;
            color = '#ff8844';
            size = 18;
        } else if (dmg >= 30) {
            text = '-' + dmgInt;
            color = '#ffffff';
            size = 15;
        } else {
            text = '-' + dmgInt;
            color = '#bbbbbb';
            size = 13;
        }

        _damageNumbers.push({
            x: p.x + jitterX,
            y: p.y - 18,
            text: text,
            color: color,
            size: size,
            life: 0.85,
            maxLife: 0.85,
            vy: -75,
            isKO: isKO,
        });

        if (_damageNumbers.length > MAX_NUMBERS) {
            _damageNumbers.splice(0, _damageNumbers.length - MAX_NUMBERS);
        }
    }

    // 包裝 takeDamage 攔截傷害
    const _origTakeDamage = Enemy.prototype.takeDamage;
    Enemy.prototype.takeDamage = function(amount) {
        const wasAlive = this.alive;
        const result = _origTakeDamage.call(this, amount);
        const killed = wasAlive && !this.alive;

        const now = performance.now();
        const last = _lastDmgTime.get(this) || 0;
        // 節流：100ms 內同一個敵人只顯示一個數字（除非被擊殺）
        if (now - last < THROTTLE_MS && !killed) {
            return result;
        }
        _lastDmgTime.set(this, now);
        spawnDamageNumber(this, result, killed);
        return result;
    };

    // 包裝 drawDragGhost，在最後一層繪製傷害數字
    const _prevDrawDragGhost = drawDragGhost;
    drawDragGhost = function() {
        _prevDrawDragGhost.call(this);

        const dt = 1 / 60;
        for (let i = _damageNumbers.length - 1; i >= 0; i--) {
            const d = _damageNumbers[i];
            d.life -= dt;
            d.y += d.vy * dt;
            d.vy *= 0.96;
            if (d.life <= 0) _damageNumbers.splice(i, 1);
        }

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let i = 0; i < _damageNumbers.length; i++) {
            const d = _damageNumbers[i];
            const alpha = d.life > 0.3 ? 1 : d.life / 0.3;
            ctx.globalAlpha = alpha;
            ctx.font = 'bold ' + d.size + 'px system-ui, -apple-system, sans-serif';

            // 黑邊
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.lineWidth = d.isKO ? 4 : 3;
            ctx.strokeText(d.text, d.x, d.y);

            // 填色
            ctx.fillStyle = d.color;
            if (d.isKO) {
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 15;
            }
            ctx.fillText(d.text, d.x, d.y);
            ctx.shadowBlur = 0;
        }
        ctx.restore();
    };

    console.log('[傷害數字] 載入完成');
})();
</script>

(function() {
    'use strict';
    console.log('[技能] 隕石系統載入中...');

    const METEOR_KEY = 'towerDefenseMeteorUnlocked_v1';
    const METEOR_COST = 500;
    const METEOR_CD = 60;
    const METEOR_COUNT = 5;
    const METEOR_DAMAGE = 5000;
    const METEOR_RADIUS = 100;

    let meteorUnlocked = false;
    let meteorCooldown = 0;
    try { meteorUnlocked = localStorage.getItem(METEOR_KEY) === '1'; } catch(e) {}

    const _meteors = [];
    const _impacts = [];

    // 包裝 drawDragGhost，在最後繪製隕石
    const _prevDrawGhost = drawDragGhost;
    drawDragGhost = function() {
        _prevDrawGhost.call(this);

        const dt = 1 / 60;

        // 更新隕石位置
        for (let i = _meteors.length - 1; i >= 0; i--) {
            const m = _meteors[i];
            m.y += m.speed * dt;
            // 拖尾粒子
            m.trail = m.trail || [];
            m.trail.push({ x: m.x, y: m.y, life: 0.4 });
            if (m.trail.length > 8) m.trail.shift();
            for (let k = m.trail.length - 1; k >= 0; k--) {
                m.trail[k].life -= dt;
                if (m.trail[k].life <= 0) m.trail.splice(k, 1);
            }

            if (m.y >= m.targetY) {
                impactMeteor(m.x, m.targetY);
                _meteors.splice(i, 1);
            }
        }

        // 繪製隕石
        for (let i = 0; i < _meteors.length; i++) {
            const m = _meteors[i];
            // 拖尾
            for (let k = 0; k < m.trail.length; k++) {
                const t = m.trail[k];
                const a = t.life / 0.4;
                ctx.fillStyle = 'rgba(255, ' + Math.floor(100 + a * 120) + ', 30, ' + (a * 0.6) + ')';
                ctx.beginPath();
                ctx.arc(t.x + (Math.random() - 0.5) * 6, t.y, 3 + a * 4, 0, Math.PI * 2);
                ctx.fill();
            }
            // 隕石本體
            ctx.save();
            ctx.shadowColor = '#ff5500';
            ctx.shadowBlur = 25;
            const grad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 18);
            grad.addColorStop(0, '#fff8c0');
            grad.addColorStop(0.4, '#ff6600');
            grad.addColorStop(1, '#661100');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(m.x, m.y, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            // 目標位置的光圈
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 100, 50, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.arc(m.x, m.targetY, METEOR_RADIUS * 0.8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }

        // 繪製落地爆炸
        for (let i = _impacts.length - 1; i >= 0; i--) {
            const im = _impacts[i];
            im.timer -= dt;
            if (im.timer <= 0) { _impacts.splice(i, 1); continue; }
            const t = 1 - im.timer / im.maxLife;
            const r = METEOR_RADIUS * (0.3 + t * 0.9);
            ctx.save();
            ctx.shadowColor = '#ff4400';
            ctx.shadowBlur = 30;
            const alpha = im.timer / im.maxLife;
            const grad = ctx.createRadialGradient(im.x, im.y, 0, im.x, im.y, r);
            grad.addColorStop(0, 'rgba(255, 240, 180, ' + alpha + ')');
            grad.addColorStop(0.5, 'rgba(255, 100, 30, ' + (alpha * 0.8) + ')');
            grad.addColorStop(1, 'rgba(80, 20, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(im.x, im.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 180, 100, ' + alpha + ')';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(im.x, im.y, r * 0.9, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    };

    function impactMeteor(x, y) {
        _impacts.push({ x: x, y: y, timer: 0.6, maxLife: 0.6 });
        sfxHit();
        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            if (!e.alive) continue;
            const p = e.getPos();
            if (Math.hypot(p.x - x, p.y - y) <= METEOR_RADIUS) {
                let dmg = METEOR_DAMAGE;
                if (e.isBoss) dmg *= 0.5;
                e.takeDamage(dmg);
            }
        }
    }

    // 觸發隕石
    function triggerMeteor() {
        if (!meteorUnlocked) {
            if (money < METEOR_COST) {
                log('金幣不足（需 ' + METEOR_COST + '）', 2000);
                return;
            }
            money -= METEOR_COST;
            meteorUnlocked = true;
            try { localStorage.setItem(METEOR_KEY, '1'); } catch(e) {}
            log('☄️ 隕石轟炸已解鎖！', 3000);
            updateUI();
            sfxGold();
            return;
        }
        if (meteorCooldown > 0) {
            log('☄️ 冷卻中（' + Math.ceil(meteorCooldown) + 's）', 1500);
            return;
        }
        meteorCooldown = METEOR_CD;
        for (let i = 0; i < METEOR_COUNT; i++) {
            const rx = 120 + Math.random() * (BASE_W - 240);
            const ry = 100 + Math.random() * (BASE_H - 220);
            _meteors.push({
                x: rx,
                y: -80 - Math.random() * 60,
                targetY: ry,
                speed: 900 + Math.random() * 300,
                trail: [],
            });
        }
        log('☄️ 隕石轟炸！', 2000);
        sfxBoss();
    }

    // 冷卻每幀遞減（包裝 gameLoop 不行，改用 setInterval 較安全）
    setInterval(function() {
        if (meteorCooldown > 0) meteorCooldown = Math.max(0, meteorCooldown - 0.05);
    }, 50);

    // UI 更新
    function updateSkillUI() {
        const btn = document.getElementById('skillMeteor');
        if (!btn) return;
        if (!meteorUnlocked) {
            btn.classList.add('locked');
            btn.classList.remove('cooling', 'unlocked');
            btn.dataset.cd = '';
        } else {
            btn.classList.remove('locked');
            btn.classList.add('unlocked');
            if (meteorCooldown > 0) {
                btn.classList.add('cooling');
                btn.dataset.cd = Math.ceil(meteorCooldown);
            } else {
                btn.classList.remove('cooling');
                btn.dataset.cd = '';
            }
        }
    }
    setInterval(updateSkillUI, 100);
    updateSkillUI();

    // 綁定按鈕
    const btn = document.getElementById('skillMeteor');
    if (btn) {
        btn.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            e.stopPropagation();
            initAudio();
            triggerMeteor();
        }, { passive: false });
    }

    console.log('[技能] 隕石系統載入完成');
})();
</script>

<script>
// ============================================================
// 塔技能：電磁鏈塔・電磁風暴
// ============================================================
(function() {
    'use strict';
    console.log('[技能] 電磁風暴載入中...');

    const STORM_KEY = 'towerDefenseElecStormUnlocked_v1';
    const STORM_COST = 400;
    const STORM_CD = 40;
    const STORM_DURATION = 5.0;
    const STORM_DPS_PERCENT = 0.02; // 每秒 2% 最大生命

    let stormUnlocked = false;
    let stormCooldown = 0;
    try { stormUnlocked = localStorage.getItem(STORM_KEY) === '1'; } catch(e) {}

    // 處理電磁風暴的 DOT
    const _prevEnemyUpdate = Enemy.prototype.update;
    Enemy.prototype.update = function(dt) {
        if (this.alive && this._elecStorm > 0) {
            this._elecStorm -= dt;
            const dmg = this.maxHp * STORM_DPS_PERCENT * dt;
            const actual = this.takeDamage(dmg);
            if (actual > 0) addDamage('blue', actual);
        }
        _prevEnemyUpdate.call(this, dt);
    };

    // 電磁風暴視覺
    const _prevEnemyDraw = Enemy.prototype.draw;
    Enemy.prototype.draw = function() {
        _prevEnemyDraw.call(this);
        if (!this.alive || !(this._elecStorm > 0)) return;
        const p = this.getPos();
        const r = this.isBoss ? 22 : 13;
        const alpha = Math.min(1, this._elecStorm / 1.5);
        const seed = Math.floor(performance.now() / 60);
        ctx.save();
        ctx.shadowColor = '#00aaff';
        ctx.shadowBlur = 14;
        for (let i = 0; i < 4; i++) {
            const a1 = (seed * 0.4 + i * 1.6) % (Math.PI * 2);
            const a2 = a1 + 1.3 + (i % 2) * 0.5;
            const R = r + 5;
            ctx.strokeStyle = 'rgba(120, 210, 255, ' + alpha + ')';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(p.x + Math.cos(a1) * R, p.y + Math.sin(a1) * R);
            const mid = a1 + (a2 - a1) * 0.5;
            ctx.lineTo(p.x + Math.cos(mid) * (R + 6), p.y + Math.sin(mid) * (R + 6));
            ctx.lineTo(p.x + Math.cos(a2) * R, p.y + Math.sin(a2) * R);
            ctx.stroke();
        }
        ctx.restore();
    };

    function triggerStorm() {
        if (!stormUnlocked) {
            if (money < STORM_COST) {
                log('金幣不足（需 ' + STORM_COST + '）', 2000);
                return;
            }
            money -= STORM_COST;
            stormUnlocked = true;
            try { localStorage.setItem(STORM_KEY, '1'); } catch(e) {}
            log('⚡ 電磁風暴已解鎖！', 3000);
            updateUI();
            sfxGold();
            return;
        }
        if (stormCooldown > 0) {
            log('⚡ 冷卻中（' + Math.ceil(stormCooldown) + 's）', 1500);
            return;
        }
        stormCooldown = STORM_CD;
        let count = 0;
        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            if (!e.alive) continue;
            e._elecStorm = STORM_DURATION;
            count++;
        }
        log('⚡ 電磁風暴！纏繞 ' + count + ' 名敵人', 2000);
        sfxBoss();
    }

    setInterval(function() {
        if (stormCooldown > 0) stormCooldown = Math.max(0, stormCooldown - 0.05);
    }, 50);

    // 把函式與狀態暴露給 UI 系統
    window.__elecStormAPI = {
        isUnlocked: function() { return stormUnlocked; },
        getCooldown: function() { return stormCooldown; },
        trigger: triggerStorm,
        cost: STORM_COST,
    };

    console.log('[技能] 電磁風暴載入完成');
})();
</script>

<script>
// ============================================================
// 塔技能：聚能伽馬塔・過載
// ============================================================
(function() {
    'use strict';
    console.log('[技能] 過載載入中...');

    const OVERLOAD_KEY = 'towerDefenseOverloadUnlocked_v1';
    const OVERLOAD_COST = 600;
    const OVERLOAD_CD = 45;
    const OVERLOAD_DURATION = 8.0;

    let overloadUnlocked = false;
    let overloadCooldown = 0;
    let overloadActive = 0;
    try { overloadUnlocked = localStorage.getItem(OVERLOAD_KEY) === '1'; } catch(e) {}

    // 包裝 BeamTower.update，處理過載狀態
    const _prevBeamUpdate = BeamTower.prototype.update;
    BeamTower.prototype.update = function(dt) {
        // 檢查過載 + 這是聚能伽馬塔
        if (overloadActive > 0 && this.config && this.config.name === '聚能伽馬塔') {
            this.pulse += dt;
            if (this.hastedTimer > 0) this.hastedTimer -= dt;
            const dm = this.hastedTimer > 0 ? 3 : 1;

            // 找範圍內血量最高的敵人
            let best = null, bestHp = -1;
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (!e.alive) continue;
                if (e.hp > bestHp) { bestHp = e.hp; best = e; }
            }
            if (!best) {
                this.beamTargets = [];
                return;
            }
            // 直接 ×6 傷害
            const dps = this.dps * 6 * dm;
            this.beamTargets = [best];
            const actual = best.takeDamage(dps * dt);
            if (actual > 0) addDamage('orange', actual);
            return;
        }
        _prevBeamUpdate.call(this, dt);
    };

    // 過載視覺：塔發光
    const _prevBeamDraw = BeamTower.prototype.draw;
    BeamTower.prototype.draw = function() {
        if (overloadActive > 0 && this.config && this.config.name === '聚能伽馬塔') {
            const x = this.x, y = this.y;
            ctx.save();
            const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 80);
            ctx.shadowColor = '#ff3300';
            ctx.shadowBlur = 30 * pulse;
            ctx.strokeStyle = 'rgba(255, 100, 30, ' + pulse + ')';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(x, y, 45, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        _prevBeamDraw.call(this);
    };

    function triggerOverload() {
        if (!overloadUnlocked) {
            if (money < OVERLOAD_COST) {
                log('金幣不足（需 ' + OVERLOAD_COST + '）', 2000);
                return;
            }
            money -= OVERLOAD_COST;
            overloadUnlocked = true;
            try { localStorage.setItem(OVERLOAD_KEY, '1'); } catch(e) {}
            log('☢️ 過載已解鎖！', 3000);
            updateUI();
            sfxGold();
            return;
        }
        if (overloadCooldown > 0) {
            log('☢️ 冷卻中（' + Math.ceil(overloadCooldown) + 's）', 1500);
            return;
        }
        overloadCooldown = OVERLOAD_CD;
        overloadActive = OVERLOAD_DURATION;
        log('☢️ 聚能伽馬塔・過載啟動！', 2500);
        sfxGold();
    }

    setInterval(function() {
        if (overloadCooldown > 0) overloadCooldown = Math.max(0, overloadCooldown - 0.05);
        if (overloadActive > 0) overloadActive = Math.max(0, overloadActive - 0.05);
    }, 50);

    window.__overloadAPI = {
        isUnlocked: function() { return overloadUnlocked; },
        getCooldown: function() { return overloadCooldown; },
        getActive: function() { return overloadActive; },
        trigger: triggerOverload,
        cost: OVERLOAD_COST,
    };

    console.log('[技能] 過載載入完成');
})();
</script>

            ctx.fillStyle = '#ffd700';

            ctx.fill();
            ctx.restore();

                return;
            }
            _prevEnemyUpdate3.call(this, dt * factor);
            return;
        }
        _prevEnemyUpdate3.call(this, dt);
    };

    const _prevDrawBG2 = drawBackground;

            ctx.moveTo(cx, cy);

    setInterval(function() {

    }, 50);

        // 在頂部狀態列下方顯示當前作用中的事件

    }

        _prevTowerUpdate.call(this, dt);
    };
    const _prevSilverUpdate = SilverTower.prototype.update;
    SilverTower.prototype.update = function(dt) {
        if (isStunned(this)) {
            this.pulse += dt;
            this.fireFlash = Math.max(0, this.fireFlash - dt * 5);
            return;
        }
        _prevSilverUpdate.call(this, dt);
    };
    const _prevBeamUpdate = BeamTower.prototype.update;
    BeamTower.prototype.update = function(dt) {
        if (isStunned(this)) {
            this.pulse += dt;
            return;
        }
        _prevBeamUpdate.call(this, dt);
    };
    const _prevFireArrowUpdate = FireArrowTower.prototype.update;
    FireArrowTower.prototype.update = function(dt) {
        if (isStunned(this)) {
            this.pulse += dt;
            return;
        }
        _prevFireArrowUpdate.call(this, dt);
    };

    // 癱瘓視覺：紅色 X
    function drawStunMark(tower) {
        const x = tower.x, y = tower.y;
        ctx.save();
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 150);
        ctx.strokeStyle = 'rgba(255, 80, 80, ' + pulse + ')';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#ff3355';
        ctx.shadowBlur = 15;
        const s = 22;
        ctx.beginPath();
        ctx.moveTo(x - s, y - s);
        ctx.lineTo(x + s, y + s);
        ctx.moveTo(x + s, y - s);
        ctx.lineTo(x - s, y + s);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, 42, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
    const _prevTowerDraw = Tower.prototype.draw;
    Tower.prototype.draw = function() {
        _prevTowerDraw.call(this);
        if (isStunned(this)) drawStunMark(this);
    };
    const _prevSilverDraw = SilverTower.prototype.draw;
    SilverTower.prototype.draw = function() {
        _prevSilverDraw.call(this);
        if (isStunned(this)) drawStunMark(this);
    };

    // 3. 霧氣籠罩：臨時縮短 range
    function applyFogWrapper(proto) {
        const prev = proto.update;
        proto.update = function(dt) {
            if (ES2.fogTimer > 0 && this.range !== undefined) {
                const saved = this.range;
                this.range = saved * 0.65;
                prev.call(this, dt);
                this.range = saved;
            } else {
                prev.call(this, dt);
            }
        };
    }
    // 注意：Tower / SilverTower 已經在上面被覆蓋過了，這裡要小心不要重複包裝
    // 改成在原本的 isStunned 分支處理
    // 已在 drawBody 之外的地方處理 - 直接用全域修改

    // 4. 鋼鐵軀殼：新生成敵人加護盾
    const _prevEnemyUpdate2 = Enemy.prototype.update;
    Enemy.prototype.update = function(dt) {
        if (this._initialized !== true) {
            this._initialized = true;
            if (ES2.ironShellTimer > 0 && !this.isBoss) {
                this._ironShieldTimer = 10;
            }
        }
        if (this._ironShieldTimer > 0) {
            this._ironShieldTimer -= dt;
        }
        _prevEnemyUpdate2.call(this, dt);
    };

    // 護盾視覺
    const _prevEnemyDraw = Enemy.prototype.draw;
    Enemy.prototype.draw = function() {
        _prevEnemyDraw.call(this);
        if (this.alive && this._ironShieldTimer > 0) {
            const p = this.getPos();
            const r = this.isBoss ? 22 : 13;
            ctx.save();
            ctx.strokeStyle = 'rgba(180, 200, 220, ' + (0.5 + 0.3 * Math.sin(performance.now() / 100)) + ')';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#88aacc';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r + 5, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    };

    // 5. 通貨膨脹：包裝 getUpgradeCost
    const _prevGetUpgradeCost = getUpgradeCost;
    getUpgradeCost = function(tower) {
        const base = _prevGetUpgradeCost(tower);
        if (ES2.inflationTimer > 0) {
            return Math.floor(base * 1.5);
        }
        return base;
    };

    // 6. 連鎖反應：偵測敵人死亡，給周圍加迅捷
    let _lastAliveSet = new Set();
    setInterval(function() {
        if (ES2.chainReactionTimer <= 0) { _lastAliveSet = new Set(); return; }
        const currentAlive = new Set();
        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            if (!e.alive) continue;
            currentAlive.add(e);
            if (e._swiftTimer > 0) e._swiftTimer -= 0.05;
        }
        for (const e of _lastAliveSet) {
            if (e.alive) continue;
            const ep = e.getPos();
            for (const other of currentAlive) {
                const op = other.getPos();
                if (Math.hypot(op.x - ep.x, op.y - ep.y) <= 90) {
                    other._swiftTimer = 3;
                }
            }
        }
        _lastAliveSet = currentAlive;
    }, 50);

    // 迅捷加速
    const _prevEnemyUpdate3 = Enemy.prototype.update;
    Enemy.prototype.update = function(dt) {
        if (this._swiftTimer > 0 && this.alive) {
            const savedBase = this.baseSpeed;
            this.baseSpeed = savedBase * 1.3;
            _prevEnemyUpdate3.call(this, dt);
            this.baseSpeed = savedBase;
            return;
        }
        _prevEnemyUpdate3.call(this, dt);
    };

    // 迅捷視覺
    const _prevEnemyDraw2 = Enemy.prototype.draw;
    Enemy.prototype.draw = function() {
        _prevEnemyDraw2.call(this);
        if (this.alive && this._swiftTimer > 0) {
            const p = this.getPos();
            const r = this.isBoss ? 22 : 13;
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 220, 80, 0.7)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.lineDashOffset = -performance.now() / 40;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r + 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }
    };

    // 7. 地脈震盪：臨時加長 fireInterval
    const _prevTowerUpdate2 = Tower.prototype.update;
    Tower.prototype.update = function(dt) {
        if (isStunned(this)) return _prevTowerUpdate2.call(this, dt);
        if (ES2.quakeTimer > 0) {
            const saved = this.fireInterval;
            this.fireInterval = saved * 1.5;
            _prevTowerUpdate2.call(this, dt);
            this.fireInterval = saved;
            return;
        }
        _prevTowerUpdate2.call(this, dt);
    };
    const _prevSilverUpdate2 = SilverTower.prototype.update;
    SilverTower.prototype.update = function(dt) {
        if (isStunned(this)) return _prevSilverUpdate2.call(this, dt);
        if (ES2.quakeTimer > 0) {
            const saved = this.cooldown;
            _prevSilverUpdate2.call(this, dt);
            return;
        }
        _prevSilverUpdate2.call(this, dt);
    };

    // 8. 偷竊者：每秒扣金幣
    const _prevEnemyUpdate4 = Enemy.prototype.update;
    Enemy.prototype.update = function(dt) {
        if (this._isThief && this.alive) {
            this._thiefAccumulator = (this._thiefAccumulator || 0) + dt;
            if (this._thiefAccumulator >= 1) {
                this._thiefAccumulator -= 1;
                if (typeof money === 'number') {
                    money = Math.max(0, money - 5);
                    this._thiefStolen = (this._thiefStolen || 0) + 5;

                    if (typeof log === 'function') log('🥷 小偷偷走 5 金幣！', 1000);
                }
            }
        }
        _prevEnemyUpdate4.call(this, dt);
    };

    // 偷竊者視覺
    const _prevEnemyDraw3 = Enemy.prototype.draw;
    Enemy.prototype.draw = function() {
        _prevEnemyDraw3.call(this);
        if (this.alive && this._isThief) {
            const p = this.getPos();
            const r = this.isBoss ? 22 : 13;
            ctx.save();
            // 深紫色外框
            ctx.strokeStyle = '#a020d0';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#a020d0';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r + 5, 0, Math.PI * 2);
            ctx.stroke();
            // 帽子符號
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 14px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('🥷', p.x, p.y - r - 8);
            ctx.restore();
        }
    };

    // 偷竊者擊殺偵測
    let _thievesTracked = new Set();
    setInterval(function() {
        for (let i = 0; i < enemies.length; i++) {
            if (enemies[i]._isThief) _thievesTracked.add(enemies[i]);
        }
        for (const e of _thievesTracked) {
            if (!e.alive) {
                const reward = (e._thiefStolen || 0) * 2 + 50;
                if (typeof money === 'number') {
                    money += reward;
                    if (typeof updateUI === 'function') updateUI();
                    if (typeof log === 'function') log('🥷 小偷被擊殺！奪回 ' + reward + ' 金幣', 2500);
                    if (typeof sfxCoin === 'function') sfxCoin();
                }
                _thievesTracked.delete(e);
            }
        }
    }, 100);

    // 9. 護甲突變 + 鋼鐵軀殼：包裝 takeDamage
    const _prevTakeDamage = Enemy.prototype.takeDamage;
    Enemy.prototype.takeDamage = function(amount) {
        let dmg = amount;
        if (ES2.armorMutationTimer > 0) dmg *= 0.5;
        if (this._ironShieldTimer > 0) dmg *= 0.5;
        return _prevTakeDamage.call(this, dmg);
    };

    // 護甲突變視覺：紫黑色光環
    const _prevEnemyDraw4 = Enemy.prototype.draw;
    Enemy.prototype.draw = function() {
        _prevEnemyDraw4.call(this);
        if (this.alive && ES2.armorMutationTimer > 0) {
            const p = this.getPos();
            const r = this.isBoss ? 22 : 13;
            ctx.save();
            ctx.strokeStyle = 'rgba(180, 80, 200, ' + (0.4 + 0.3 * Math.sin(performance.now() / 150)) + ')';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#a040c0';
            ctx.shadowBlur = 12;
            // 鋸齒六邊形
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = -Math.PI / 2 + i * Math.PI / 4;
                const rr = (i % 2 === 0) ? r + 7 : r + 4;
                const px = p.x + Math.cos(a) * rr;
                const py = p.y + Math.sin(a) * rr;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }
    };

    // ============ 計時器 ============
    setInterval(function() {
        const dt = 0.05;
        if (ES2.monsterRushTimer > 0) ES2.monsterRushTimer -= dt;
        if (ES2.solarFlareTimer > 0) {
            ES2.solarFlareTimer -= dt;
            if (ES2.solarFlareTimer <= 0) ES2.stunnedTowers = [];
        }
        if (ES2.fogTimer > 0) ES2.fogTimer -= dt;
        if (ES2.ironShellTimer > 0) ES2.ironShellTimer -= dt;
        if (ES2.inflationTimer > 0) ES2.inflationTimer -= dt;
        if (ES2.chainReactionTimer > 0) ES2.chainReactionTimer -= dt;
        if (ES2.quakeTimer > 0) ES2.quakeTimer -= dt;
        if (ES2.armorMutationTimer > 0) ES2.armorMutationTimer -= dt;
    }, 50);

    console.log('[事件] 紅色危機系統載入完成');
})();
</script>

            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 100);

            ctx.strokeStyle = 'rgba(200, 100, 255, ' + (pulse * 0.7) + ')';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#cc66ff';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(x, y, 42, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    };

    // 量子視覺：全螢幕紫色粒子
    const _prevDrawBG = drawBackground;
    drawBackground = function() {
        _prevDrawBG.call(this);
        if (ES3.quantumTimer > 0) {
            const now = performance.now();
            for (let i = 0; i < 8; i++) {
                const px = (now / 15 + i * 137) % BASE_W;
                const py = (now / 25 + i * 89) % BASE_H;
                ctx.fillStyle = 'rgba(180, 100, 255, ' + (0.3 + 0.3 * Math.sin(now / 100 + i)) + ')';
                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    };

    // ============ 計時器 ============
    setInterval(function() {
        const dt = 0.05;
        if (ES3.demonTimer > 0) ES3.demonTimer -= dt;
        if (ES3.quantumTimer > 0) ES3.quantumTimer -= dt;
        if (ES3.riskInvestTimer > 0) ES3.riskInvestTimer -= dt;
        if (ES3.antiMatterTimer > 0) ES3.antiMatterTimer -= dt;
    }, 50);

})();

<script>
// ============================================================
// 反物質立場：Boss 控制免疫（獨立事件）
// ============================================================
(function() {
    'use strict';
    console.log('[事件] 反物質立場載入中...');

    // 每個 Boss 初次生成時獲得 3 層控制免疫
    const _prevEnemyUpdate = Enemy.prototype.update;
    Enemy.prototype.update = function(dt) {
        if (this.isBoss && this._controlImmune === undefined) {
            this._controlImmune = 3;
        }
        _prevEnemyUpdate.call(this, dt);
    };

    // 包裝 Bullet.update：Boss 免疫減速
    const _prevBulletUpdate = Bullet.prototype.update;
    Bullet.prototype.update = function(dt) {
        if (this.target && this.target.isBoss && this.target._controlImmune > 0 && this.slowFactor !== undefined) {
            // 檢查是否正在施加緩速（命中時才會觸發）
            const hpBefore = this.target.hp;
            _prevBulletUpdate.call(this, dt);
            if (this.target.hp !== hpBefore && this.target.slowTimer > 0) {
                // 消耗一層免疫，取消緩速
                this.target._controlImmune--;
                this.target.slowTimer = 0;
                this.target.slowFactor = 1;
                if (typeof log === 'function') log('🛡️ Boss 免疫控制（剩 ' + this.target._controlImmune + ' 層）', 1500);
            }
            return;
        }
        _prevBulletUpdate.call(this, dt);
    };

    // Boss 免疫視覺
    const _prevEnemyDraw = Enemy.prototype.draw;
    Enemy.prototype.draw = function() {
        _prevEnemyDraw.call(this);
        if (this.alive && this.isBoss && this._controlImmune > 0) {
            const p = this.getPos();
            const r = this.isBoss ? 22 : 13;
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 100, 200, ' + (0.5 + 0.3 * Math.sin(performance.now() / 200)) + ')';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#ff66cc';
            ctx.shadowBlur = 12;
            ctx.setLineDash([4, 6]);
            ctx.lineDashOffset = -performance.now() / 50;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r + 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            // 顯示免疫層數
            ctx.fillStyle = '#ff88dd';
            ctx.font = 'bold 11px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('🛡️×' + this._controlImmune, p.x, p.y - r - 14);
            ctx.restore();
        }
    };

    console.log('[事件] 反物質立場載入完成');
})();
</script>

<script>
// ============================================================
// 快捷操作系統
// ============================================================
(function() {
    'use strict';
    console.log('[快捷] 快捷操作系統載入中...');

    // ============ Toast 提示 ============
    const toastEl = document.getElementById('quickToast');
    let toastTimer = null;
    function showToast(msg, isError, ms) {
        ms = ms || 1800;
        toastEl.textContent = msg;
        toastEl.classList.toggle('error', !!isError);
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
            toastEl.classList.remove('show');
        }, ms);
    }

    // ============ 一鍵合成 ============
    function findCombinablePair() {
        for (let i = 0; i < SPOTS.length; i++) {
            const a = SPOTS[i].tower;
            if (!a) continue;
            for (let j = i + 1; j < SPOTS.length; j++) {
                const b = SPOTS[j].tower;
                if (!b) continue;
                if (typeof canCombine === 'function' && canCombine(a, b)) {
                    return [a, b];
                }
            }
        }
        return null;
    }

    function combineAll() {
        if (typeof gameState === 'undefined' || gameState !== 'playing') return 0;
        if (typeof gameOver !== 'undefined' && gameOver) return 0;

        let combined = 0;
        let safety = 0;
        while (safety++ < 100) {
            const pair = findCombinablePair();
            if (!pair) break;
            try {
                combineTowers(pair[0], pair[1]);
                combined++;
            } catch (e) {
                console.error('[快捷] 合成失敗:', e);
                break;
            }
        }
        return combined;
    }

    // ============ 一鍵升級 ============
    function upgradeAll() {
        if (typeof gameState === 'undefined' || gameState !== 'playing') return 0;
        if (typeof gameOver !== 'undefined' && gameOver) return 0;

        let upgraded = 0;
        let safety = 0;
        while (safety++ < 100) {
            // 找「最低等級且能升級」的塔
            let target = null;
            let lowestLevel = 999;
            for (let i = 0; i < SPOTS.length; i++) {
                const t = SPOTS[i].tower;
                if (!t) continue;
                if (t.type === 'silver' || t.type === 'magenta') continue;
                if (t.level >= MAX_TOWER_LEVEL) continue;

                const cost = getUpgradeCost(t);
                if (money < cost) continue;

                if (t.level < lowestLevel) {
                    lowestLevel = t.level;
                    target = t;
                }
            }
            if (!target) break;

            // 執行升級
            const cost = getUpgradeCost(target);
            money -= cost;
            target.level++;
            if (target.applyLevel) target.applyLevel();
            upgraded++;
        }

        if (upgraded > 0) {
            if (typeof sfxUpgrade === 'function') sfxUpgrade();
            updateUI();
            if (typeof updateTowerPanel === 'function') updateTowerPanel();
            if (typeof saveGame === 'function') saveGame();
        }
        return upgraded;
    }

    // ============ 自動模式 ============
    let autoMode = false;
    let autoTimer = null;
    let lastAutoCombineCount = 0;

    function autoTick() {
        if (typeof gameState === 'undefined' || gameState !== 'playing') return;
        if (typeof gameOver !== 'undefined' && gameOver) return;
        if (typeof waveActive !== 'undefined' && !waveActive) return; // 只在波次進行中執行

        // 自動合成
        const combined = combineAll();
        if (combined > 0) {
            showToast('🤖 自動合成 ×' + combined);
        }

        // 自動升級（只在金幣 > 200 時才觸發，避免前期把錢花光）
        if (money > 200) {
            const upgraded = upgradeAll();
            if (upgraded > 0) {
                showToast('🤖 自動升級 ×' + upgraded);
            }
        }
    }

    function startAuto() {
        if (autoTimer) return;
        autoMode = true;
        autoTimer = setInterval(autoTick, 1500);
        console.log('[快捷] 自動模式啟動');
    }

    function stopAuto() {
        if (!autoTimer) return;
        autoMode = false;
        clearInterval(autoTimer);
        autoTimer = null;
        console.log('[快捷] 自動模式停止');
    }

    // ============ 按鈕綁定 ============
    const btnCombine = document.getElementById('btnCombineAll');
    const btnUpgrade = document.getElementById('btnUpgradeAll');
    const btnAuto = document.getElementById('btnAutoMode');

    btnCombine.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (typeof initAudio === 'function') initAudio();

        const combined = combineAll();
        if (combined === 0) {
            showToast('沒有可合成的塔', true);
        } else {
            showToast('🎯 合成 ×' + combined);
            if (typeof sfxCombine === 'function') sfxCombine();
        }
    }, { passive: false });

    btnUpgrade.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (typeof initAudio === 'function') initAudio();

        const upgraded = upgradeAll();
        if (upgraded === 0) {
            showToast('沒有可升級的塔', true);
        } else {
            showToast('⬆️ 升級 ×' + upgraded);
        }
    }, { passive: false });

    btnAuto.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (typeof initAudio === 'function') initAudio();

        if (autoMode) {
            stopAuto();
            btnAuto.classList.remove('active');
            showToast('🤖 自動模式：關閉');
        } else {
            startAuto();
            btnAuto.classList.add('active');
            showToast('🤖 自動模式：啟動');
        }
    }, { passive: false });

    // ============ 遊戲結束/回主選單時停止自動 ============
    const _prevBackToMenu = window.backToMenu;
    if (typeof _prevBackToMenu === 'function') {
        // backToMenu 是 function declaration，可能不能直接包
    }

    // 用 setInterval 監控遊戲狀態
    setInterval(function() {
        if (typeof gameState === 'undefined') return;
        if (gameState !== 'playing' && autoMode) {
            stopAuto();
            btnAuto.classList.remove('active');
        }
    }, 500);

    console.log('[快捷] 快捷操作系統載入完成');
})();
</script>
