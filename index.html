<script>
// ============================================================
// 綠塔進化系統（新增區塊，不改動任何原程式碼）
// ============================================================
(function() {
    'use strict';

    console.log('[進化] 綠塔進化系統載入中...');

    // ============ 狀態追蹤（用 WeakMap，不汙染原物件） ============
    const _evo = new WeakMap();

    function getEvo(tower) {
        if (!tower) return null;
        if (!_evo.has(tower)) {
            _evo.set(tower, {
                evolution: null,       // null | 'A' | 'B'
                attackCount: 0,        // 墨綠塔 4 次攻擊計數
                siriusBuffed: false,   // 天狼光環 buff
                baseConfig: tower.config,
                baseType: tower.type,
            });
        }
        return _evo.get(tower);
    }

    // ============ 灼燒（耀粼燃燒）狀態系統 ============
    const BURN_MAX_STACKS = 5;
    const BURN_DURATION = 3.0;

    function applyBurn(enemy, sourceDamage) {
        if (!enemy || !enemy.alive) return;
        if (!enemy._burn) enemy._burn = { stacks: 0, timer: 0, srcDmg: 0 };
        enemy._burn.stacks = Math.min(BURN_MAX_STACKS, enemy._burn.stacks + 1);
        enemy._burn.timer = BURN_DURATION;
        enemy._burn.srcDmg = Math.max(enemy._burn.srcDmg, sourceDamage);
    }

    function tickBurn(enemy, dt) {
        const b = enemy._burn;
        if (!b || b.stacks <= 0) return;
        b.timer -= dt;
        if (b.timer <= 0) { b.stacks = 0; return; }
        const dps = (enemy.maxHp * 0.01 + b.srcDmg * 0.15) * b.stacks;
        const actual = enemy.takeDamage(dps * dt);
        if (actual > 0) addDamage('green', actual);
    }

    // ============ 包裝 Enemy.update 處理灼燒 ============
    const _origEnemyUpdate = Enemy.prototype.update;
    Enemy.prototype.update = function(dt) {
        if (this.alive && this._burn && this._burn.stacks > 0) {
            tickBurn(this, dt);
        }
        _origEnemyUpdate.call(this, dt);
    };

    // ============ 包裝 Enemy.draw 顯示灼燒火焰 ============
    const _origEnemyDraw = Enemy.prototype.draw;
    Enemy.prototype.draw = function() {
        _origEnemyDraw.call(this);
        if (this.alive && this._burn && this._burn.stacks > 0) {
            const p = this.getPos();
            const r = this.isBoss ? 22 : 13;
            const intensity = Math.min(1, this._burn.stacks / BURN_MAX_STACKS);
            ctx.save();
            ctx.strokeStyle = 'rgba(255, ' + Math.floor(180 - intensity * 80) + ', 60, ' + (0.5 + intensity * 0.5) + ')';
            ctx.lineWidth = 2 + intensity * 2;
            ctx.shadowColor = '#ff6600';
            ctx.shadowBlur = 10 * intensity;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r + 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            // 火焰粒子
            for (let i = 0; i < this._burn.stacks; i++) {
                const t = performance.now() / 200 + i * 0.7;
                const fx = p.x + Math.sin(t) * 6;
                const fy = p.y - r - 4 - ((performance.now() / 100 + i * 30) % 15);
                ctx.fillStyle = 'rgba(255, ' + Math.floor(150 + Math.sin(t) * 50) + ', 50, 0.8)';
                ctx.beginPath();
                ctx.arc(fx, fy, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    };

    // ============ 貫穿子彈（墨綠塔專用） ============
    function PierceBullet(tower, target) {
        Bullet.call(this, tower, target);
        this.pierce = true;
        this.color = '#5fe08a';
        this.speed = 700;
    }
    PierceBullet.prototype = Object.create(Bullet.prototype);
    PierceBullet.prototype.constructor = PierceBullet;
    PierceBullet.prototype.update = function(dt) {
        if (!this.alive) return;
        if (!this.target.alive) { this.alive = false; return; }
        const tp = this.target.getPos();
        const dx = tp.x - this.x, dy = tp.y - this.y;
        const dist = Math.hypot(dx, dy), move = this.speed * dt;
        if (dist <= move) {
            let dmg = this.damage;
            if (this.critRate > 0 && Math.random() < this.critRate) dmg *= this.critDamage;
            // 主目標
            const actual = this.target.takeDamage(dmg);
            addDamage('green', actual);
            // 附近敵人吃半傷
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (!e.alive || e === this.target) continue;
                const ep = e.getPos();
                if (Math.hypot(ep.x - tp.x, ep.y - tp.y) <= 70) {
                    addDamage('green', e.takeDamage(dmg * 0.5));
                }
            }
            sfxHit();
            this.alive = false;
        } else {
            this.x += (dx / dist) * move;
            this.y += (dy / dist) * move;
        }
    };
    PierceBullet.prototype.draw = function() {
        if (!this.alive) return;
        ctx.save();
        ctx.shadowColor = '#5fe08a';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#b0ffd0';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    };

    // ============ 包裝 Tower.prototype.fire 加入綠塔進化行為 ============
    const _origTowerFire = Tower.prototype.fire;
    Tower.prototype.fire = function(target) {
        const state = getEvo(this);

        // 墨綠塔：第 4 次攻擊發射貫穿彈
        if (state.evolution === 'A') {
            this.fireFlash = 1;
            state.attackCount++;
            if (state.attackCount >= 4) {
                state.attackCount = 0;
                bullets.push(new PierceBullet(this, target));
                log('🌿 墨綠貫穿！', 700);
            } else {
                bullets.push(new Bullet(this, target));
            }
            sfxShoot();
            return;
        }

        // 其他塔：走原路徑
        const lenBefore = bullets.length;
        _origTowerFire.call(this, target);

        // 天狼 buff：這發子彈 20% 機率附帶灼燒
        if (state.siriusBuffed && bullets.length > lenBefore) {
            const b = bullets[bullets.length - 1];
            if (b && b.target === target && Math.random() < 0.20) {
                b._burnOnHit = true;
                b._srcDmg = this.damage;
            }
        }
    };

    // ============ 包裝 Bullet.update 處理灼燒附魔 ============
    const _origBulletUpdate = Bullet.prototype.update;
    Bullet.prototype.update = function(dt) {
        const willBurn = this._burnOnHit && this.alive && this.target && this.target.alive;
        let hpBefore = willBurn ? this.target.hp : 0;

        _origBulletUpdate.call(this, dt);

        if (willBurn && this.target) {
            const damaged = this.target.hp < hpBefore;
            if (damaged) {
                applyBurn(this.target, this._srcDmg || 15);
            }
        }
    };

    // ============ 包裝 Tower.drawBody 給進化塔獨特外觀 ============
    const _origDrawBody = Tower.prototype.drawBody;
    Tower.prototype.drawBody = function(x, y, alpha) {
        const st = getEvo(this);
        if (!st.evolution) {
            _origDrawBody.call(this, x, y, alpha);
            return;
        }
        ctx.save();
        ctx.globalAlpha = alpha;
        const color = st.evolution === 'A' ? '#1b4d3e' : '#00fa9a';
        drawTowerBase(x, y, color, st.evolution === 'B');
        ctx.restore();
        drawEvolvedIcon(st.evolution, x, y, 70);
    };

    function drawEvolvedIcon(branch, x, y, size) {
        ctx.save();
        const s = size;
        if (branch === 'A') {
            // 墨綠塔：深綠水晶 + 十字葉紋
            const h = s * 0.42, w = s * 0.22;
            ctx.shadowColor = '#2ecc71';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + w, y - h * 0.3);
            ctx.lineTo(x + w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w, y - h * 0.3);
            ctx.closePath();
            const g = ctx.createLinearGradient(x, y - h, x, y + h);
            g.addColorStop(0, '#5fe08a');
            g.addColorStop(0.5, '#1b4d3e');
            g.addColorStop(1, '#0a2018');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#a8ffd0';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // 葉紋
            ctx.strokeStyle = '#a8ffd0';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x, y - h * 0.7);
            ctx.lineTo(x, y + h * 0.6);
            ctx.moveTo(x - w * 0.5, y - h * 0.1);
            ctx.lineTo(x + w * 0.5, y - h * 0.1);
            ctx.stroke();
        } else {
            // 天狼之塔：亮綠水晶 + 火焰光環
            const h = s * 0.4, w = s * 0.2;
            ctx.shadowColor = '#00fa9a';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + w, y - h * 0.3);
            ctx.lineTo(x + w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w, y - h * 0.3);
            ctx.closePath();
            const g = ctx.createLinearGradient(x, y - h, x, y + h);
            g.addColorStop(0, '#c8ffd8');
            g.addColorStop(0.4, '#00fa9a');
            g.addColorStop(1, '#0a5030');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#e0ffe8';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // 光環（脈動）
            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
            ctx.strokeStyle = 'rgba(255, 180, 60, ' + (0.5 + pulse * 0.5) + ')';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 12 * pulse;
            ctx.beginPath();
            ctx.arc(x, y, s * 0.42, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();
    }

    // ============ 天狼光環更新（範圍內友方塔 buff） ============
    function updateSiriusAuras() {
        for (let i = 0; i < SPOTS.length; i++) {
            if (SPOTS[i].tower) getEvo(SPOTS[i].tower).siriusBuffed = false;
        }
        for (let i = 0; i < SPOTS.length; i++) {
            const t = SPOTS[i].tower;
            if (!t) continue;
            const st = getEvo(t);
            if (st.evolution !== 'B') continue;
            for (let j = 0; j < SPOTS.length; j++) {
                const o = SPOTS[j].tower;
                if (!o || o === t) continue;
                const d = Math.hypot(SPOTS[j].x - SPOTS[i].x, SPOTS[j].y - SPOTS[i].y);
                if (d <= t.range) getEvo(o).siriusBuffed = true;
            }
        }
    }
    setInterval(updateSiriusAuras, 60);

    // ============ 天狼光環視覺化（畫一個淡淡的圓） ============
    const _origTowerDraw = Tower.prototype.draw;
    Tower.prototype.draw = function() {
        const st = getEvo(this);
        // 天狼塔：先畫光環範圍
        if (st.evolution === 'B') {
            const x = this.x, y = this.y;
            ctx.save();
            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 500);
            const grad = ctx.createRadialGradient(x, y, 0, x, y, this.range);
            grad.addColorStop(0, 'rgba(0, 250, 154, ' + (0.12 + pulse * 0.06) + ')');
            grad.addColorStop(1, 'rgba(0, 250, 154, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, this.range, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0, 250, 154, ' + (0.3 + pulse * 0.2) + ')';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([8, 8]);
            ctx.lineDashOffset = -performance.now() / 60;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }
        _origTowerDraw.call(this);
    };

    // ============ 進化判定 ============
    function canEvolve(tower) {
        if (!tower) return false;
        const st = getEvo(tower);
        if (st.evolution) return false;
        if (st.baseType !== 'green') return false;
        if (tower.level < 3) return false;
        return true;
    }

    // ============ 執行進化 ============
    function doEvolve(branch) {
        const tower = selectedTower;
        if (!tower || !canEvolve(tower)) return;
        const st = getEvo(tower);
        st.evolution = branch;
        st.attackCount = 0;

        if (branch === 'A') {
            tower.damage *= 2.5;
            tower.baseFireInterval /= 1.5;
            tower.fireInterval = tower.baseFireInterval;
            tower.range *= 1.3;
            tower.config = Object.assign({}, st.baseConfig, { name: '墨綠塔', color: '#1b4d3e' });
            log('🌿 綠塔進化為【墨綠塔】！', 3000);
        } else {
            tower.damage *= 1.25;
            tower.baseFireInterval /= 1.25;
            tower.fireInterval = tower.baseFireInterval;
            tower.config = Object.assign({}, st.baseConfig, { name: '天狼之塔', color: '#00fa9a' });
            log('🌟 綠塔進化為【天狼之塔】！', 3000);
        }

        sfxUpgrade();
        updateUI();
        updateTowerPanel();
        saveGame();

        const box = document.getElementById('branch-options');
        if (box) box.style.display = 'none';
    }

    // 覆寫原本的 evolveSelectedTower
    window.evolveSelectedTower = function(branch) {
        doEvolve(branch);
    };

    // ============ 進化 UI 顯示 ============
    function updateEvolveUI() {
        const box = document.getElementById('branch-options');
        if (!box) return;
        const tower = selectedTower;
        if (!tower || !canEvolve(tower)) {
            box.style.display = 'none';
            return;
        }
        box.style.display = 'flex';
        const titleA = document.getElementById('branch-a-title');
        const descA = document.getElementById('branch-a-desc');
        const titleB = document.getElementById('branch-b-title');
        const descB = document.getElementById('branch-b-desc');
        if (titleA) titleA.innerText = '🌿 分支 A：墨綠塔';
        if (descA) descA.innerText = '攻擊 +150%、攻速 +50%、射程 +30%\n第 4 次攻擊發射貫穿彈（命中最多 3 名敵人）';
        if (titleB) titleB.innerText = '🌟 分支 B：天狼之塔';
        if (descB) descB.innerText = '攻擊 +25%、攻速 +25%\n耀粼光環：範圍內友方塔攻擊時 20% 機率附加【耀粼燃燒】（1% 最大生命 + 15% 攻擊，可疊 5 層）';
    }
    setInterval(updateEvolveUI, 100);

    // ============ 存檔整合（包裝 saveGame 加入 evolution 欄位） ============
    const _origSaveGame = saveGame;
    saveGame = function() {
        if (!currentDifficulty || gameState !== 'playing') return;
        try {
            const towerData = [];
            for (let i = 0; i < SPOTS.length; i++) {
                const s = SPOTS[i];
                if (s.tower) {
                    const st = getEvo(s.tower);
                    towerData.push({
                        idx: i,
                        type: st.baseType,
                        level: s.tower.level,
                        evolution: st.evolution,
                    });
                }
            }
            const data = {
                version: 1,
                difficulty: currentDifficulty,
                money: money,
                lives: lives,
                wave: wave,
                damageStats: damageStats,
                unlocked: Object.assign({}, unlocked),
                towers: towerData,
                timestamp: Date.now(),
            };
            localStorage.setItem(getSaveKey(), JSON.stringify(data));
        } catch (e) {}
    };

    // ============ 載入整合（包裝 loadGame 還原進化） ============
    const _origLoadGame = loadGame;
    loadGame = function() {
        if (!currentDifficulty) return false;
        try {
            const raw = localStorage.getItem(getSaveKey());
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (!data || data.version !== 1 || data.difficulty !== currentDifficulty || data.wave === 0) return false;
            money = data.money || DIFFICULTIES[currentDifficulty].startMoney;
            lives = data.lives || DIFFICULTIES[currentDifficulty].startLives;
            wave = data.wave || 0;
            damageStats = data.damageStats || {};
            if (data.unlocked) {
                for (const k in data.unlocked) {
                    if (unlocked.hasOwnProperty(k)) unlocked[k] = data.unlocked[k];
                }
            }
            for (let i = 0; i < SPOTS.length; i++) SPOTS[i].tower = null;
            const towers = data.towers || [];
            for (let i = 0; i < towers.length; i++) {
                const t = towers[i];
                const spot = SPOTS[t.idx];
                if (!spot) continue;
                const tower = createTower(spot, t.type);
                if (!tower) continue;
                tower.level = Math.min(t.level || 1, MAX_TOWER_LEVEL);
                if (tower.applyLevel) tower.applyLevel();
                spot.tower = tower;
                // 還原進化
                if (t.evolution) {
                    const st = getEvo(tower);
                    st.evolution = t.evolution;
                    if (t.evolution === 'A') {
                        tower.damage *= 2.5;
                        tower.baseFireInterval /= 1.5;
                        tower.fireInterval = tower.baseFireInterval;
                        tower.range *= 1.3;
                        tower.config = Object.assign({}, st.baseConfig, { name: '墨綠塔', color: '#1b4d3e' });
                    } else {
                        tower.damage *= 1.25;
                        tower.baseFireInterval /= 1.25;
                        tower.fireInterval = tower.baseFireInterval;
                        tower.config = Object.assign({}, st.baseConfig, { name: '天狼之塔', color: '#00fa9a' });
                    }
                }
            }
            for (const type in unlocked) {
                const btn = document.querySelector('.shop-btn[data-type="' + type + '"]');
                if (!btn) continue;
                if (unlocked[type]) btn.classList.remove('locked');
                else btn.classList.add('locked');
            }
            updateUI();
            return true;
        } catch (e) { return false; }
    };

    console.log('[進化] 綠塔進化系統載入完成');
})();
</script>

<script>
// ============================================================
// 紫塔進化系統（新增區塊）
// ============================================================
(function() {
    'use strict';

    console.log('[進化] 紫塔進化系統載入中...');

    const _evo = new WeakMap();
    function getEvo(tower) {
        if (!tower) return null;
        if (!_evo.has(tower)) {
            _evo.set(tower, {
                evolution: null,
                singularityTimer: 1.5,
                singularity: null,
                baseType: tower.type,
                baseConfig: tower.config,
            });
        }
        return _evo.get(tower);
    }

    // ============ 寒霜 / 凍結 狀態 ============
    const FROST_MAX = 5;
    const FROST_DURATION = 4.0;
    const FREEZE_DURATION = 1.8;

    function applyFrost(enemy) {
        if (!enemy || !enemy.alive) return;
        if (!enemy._frost) enemy._frost = { stacks: 0, timer: 0, freezeTimer: 0 };
        // 凍結中只延長 0.05 秒
        if (enemy._frost.freezeTimer > 0) {
            enemy._frost.freezeTimer += 0.05;
            return;
        }
        enemy._frost.stacks = Math.min(FROST_MAX, enemy._frost.stacks + 1);
        enemy._frost.timer = FROST_DURATION;
        if (enemy._frost.stacks >= FROST_MAX) {
            const dur = enemy.isBoss ? FREEZE_DURATION * 0.5 : FREEZE_DURATION;
            enemy._frost.freezeTimer = dur;
            enemy._frost.stacks = 0;
        }
    }

    // 包裝 Enemy.update：處理凍結與寒霜消退
    const _prevEnemyUpdate = Enemy.prototype.update;
    Enemy.prototype.update = function(dt) {
        if (this.alive && this._frost) {
            const f = this._frost;
            if (f.freezeTimer > 0) {
                f.freezeTimer -= dt;
                this.elapsed += dt; // 讓 Boss 暴走繼續算
                return; // 凍結中不移動
            }
            if (f.timer > 0) {
                f.timer -= dt;
                if (f.timer <= 0) f.stacks = 0;
            }
        }
        _prevEnemyUpdate.call(this, dt);
    };

    // 包裝 Enemy.draw：顯示寒霜 / 凍結視覺
    const _prevEnemyDraw = Enemy.prototype.draw;
    Enemy.prototype.draw = function() {
        _prevEnemyDraw.call(this);
        if (!this.alive) return;
        const f = this._frost;
        if (!f || (f.stacks <= 0 && f.freezeTimer <= 0)) return;
        const p = this.getPos();
        const r = this.isBoss ? 22 : 13;
        ctx.save();
        if (f.freezeTimer > 0) {
            // 凍結：冰晶包覆
            ctx.fillStyle = 'rgba(150, 240, 255, 0.45)';
            ctx.strokeStyle = 'rgba(220, 255, 255, 0.95)';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = -Math.PI / 2 + i * Math.PI / 3 + performance.now() / 3000;
                const px = p.x + Math.cos(a) * (r + 6);
                const py = p.y + Math.sin(a) * (r + 6);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        } else {
            // 寒霜：藍色光環（隨層數變亮）
            const intensity = f.stacks / FROST_MAX;
            ctx.strokeStyle = 'rgba(150, 220, 255, ' + (0.4 + intensity * 0.5) + ')';
            ctx.lineWidth = 1.5 + intensity * 1.5;
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 8 * intensity;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r + 3, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();
    };

    // 包裝 Bullet.update：霜凍塔的子彈命中時附加寒霜
    const _prevBulletUpdate = Bullet.prototype.update;
    Bullet.prototype.update = function(dt) {
        const isFrost = this._purpleFrost;
        const target = this.target;
        const hpBefore = (isFrost && target && target.alive) ? target.hp : -1;
        _prevBulletUpdate.call(this, dt);
        if (isFrost && target && target.alive && target.hp < hpBefore) {
            applyFrost(target);
        }
    };

    // 包裝 Tower.fire：霜凍塔的子彈加上標記
    const _prevTowerFire = Tower.prototype.fire;
    Tower.prototype.fire = function(target) {
        const st = getEvo(this);
        if (st.evolution === 'B') {
            const lenBefore = bullets.length;
            _prevTowerFire.call(this, target);
            for (let i = lenBefore; i < bullets.length; i++) {
                bullets[i]._purpleFrost = true;
            }
        } else {
            _prevTowerFire.call(this, target);
        }
    };

    // ============ 質量塔：引力奇點 ============
    function findClosestPathDistance(px, py) {
        let best = { distance: 0, dist: Infinity };
        for (let d = 0; d <= PATH_TOTAL; d += 10) {
            const p = getPosOnPath(d);
            const dist = Math.hypot(p.x - px, p.y - py);
            if (dist < best.dist) best = { distance: d, dist: dist };
        }
        return best;
    }

    const _prevTowerUpdate = Tower.prototype.update;
    Tower.prototype.update = function(dt) {
        const st = getEvo(this);
        if (st.evolution === 'A' && st.baseType === 'purple') {
            // 質量塔：不攻擊，只做引力場
            st.singularityTimer -= dt;
            if (st.singularityTimer <= 0) {
                st.singularityTimer = 3.0;
                const inRange = [];
                for (let i = 0; i < enemies.length; i++) {
                    const e = enemies[i];
                    if (!e.alive) continue;
                    const p = e.getPos();
                    const d = Math.hypot(p.x - this.x, p.y - this.y);
                    if (d <= this.range) inRange.push(e);
                }
                if (inRange.length > 0) {
                    const target = inRange[Math.floor(Math.random() * inRange.length)];
                    const tp = target.getPos();
                    const closest = findClosestPathDistance(tp.x, tp.y);
                    st.singularity = {
                        x: tp.x, y: tp.y,
                        pathDistance: closest.distance,
                        timer: 1.5,
                        maxLife: 1.5,
                    };
                }
            }
            if (st.singularity) {
                st.singularity.timer -= dt;
                if (st.singularity.timer <= 0) {
                    st.singularity = null;
                } else {
                    const sing = st.singularity;
                    const power = 100;
                    for (let i = 0; i < enemies.length; i++) {
                        const e = enemies[i];
                        if (!e.alive) continue;
                        const p = e.getPos();
                        const dToSing = Math.hypot(p.x - sing.x, p.y - sing.y);
                        if (dToSing > 90) continue;
                        const dd = sing.pathDistance - e.distance;
                        if (Math.abs(dd) < 3) continue;
                        let spd = power * (1 - dToSing / 90);
                        if (e.isBoss) spd *= 0.5;
                        e.distance += Math.sign(dd) * spd * dt;
                        if (e.distance < 0) e.distance = 0;
                        if (e.distance > PATH_TOTAL) e.distance = PATH_TOTAL;
                    }
                }
            }
            return; // 質量塔不攻擊
        }
        _prevTowerUpdate.call(this, dt);
    };

    // ============ 進化外觀 ============
    function drawPurpleEvolvedIcon(branch, x, y, size) {
        ctx.save();
        const s = size;
        if (branch === 'A') {
            // 質量塔：深紫色 + 引力渦旋
            const h = s * 0.4, w = s * 0.24;
            ctx.shadowColor = '#4b0082';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + w, y - h * 0.3);
            ctx.lineTo(x + w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w, y - h * 0.3);
            ctx.closePath();
            const g = ctx.createRadialGradient(x, y, 0, x, y, h);
            g.addColorStop(0, '#000000');
            g.addColorStop(0.5, '#4b0082');
            g.addColorStop(1, '#1a0030');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#c8a0ff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // 渦旋
            ctx.strokeStyle = 'rgba(200, 150, 255, 0.7)';
            ctx.lineWidth = 1.5;
            const spin = performance.now() / 500;
            for (let i = 0; i < 3; i++) {
                const startA = spin + i * Math.PI * 2 / 3;
                ctx.beginPath();
                for (let t = 0; t < 1; t += 0.1) {
                    const rr = s * 0.05 + t * s * 0.18;
                    const a = startA + t * 3;
                    const px = x + Math.cos(a) * rr;
                    const py = y + Math.sin(a) * rr;
                    if (t === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
        } else {
            // 霜凍塔：冰晶
            const h = s * 0.44, w = s * 0.18;
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + w, y - h * 0.3);
            ctx.lineTo(x + w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w, y - h * 0.3);
            ctx.closePath();
            const g = ctx.createLinearGradient(x, y - h, x, y + h);
            g.addColorStop(0, '#ffffff');
            g.addColorStop(0.4, '#a0f0ff');
            g.addColorStop(1, '#0066aa');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // 側邊冰刺
            for (let i = 0; i < 3; i++) {
                const yy = y - s * 0.15 + i * s * 0.12;
                ctx.beginPath();
                ctx.moveTo(x - w * 0.7, yy);
                ctx.lineTo(x - w - s * 0.05, yy + s * 0.02);
                ctx.lineTo(x - w * 0.7, yy + s * 0.04);
                ctx.closePath();
                ctx.fillStyle = 'rgba(200, 255, 255, 0.9)';
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + w * 0.7, yy);
                ctx.lineTo(x + w + s * 0.05, yy + s * 0.02);
                ctx.lineTo(x + w * 0.7, yy + s * 0.04);
                ctx.closePath();
                ctx.fill();
            }
        }
        ctx.restore();
    }

    const _prevDrawBody = Tower.prototype.drawBody;
    Tower.prototype.drawBody = function(x, y, alpha) {
        const st = getEvo(this);
        if (st.evolution && st.baseType === 'purple') {
            ctx.save();
            ctx.globalAlpha = alpha;
            const color = st.evolution === 'A' ? '#4b0082' : '#00ffff';
            drawTowerBase(x, y, color, st.evolution === 'B');
            ctx.restore();
            drawPurpleEvolvedIcon(st.evolution, x, y, 70);
            return;
        }
        _prevDrawBody.call(this, x, y, alpha);
    };

    // 包裝 Tower.draw：畫引力奇點
    const _prevTowerDraw = Tower.prototype.draw;
    Tower.prototype.draw = function() {
        const st = getEvo(this);
        if (st.evolution === 'A' && st.baseType === 'purple' && st.singularity) {
            const sing = st.singularity;
            const life = sing.timer / sing.maxLife;
            const scale = Math.sin((1 - life) * Math.PI * 0.5 + 0.2);
            const r = 50 * Math.max(0.3, scale);
            ctx.save();
            const grad = ctx.createRadialGradient(sing.x, sing.y, 0, sing.x, sing.y, r);
            grad.addColorStop(0, 'rgba(20, 0, 40, 0.95)');
            grad.addColorStop(0.3, 'rgba(80, 0, 140, 0.75)');
            grad.addColorStop(0.7, 'rgba(130, 40, 200, 0.35)');
            grad.addColorStop(1, 'rgba(130, 40, 200, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(sing.x, sing.y, r, 0, Math.PI * 2);
            ctx.fill();
            // 中心黑點
            ctx.fillStyle = 'rgba(0, 0, 0, 0.98)';
            ctx.beginPath();
            ctx.arc(sing.x, sing.y, r * 0.28, 0, Math.PI * 2);
            ctx.fill();
            // 引力線條
            ctx.strokeStyle = 'rgba(200, 150, 255, 0.7)';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#a060ff';
            ctx.shadowBlur = 10;
            ctx.translate(sing.x, sing.y);
            ctx.rotate(performance.now() / 200);
            for (let i = 0; i < 8; i++) {
                const a = i * Math.PI / 4;
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * r * 0.35, Math.sin(a) * r * 0.35);
                ctx.lineTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95);
                ctx.stroke();
            }
            ctx.restore();
        }
        _prevTowerDraw.call(this);
    };

    // ============ 進化判定 ============
    function canEvolve(tower) {
        if (!tower) return false;
        const st = getEvo(tower);
        if (st.evolution) return false;
        if (st.baseType !== 'purple') return false;
        if (tower.level < 3) return false;
        return true;
    }

    // ============ 執行進化 ============
    function doPurpleEvolve(branch) {
        const tower = selectedTower;
        if (!tower || !canEvolve(tower)) return;
        const st = getEvo(tower);
        st.evolution = branch;
        if (branch === 'A') {
            tower.config = Object.assign({}, st.baseConfig, { name: '質量塔', color: '#4b0082' });
            log('⚫ 紫塔進化為【質量塔】！', 3000);
        } else {
            tower.damage *= 1.2;
            tower.baseFireInterval /= 1.2;
            tower.fireInterval = tower.baseFireInterval;
            tower.config = Object.assign({}, st.baseConfig, { name: '霜凍塔', color: '#00ffff' });
            log('❄️ 紫塔進化為【霜凍塔】！', 3000);
        }
        sfxUpgrade();
        updateUI();
        updateTowerPanel();
        saveGame();
        const box = document.getElementById('branch-options');
        if (box) box.style.display = 'none';
    }

    // ============ 接管全域 evolveSelectedTower ============
    const _greenEvolveFn = window.evolveSelectedTower;
    window.evolveSelectedTower = function(branch) {
        if (!selectedTower) return;
        const st = getEvo(selectedTower);
        if (st.baseType === 'purple') {
            doPurpleEvolve(branch);
        } else if (typeof _greenEvolveFn === 'function') {
            _greenEvolveFn(branch);
        }
    };

    // ============ 進化 UI ============
    function updateEvolveUI() {
        const box = document.getElementById('branch-options');
        if (!box) return;
        const tower = selectedTower;
        if (!tower) { box.style.display = 'none'; return; }
        const st = getEvo(tower);
        if (st.baseType === 'purple') {
            if (st.evolution || tower.level < 3) {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'flex';
            const titleA = document.getElementById('branch-a-title');
            const descA = document.getElementById('branch-a-desc');
            const titleB = document.getElementById('branch-b-title');
            const descB = document.getElementById('branch-b-desc');
            if (titleA) titleA.innerText = '⚫ 分支 A：質量塔';
            if (descA) descA.innerText = '引力奇點：每 3 秒產生奇點\n將附近敵人往中心拉扯（無傷害，純控場）';
            if (titleB) titleB.innerText = '❄️ 分支 B：霜凍塔';
            if (descB) descB.innerText = '寒霜硬控：命中疊加【寒霜】\n滿 5 層凍結敵人 1.8 秒（Boss 減半）';
        }
    }
    setInterval(updateEvolveUI, 30);

    // ============ 存檔整合（取代綠塔版本） ============
    function getEvolutionFromConfig(tower) {
        const n = tower.config && tower.config.name;
        if (n === '墨綠塔') return { base: 'green', branch: 'A' };
        if (n === '天狼之塔') return { base: 'green', branch: 'B' };
        if (n === '質量塔') return { base: 'purple', branch: 'A' };
        if (n === '霜凍塔') return { base: 'purple', branch: 'B' };
        return null;
    }

    saveGame = function() {
        if (!currentDifficulty || gameState !== 'playing') return;
        try {
            const towerData = [];
            for (let i = 0; i < SPOTS.length; i++) {
                const s = SPOTS[i];
                if (s.tower) {
                    const evo = getEvolutionFromConfig(s.tower);
                    towerData.push({
                        idx: i,
                        type: evo ? evo.base : s.tower.type,
                        level: s.tower.level,
                        evolution: evo ? evo.branch : null,
                    });
                }
            }
            const data = {
                version: 1,
                difficulty: currentDifficulty,
                money: money,
                lives: lives,
                wave: wave,
                damageStats: damageStats,
                unlocked: Object.assign({}, unlocked),
                towers: towerData,
                timestamp: Date.now(),
            };
            localStorage.setItem(getSaveKey(), JSON.stringify(data));
        } catch (e) {}
    };

    loadGame = function() {
        if (!currentDifficulty) return false;
        try {
            const raw = localStorage.getItem(getSaveKey());
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (!data || data.version !== 1 || data.difficulty !== currentDifficulty || data.wave === 0) return false;
            money = data.money || DIFFICULTIES[currentDifficulty].startMoney;
            lives = data.lives || DIFFICULTIES[currentDifficulty].startLives;
            wave = data.wave || 0;
            damageStats = data.damageStats || {};
            if (data.unlocked) {
                for (const k in data.unlocked) {
                    if (unlocked.hasOwnProperty(k)) unlocked[k] = data.unlocked[k];
                }
            }
            for (let i = 0; i < SPOTS.length; i++) SPOTS[i].tower = null;
            const towers = data.towers || [];
            for (let i = 0; i < towers.length; i++) {
                const t = towers[i];
                const spot = SPOTS[t.idx];
                if (!spot) continue;
                const tower = createTower(spot, t.type);
                if (!tower) continue;
                tower.level = Math.min(t.level || 1, MAX_TOWER_LEVEL);
                if (tower.applyLevel) tower.applyLevel();
                spot.tower = tower;
                if (t.evolution) {
                    const oldSel = selectedTower;
                    selectedTower = tower;
                    try { window.evolveSelectedTower(t.evolution); } catch (e) {}
                    selectedTower = oldSel;
                }
            }
            for (const type in unlocked) {
                const btn = document.querySelector('.shop-btn[data-type="' + type + '"]');
                if (!btn) continue;
                if (unlocked[type]) btn.classList.remove('locked');
                else btn.classList.add('locked');
            }
            updateUI();
            return true;
        } catch (e) { return false; }
    };

    console.log('[進化] 紫塔進化系統載入完成');
})();
</script>

<script>
// ============================================================
// 橙塔進化系統
// ============================================================
(function() {
    'use strict';
    console.log('[進化] 橙塔進化系統載入中...');

    const _evo = new WeakMap();
    function getEvo(t) {
        if (!t) return null;
        if (!_evo.has(t)) {
            _evo.set(t, {
                evolution: null,
                baseType: t.type,
                baseConfig: t.config,
                focusTarget: null,
                focusTime: 0,
            });
        }
        return _evo.get(t);
    }

    // ============ 包裝 BeamTower.update ============
    const _prevUpdate = BeamTower.prototype.update;
    BeamTower.prototype.update = function(dt) {
        const st = getEvo(this);
        if (!st.evolution || st.baseType !== 'orange') {
            return _prevUpdate.call(this, dt);
        }

        this.pulse += dt;
        if (this.hastedTimer > 0) this.hastedTimer -= dt;
        const dm = this.hastedTimer > 0 ? 3 : 1;

        // ============ 分支 A：聚能伽馬塔 ============
        if (st.evolution === 'A') {
            // 找範圍內血量最高的敵人
            let best = null, bestHp = -1;
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (!e.alive) continue;
                if (e.hp > bestHp) { bestHp = e.hp; best = e; }
            }

            if (!best) {
                st.focusTarget = null;
                st.focusTime = 0;
                this.beamTargets = [];
                return;
            }

            // 目標改變則重置
            if (st.focusTarget !== best) {
                st.focusTarget = best;
                st.focusTime = 0;
            }
            st.focusTime += dt;

            // 每秒 +50%，最高 ×6（即 +500%）
            const mult = Math.min(6, 1 + st.focusTime * 0.5);
            const dps = this.dps * mult * dm;

            this.beamTargets = [best];
            const actual = best.takeDamage(dps * dt);
            if (actual > 0) addDamage('orange', actual);
            return;
        }

        // ============ 分支 B：超新星塔 ============
        if (st.evolution === 'B') {
            // 主邏輯走原版
            this.reacquireTimer -= dt;
            if (this.reacquireTimer <= 0) {
                this.beamTargets = this.pickRandom(this.beamCount);
                this.reacquireTimer = this.config.reacquireInterval;
            }
            this.beamTargets = this.beamTargets.filter(function(e) { return e.alive; });

            for (let i = 0; i < this.beamTargets.length; i++) {
                const target = this.beamTargets[i];
                const actual = target.takeDamage(this.dps * dt * dm);
                addDamage('orange', actual);
            }

            // 額外：對每個鎖定目標周圍散射微型雷射
            for (let i = 0; i < this.beamTargets.length; i++) {
                const main = this.beamTargets[i];
                if (!main.alive) continue;
                const mp = main.getPos();
                for (let j = 0; j < enemies.length; j++) {
                    const e = enemies[j];
                    if (!e.alive || e === main) continue;
                    const p = e.getPos();
                    const d = Math.hypot(p.x - mp.x, p.y - mp.y);
                    if (d <= 100) {
                        const actual = e.takeDamage(this.dps * 0.5 * dt * dm);
                        if (actual > 0) addDamage('orange', actual);
                    }
                }
            }
            return;
        }

        _prevUpdate.call(this, dt);
    };

    // ============ 進化外觀 ============
    function drawOrangeEvolvedIcon(branch, x, y, size) {
        ctx.save();
        const s = size;
        if (branch === 'A') {
            // 聚能伽馬塔：橘紅色聚焦水晶 + 核心放射
            const h = s * 0.44, w = s * 0.22;
            const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 150);
            ctx.shadowColor = '#ff4500';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + w, y - h * 0.3);
            ctx.lineTo(x + w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w, y - h * 0.3);
            ctx.closePath();
            const g = ctx.createLinearGradient(x, y - h, x, y + h);
            g.addColorStop(0, '#ffe0a0');
            g.addColorStop(0.4, '#ff4500');
            g.addColorStop(1, '#4a1200');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffd0a0';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // 中心核
            ctx.fillStyle = 'rgba(255, 255, 200, ' + pulse + ')';
            ctx.shadowColor = '#ffcc00';
            ctx.shadowBlur = 18 * pulse;
            ctx.beginPath();
            ctx.arc(x, y, 5 + pulse * 3, 0, Math.PI * 2);
            ctx.fill();
            // 聚焦光環
            ctx.strokeStyle = 'rgba(255, 140, 60, ' + (0.5 + pulse * 0.4) + ')';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, s * 0.35 + pulse * 4, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            // 超新星塔：橘金色 + 星芒
            const h = s * 0.44, w = s * 0.22;
            ctx.shadowColor = '#ff8c00';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + w, y - h * 0.3);
            ctx.lineTo(x + w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w, y - h * 0.3);
            ctx.closePath();
            const g = ctx.createLinearGradient(x, y - h, x, y + h);
            g.addColorStop(0, '#fff8c0');
            g.addColorStop(0.4, '#ff8c00');
            g.addColorStop(1, '#6a2800');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffe0a0';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // 旋轉星芒
            const spin = performance.now() / 400;
            ctx.strokeStyle = 'rgba(255, 220, 140, 0.9)';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#ffcc00';
            ctx.shadowBlur = 12;
            for (let i = 0; i < 8; i++) {
                const a = i * Math.PI / 4 + spin;
                const r1 = s * 0.32;
                const r2 = s * 0.46;
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
                ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2);
                ctx.stroke();
            }
        }
        ctx.restore();
    }

    const _prevDrawBody = BeamTower.prototype.drawBody;
    BeamTower.prototype.drawBody = function(x, y, alpha) {
        const st = getEvo(this);
        if (st.evolution && st.baseType === 'orange') {
            ctx.save();
            ctx.globalAlpha = alpha;
            const color = st.evolution === 'A' ? '#ff4500' : '#ff8c00';
            drawTowerBase(x, y, color, true);
            ctx.restore();
            drawOrangeEvolvedIcon(st.evolution, x, y, 70);
            return;
        }
        _prevDrawBody.call(this, x, y, alpha);
    };

    // 包裝 draw：顯示聚能時間 / 超新星散射光
    const _prevDraw = BeamTower.prototype.draw;
    BeamTower.prototype.draw = function() {
        const st = getEvo(this);
        if (st.evolution === 'A' && st.focusTarget && st.focusTarget.alive && st.focusTime > 0) {
            const t = st.focusTarget.getPos();
            const mult = Math.min(6, 1 + st.focusTime * 0.5);
            const intensity = (mult - 1) / 5;
            ctx.save();
            ctx.strokeStyle = 'rgba(255, ' + Math.floor(120 + intensity * 135) + ', 60, ' + (0.5 + intensity * 0.5) + ')';
            ctx.lineWidth = 4 + intensity * 6;
            ctx.shadowColor = '#ff4500';
            ctx.shadowBlur = 15 + intensity * 20;
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(t.x, t.y);
            ctx.stroke();
            ctx.restore();
        }
        if (st.evolution === 'B') {
            for (let i = 0; i < this.beamTargets.length; i++) {
                const main = this.beamTargets[i];
                if (!main.alive) continue;
                const mp = main.getPos();
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 200, 100, 0.5)';
                ctx.lineWidth = 1.5;
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 8;
                for (let j = 0; j < enemies.length; j++) {
                    const e = enemies[j];
                    if (!e.alive || e === main) continue;
                    const p = e.getPos();
                    if (Math.hypot(p.x - mp.x, p.y - mp.y) <= 100) {
                        ctx.beginPath();
                        ctx.moveTo(mp.x, mp.y);
                        ctx.lineTo(p.x, p.y);
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }
        }
        _prevDraw.call(this);
    };

    // ============ 進化判定 & 執行 ============
    function canEvolve(t) {
        if (!t) return false;
        const st = getEvo(t);
        return !st.evolution && st.baseType === 'orange' && t.level >= 3;
    }

    function doOrangeEvolve(branch) {
        const t = selectedTower;
        if (!t || !canEvolve(t)) return;
        const st = getEvo(t);
        st.evolution = branch;
        if (branch === 'A') {
            t.config = Object.assign({}, st.baseConfig, { name: '聚能伽馬塔', color: '#ff4500' });
            log('☢️ 橙塔進化為【聚能伽馬塔】！', 3000);
        } else {
            t.config = Object.assign({}, st.baseConfig, { name: '超新星塔', color: '#ff8c00' });
            log('✨ 橙塔進化為【超新星塔】！', 3000);
        }
        sfxUpgrade();
        updateUI();
        updateTowerPanel();
        saveGame();
    }

    const _prevEvolve = window.evolveSelectedTower;
    window.evolveSelectedTower = function(branch) {
        if (!selectedTower) return;
        const st = getEvo(selectedTower);
        if (st.baseType === 'orange') doOrangeEvolve(branch);
        else if (typeof _prevEvolve === 'function') _prevEvolve(branch);
    };

    console.log('[進化] 橙塔進化系統載入完成');
})();

<script>
// ============================================================
// 銀塔進化系統
// ============================================================
(function() {
    'use strict';
    console.log('[進化] 銀塔進化系統載入中...');

    const _evo = new WeakMap();
    function getEvo(t) {
        if (!t) return null;
        if (!_evo.has(t)) {
            _evo.set(t, {
                evolution: null,
                baseType: t.type,
                baseConfig: t.config,
                overheat: null,
            });
        }
        return _evo.get(t);
    }

    // ============ 霰彈彈丸 ============
    function ShotgunPellet(tower, target, angleOffset, level) {
        this.x = tower.x;
        this.y = tower.y;
        const tp = target.getPos();
        const baseAngle = Math.atan2(tp.y - this.y, tp.x - this.x);
        this.angle = baseAngle + angleOffset;
        this.speed = 900;
        this.range = 170;
        this.distance = 0;
        this.damage = 5 + (level - 1) * 2.5;
        this.alive = true;
        this.towerType = 'silver';
        this.critRate = tower.critRate || 0;
        this.critDamage = tower.critDamage || 2.0;
    }
    ShotgunPellet.prototype.update = function(dt) {
        if (!this.alive) return;
        const move = this.speed * dt;
        this.x += Math.cos(this.angle) * move;
        this.y += Math.sin(this.angle) * move;
        this.distance += move;
        if (this.distance >= this.range) { this.alive = false; return; }

        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            if (!e.alive) continue;
            const p = e.getPos();
            const r = e.isBoss ? 22 : 14;
            if (Math.hypot(p.x - this.x, p.y - this.y) <= r) {
                let dmg = this.damage;
                if (this.critRate > 0 && Math.random() < this.critRate) dmg *= this.critDamage;
                const actual = e.takeDamage(dmg);
                if (actual > 0) addDamage('silver', actual);
                this.alive = false;
                sfxHit();
                return;
            }
        }
    };
    ShotgunPellet.prototype.draw = function() {
        if (!this.alive) return;
        ctx.save();
        ctx.fillStyle = '#fff4b0';
        ctx.shadowColor = '#ffcc00';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    };

    // ============ 包裝 SilverTower.update ============
    const _prevUpdate = SilverTower.prototype.update;
    SilverTower.prototype.update = function(dt) {
        const st = getEvo(this);
        if (!st.evolution || st.baseType !== 'silver') {
            return _prevUpdate.call(this, dt);
        }

        this.pulse += dt;
        this.fireFlash = Math.max(0, this.fireFlash - dt * 5);

        // ============ 分支 A：全金屬狂潮塔 ============
        if (st.evolution === 'A') {
            // 檢查過熱觸發
            if (this.level >= this.config.maxLevel && (!st.overheat || st.overheat.timer <= 0) && !st.overheatCooldown) {
                st.overheat = { timer: 5.0 };
                log('🔥 全金屬狂潮：過熱啟動！', 2000);
            }

            if (st.overheat && st.overheat.timer > 0) {
                st.overheat.timer -= dt;
                this.idleTimer = 0;
                if (st.overheat.timer <= 0) {
                    st.overheat = null;
                    st.overheatCooldown = 2.0; // 過熱後緩衝
                }
            } else {
                if (st.overheatCooldown > 0) st.overheatCooldown -= dt;
                this.idleTimer += dt;
                if (this.idleTimer >= this.config.decayTime) {
                    this.idleTimer = 0;
                    if (this.level > 1) this.level--;
                }
            }

            this.cooldown -= dt;
            if (this.cooldown > 0) return;

            const bulletCount = (st.overheat && st.overheat.timer > 0) ? this.level * 2 : this.level;
            const targets = this.findTargets(bulletCount);
            if (targets.length === 0) return;
            this.fire(targets);
            this.cooldown = this.config.fireInterval;
            this.idleTimer = 0;
            this.attackCount++;
            if (this.attackCount >= this.config.attacksPerLevel) {
                this.attackCount = 0;
                if (this.level < this.config.maxLevel) this.level++;
            }
            return;
        }

        // ============ 分支 B：霰彈加特林塔 ============
        if (st.evolution === 'B') {
            this.idleTimer += dt;
            if (this.idleTimer >= this.config.decayTime) {
                this.idleTimer = 0;
                if (this.level > 1) this.level--;
            }

            this.cooldown -= dt;
            if (this.cooldown > 0) return;

            // 找最近的敵人
            let best = null, bestD = Infinity;
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (!e.alive) continue;
                const p = e.getPos();
                const d = Math.hypot(p.x - this.x, p.y - this.y);
                if (d < bestD) { bestD = d; best = e; }
            }
            if (!best || bestD > 250) return;

            const count = Math.min(4 + this.level, 14);
            const spread = 0.4 + Math.min(this.level, 8) * 0.12;
            for (let i = 0; i < count; i++) {
                const offset = count > 1 ? (i / (count - 1) - 0.5) * spread : 0;
                bullets.push(new ShotgunPellet(this, best, offset, this.level));
            }
            this.fireFlash = 1;
            this.cooldown = this.config.fireInterval;
            this.idleTimer = 0;
            this.attackCount++;
            if (this.attackCount >= this.config.attacksPerLevel) {
                this.attackCount = 0;
                if (this.level < this.config.maxLevel) this.level++;
            }
            sfxShoot();
            return;
        }

        _prevUpdate.call(this, dt);
    };

    // ============ 進化外觀 ============
    function drawSilverEvolvedIcon(branch, x, y, size) {
        ctx.save();
        const s = size;
        if (branch === 'A') {
            // 全金屬狂潮塔：金屬堆疊 + 紅色核心
            for (let k = 2; k >= 0; k--) {
                const scale = 1 - k * 0.15;
                const yOff = -k * s * 0.04;
                const h = s * 0.18 * scale;
                const w = s * 0.22 * scale;
                ctx.beginPath();
                ctx.moveTo(x, y - h + yOff);
                ctx.lineTo(x - w, y + yOff - h * 0.2);
                ctx.lineTo(x - w, y + h * 0.6 + yOff);
                ctx.lineTo(x + w, y + h * 0.6 + yOff);
                ctx.lineTo(x + w, y + yOff - h * 0.2);
                ctx.closePath();
                const g = ctx.createLinearGradient(x - w, y - h + yOff, x + w, y + h + yOff);
                g.addColorStop(0, '#f0f0f0');
                g.addColorStop(0.5, '#909090');
                g.addColorStop(1, '#404040');
                ctx.fillStyle = g;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }
            // 紅色核心
            const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 100);
            ctx.shadowColor = '#ff2020';
            ctx.shadowBlur = 20 * pulse;
            ctx.fillStyle = 'rgba(255, 80, 80, ' + pulse + ')';
            ctx.beginPath();
            ctx.arc(x, y - s * 0.30, 5 + pulse * 3, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 霰彈加特林塔：金屬 + 散射口
            const h = s * 0.36, w = s * 0.24;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x - w, y - h * 0.2);
            ctx.lineTo(x - w, y + h * 0.7);
            ctx.lineTo(x + w, y + h * 0.7);
            ctx.lineTo(x + w, y - h * 0.2);
            ctx.closePath();
            const g = ctx.createLinearGradient(x - w, y, x + w, y);
            g.addColorStop(0, '#c0c0c0');
            g.addColorStop(0.5, '#606060');
            g.addColorStop(1, '#303030');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // 散熱孔
            ctx.fillStyle = '#202020';
            for (let k = 0; k < 3; k++) {
                ctx.beginPath();
                ctx.arc(x - w * 0.5 + k * w * 0.5, y - h * 0.1, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
            // 出口散射光
            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 200);
            ctx.strokeStyle = 'rgba(255, 200, 100, ' + pulse + ')';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 12 * pulse;
            for (let k = 0; k < 3; k++) {
                const a = Math.PI / 2 + (k - 1) * 0.35;
                ctx.beginPath();
                ctx.moveTo(x, y + h * 0.3);
                ctx.lineTo(x + Math.cos(a) * s * 0.4, y + Math.sin(a) * s * 0.4);
                ctx.stroke();
            }
        }
        ctx.restore();
    }

    const _prevDrawBody = SilverTower.prototype.drawBody;
    SilverTower.prototype.drawBody = function(x, y, alpha) {
        const st = getEvo(this);
        if (st.evolution && st.baseType === 'silver') {
            ctx.save();
            ctx.globalAlpha = alpha;
            const color = st.evolution === 'A' ? '#909090' : '#606060';
            drawTowerBase(x, y, color, st.evolution === 'A');
            ctx.restore();
            drawSilverEvolvedIcon(st.evolution, x, y, 70);
            return;
        }
        _prevDrawBody.call(this, x, y, alpha);
    };

    // ============ 進化判定 & 執行 ============
    function canEvolve(t) {
        if (!t) return false;
        const st = getEvo(t);
        return !st.evolution && st.baseType === 'silver' && t.level >= 3;
    }

    function doSilverEvolve(branch) {
        const t = selectedTower;
        if (!t || !canEvolve(t)) return;
        const st = getEvo(t);
        st.evolution = branch;
        if (branch === 'A') {
            t.config = Object.assign({}, st.baseConfig, { name: '全金屬狂潮塔', color: '#909090' });
            log('🔥 銀塔進化為【全金屬狂潮塔】！', 3000);
        } else {
            t.config = Object.assign({}, st.baseConfig, { name: '霰彈加特林塔', color: '#606060' });
            log('💨 銀塔進化為【霰彈加特林塔】！', 3000);
        }
        sfxUpgrade();
        updateUI();
        updateTowerPanel();
        saveGame();
    }

    const _prevEvolve = window.evolveSelectedTower;
    window.evolveSelectedTower = function(branch) {
        if (!selectedTower) return;
        const st = getEvo(selectedTower);
        if (st.baseType === 'silver') doSilverEvolve(branch);
        else if (typeof _prevEvolve === 'function') _prevEvolve(branch);
    };

    console.log('[進化] 銀塔進化系統載入完成');
})();

<script>
// ============================================================
// 藍塔進化系統（新增區塊）
// ============================================================
(function() {
    'use strict';

    console.log('[進化] 藍塔進化系統載入中...');

    const _evo = new WeakMap();
    function getEvo(tower) {
        if (!tower) return null;
        if (!_evo.has(tower)) {
            _evo.set(tower, {
                evolution: null,
                baseType: tower.type,
                baseConfig: tower.config,
            });
        }
        return _evo.get(tower);
    }

    // ============ 電磁網 DOT 狀態 ============
    const ELEC_MAX_STACKS = 10;
    const ELEC_DURATION = 3.0;
    const ELEC_DPS_PER_STACK = 1.8;

    function applyElectric(enemy, level) {
        if (!enemy || !enemy.alive) return;
        if (!enemy._electric) enemy._electric = { stacks: 0, timer: 0 };
        enemy._electric.stacks = Math.min(ELEC_MAX_STACKS, enemy._electric.stacks + 1);
        enemy._electric.timer = ELEC_DURATION;
        enemy._electric.level = level || 1;
    }

    function tickElectric(enemy, dt) {
        const e = enemy._electric;
        if (!e || e.stacks <= 0) return;
        e.timer -= dt;
        if (e.timer <= 0) { e.stacks = 0; return; }
        const dps = ELEC_DPS_PER_STACK * e.stacks * (1 + (e.level - 1) * 0.15);
        const actual = enemy.takeDamage(dps * dt);
        if (actual > 0) addDamage('blue', actual);
    }

    // 包裝 Enemy.update 處理電磁 DOT
    const _prevEnemyUpdate = Enemy.prototype.update;
    Enemy.prototype.update = function(dt) {
        if (this.alive && this._electric && this._electric.stacks > 0) {
            tickElectric(this, dt);
        }
        _prevEnemyUpdate.call(this, dt);
    };

    // 包裝 Enemy.draw 顯示電弧
    const _prevEnemyDraw = Enemy.prototype.draw;
    Enemy.prototype.draw = function() {
        _prevEnemyDraw.call(this);
        if (!this.alive) return;
        const e = this._electric;
        if (!e || e.stacks <= 0) return;
        const p = this.getPos();
        const r = this.isBoss ? 22 : 13;
        const intensity = Math.min(1, e.stacks / ELEC_MAX_STACKS);
        ctx.save();
        const arcCount = Math.ceil(e.stacks / 2);
        const seed = Math.floor(performance.now() / 80);
        for (let i = 0; i < arcCount; i++) {
            const a1 = (seed + i * 1.37) % (Math.PI * 2);
            const a2 = a1 + 0.9 + (i % 3) * 0.3;
            ctx.strokeStyle = 'rgba(100, 200, 255, ' + (0.4 + intensity * 0.5) + ')';
            ctx.lineWidth = 1.2;
            ctx.shadowColor = '#00aaff';
            ctx.shadowBlur = 8;
            const R = r + 3;
            ctx.beginPath();
            ctx.moveTo(p.x + Math.cos(a1) * R, p.y + Math.sin(a1) * R);
            for (let s = 1; s <= 3; s++) {
                const t = s / 3;
                const a = a1 + (a2 - a1) * t;
                const jitter = ((seed + s * 7 + i * 3) % 5 - 2) * 0.8;
                ctx.lineTo(p.x + Math.cos(a) * (R + jitter), p.y + Math.sin(a) * (R + jitter));
            }
            ctx.stroke();
        }
        ctx.restore();
    };

    // ============ 超頻脈衝爆炸視覺 ============
    const _explosions = [];
    function spawnExplosion(x, y) {
        _explosions.push({ x: x, y: y, timer: 0.4, maxLife: 0.4 });
    }

    // 包裝 drawBackground，在繪製背景後疊加爆炸特效
    const _prevDrawBG = drawBackground;
    drawBackground = function() {
        _prevDrawBG.call(this);
        const dt = 1 / 60;
        for (let i = _explosions.length - 1; i >= 0; i--) {
            const fx = _explosions[i];
            fx.timer -= dt;
            if (fx.timer <= 0) { _explosions.splice(i, 1); continue; }
            const alpha = fx.timer / fx.maxLife;
            const t = 1 - alpha;
            const radius = 20 + t * 90;
            ctx.save();
            ctx.strokeStyle = 'rgba(120, 200, 255, ' + (alpha * 0.9) + ')';
            ctx.lineWidth = 4 * alpha;
            ctx.shadowColor = '#00aaff';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(220, 240, 255, ' + alpha + ')';
            ctx.lineWidth = 2 * alpha;
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, radius * 0.6, 0, Math.PI * 2);
            ctx.stroke();
            // 電光從中心射出
            for (let k = 0; k < 6; k++) {
                const a = k * Math.PI / 3 + t * 0.5;
                ctx.strokeStyle = 'rgba(180, 230, 255, ' + (alpha * 0.7) + ')';
                ctx.lineWidth = 2 * alpha;
                ctx.beginPath();
                ctx.moveTo(fx.x, fx.y);
                ctx.lineTo(fx.x + Math.cos(a) * radius, fx.y + Math.sin(a) * radius);
                ctx.stroke();
            }
            ctx.restore();
        }
    };

    // ============ 包裝 Tower.fire 標記子彈分支 ============
    const _prevTowerFire = Tower.prototype.fire;
    Tower.prototype.fire = function(target) {
        const st = getEvo(this);
        const before = bullets.length;
        _prevTowerFire.call(this, target);
        if (st.evolution && st.baseType === 'blue') {
            for (let i = before; i < bullets.length; i++) {
                bullets[i]._blueBranch = st.evolution;
                bullets[i]._blueLevel = this.level;
            }
        }
    };

    // ============ 包裝 Bullet.update 處理藍塔進化效果 ============
    const _prevBulletUpdate = Bullet.prototype.update;
    Bullet.prototype.update = function(dt) {
        const branch = this._blueBranch;
        const target = this.target;
        const wasAlive = target ? target.alive : false;
        const hpBefore = wasAlive ? target.hp : 0;

        _prevBulletUpdate.call(this, dt);

        if (!branch || !target || !wasAlive) return;

        // ============ 分支 A：電磁鏈塔 ============
        if (branch === 'A') {
            const hit = target.hp < hpBefore || (target.hp <= 0 && wasAlive);
            if (hit) {
                applyElectric(target, this._blueLevel);
                // 連鎖 2 個附近敵人
                const tp = target.getPos();
                const nearby = [];
                for (let i = 0; i < enemies.length; i++) {
                    const e = enemies[i];
                    if (!e.alive || e === target) continue;
                    const p = e.getPos();
                    const d = Math.hypot(p.x - tp.x, p.y - tp.y);
                    if (d <= 120) nearby.push({ e: e, d: d });
                }
                nearby.sort(function(a, b) { return a.d - b.d; });
                const chainCount = Math.min(2, nearby.length);
                for (let i = 0; i < chainCount; i++) {
                    applyElectric(nearby[i].e, this._blueLevel);
                }
            }
        }

        // ============ 分支 B：超頻藍塔 ============
        if (branch === 'B') {
            const killed = wasAlive && (target.hp <= 0 || !target.alive);
            if (killed && !target.isBoss) {
                const tp = target.getPos();
                const maxHp = target.maxHp;
                const explosionDmg = maxHp * 0.20;
                for (let i = 0; i < enemies.length; i++) {
                    const e = enemies[i];
                    if (!e.alive || e === target) continue;
                    const p = e.getPos();
                    const d = Math.hypot(p.x - tp.x, p.y - tp.y);
                    if (d <= 120) {
                        let dmg = explosionDmg;
                        if (e.isBoss) dmg *= 0.3;
                        const actual = e.takeDamage(dmg);
                        if (actual > 0) addDamage('blue', actual);
                    }
                }
                spawnExplosion(tp.x, tp.y);
                sfxHit();
            }
        }
    };

    // ============ 包裝 applyLevel 維持進化後的屬性 ============
    const _prevApplyLevel = Tower.prototype.applyLevel;
    Tower.prototype.applyLevel = function() {
        _prevApplyLevel.call(this);
        const st = getEvo(this);
        if (!st.evolution || st.baseType !== 'blue') return;
        if (st.evolution === 'A') {
            // 電磁鏈塔：100% 命中、不秒殺、有小額基礎傷害
            this.hitChance = 1;
            this.killChance = 0;
            this.damage = 1.5 + (this.level - 1) * 0.5;
        } else if (st.evolution === 'B') {
            // 超頻藍塔：命中率 10%
            this.hitChance = 0.10;
            this.killChance = 1;
        }
    };

    // ============ 進化外觀 ============
    function drawBlueEvolvedIcon(branch, x, y, size) {
        ctx.save();
        const s = size;
        if (branch === 'A') {
            // 電磁鏈塔：電藍色水晶 + 電弧
            const h = s * 0.44, w = s * 0.18;
            ctx.shadowColor = '#00bfff';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + w, y - h * 0.3);
            ctx.lineTo(x + w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w, y - h * 0.3);
            ctx.closePath();
            const g = ctx.createLinearGradient(x, y - h, x, y + h);
            g.addColorStop(0, '#e0f8ff');
            g.addColorStop(0.4, '#00bfff');
            g.addColorStop(1, '#003a66');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#c0f0ff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // 中央閃電
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(x - s * 0.04, y - h * 0.55);
            ctx.lineTo(x + s * 0.02, y - h * 0.1);
            ctx.lineTo(x - s * 0.04, y - h * 0.05);
            ctx.lineTo(x + s * 0.05, y + h * 0.55);
            ctx.stroke();
        } else {
            // 超頻藍塔：亮藍色水晶 + 脈動光環
            const h = s * 0.46, w = s * 0.20;
            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 120);
            ctx.shadowColor = '#1e90ff';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + w, y - h * 0.3);
            ctx.lineTo(x + w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w * 0.7, y + h * 0.85);
            ctx.lineTo(x - w, y - h * 0.3);
            ctx.closePath();
            const g = ctx.createLinearGradient(x, y - h, x, y + h);
            g.addColorStop(0, '#ffffff');
            g.addColorStop(0.3, '#80d0ff');
            g.addColorStop(0.7, '#1e90ff');
            g.addColorStop(1, '#004488');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#e0f4ff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // 脈動光點
            ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.7 + pulse * 0.3) + ')';
            ctx.shadowColor = '#80d0ff';
            ctx.shadowBlur = 15 * pulse;
            ctx.beginPath();
            ctx.arc(x, y - h * 0.2, 3 + pulse * 2, 0, Math.PI * 2);
            ctx.fill();
            // 外光環
            ctx.strokeStyle = 'rgba(120, 200, 255, ' + (0.4 + pulse * 0.4) + ')';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 12 * pulse;
            ctx.beginPath();
            ctx.arc(x, y, s * 0.4 + pulse * 3, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();
    }

    const _prevDrawBody = Tower.prototype.drawBody;
    Tower.prototype.drawBody = function(x, y, alpha) {
        const st = getEvo(this);
        if (st.evolution && st.baseType === 'blue') {
            ctx.save();
            ctx.globalAlpha = alpha;
            const color = st.evolution === 'A' ? '#00bfff' : '#1e90ff';
            drawTowerBase(x, y, color, true);
            ctx.restore();
            drawBlueEvolvedIcon(st.evolution, x, y, 70);
            return;
        }
        _prevDrawBody.call(this, x, y, alpha);
    };

    // ============ 進化判定 ============
    function canEvolve(tower) {
        if (!tower) return false;
        const st = getEvo(tower);
        if (st.evolution) return false;
        if (st.baseType !== 'blue') return false;
        if (tower.level < 3) return false;
        return true;
    }

    // ============ 執行進化 ============
    function doBlueEvolve(branch) {
        const tower = selectedTower;
        if (!tower || !canEvolve(tower)) return;
        const st = getEvo(tower);
        st.evolution = branch;
        if (branch === 'A') {
            tower.hitChance = 1;
            tower.killChance = 0;
            tower.damage = 1.5 + (tower.level - 1) * 0.5;
            tower.config = Object.assign({}, st.baseConfig, { name: '電磁鏈塔', color: '#00bfff' });
            log('⚡ 藍塔進化為【電磁鏈塔】！', 3000);
        } else {
            tower.hitChance = 0.10;
            tower.killChance = 1;
            tower.config = Object.assign({}, st.baseConfig, { name: '超頻藍塔', color: '#1e90ff' });
            log('💥 藍塔進化為【超頻藍塔】！', 3000);
        }
        sfxUpgrade();
        updateUI();
        updateTowerPanel();
        saveGame();
        const box = document.getElementById('branch-options');
        if (box) box.style.display = 'none';
    }

    // ============ 接管全域 evolveSelectedTower ============
    const _prevEvolveFn = window.evolveSelectedTower;
    window.evolveSelectedTower = function(branch) {
        if (!selectedTower) return;
        const st = getEvo(selectedTower);
        if (st.baseType === 'blue') {
            doBlueEvolve(branch);
        } else if (typeof _prevEvolveFn === 'function') {
            _prevEvolveFn(branch);
        }
    };

    // ============ 進化 UI ============
    function updateEvolveUI() {
        const box = document.getElementById('branch-options');
        if (!box) return;
        const tower = selectedTower;
        if (!tower) { box.style.display = 'none'; return; }
        const st = getEvo(tower);
        if (st.baseType !== 'blue') return;
        if (st.evolution || tower.level < 3) {
            box.style.display = 'none';
            return;
        }
        box.style.display = 'flex';
        const tA = document.getElementById('branch-a-title');
        const dA = document.getElementById('branch-a-desc');
        const tB = document.getElementById('branch-b-title');
        const dB = document.getElementById('branch-b-desc');
        if (tA) tA.innerText = '⚡ 分支 A：電磁鏈塔';
        if (dA) dA.innerText = '命中率 100%、攻速極快\n命中時施加【電磁網】（每秒 DOT，可疊 10 層）\n並連鎖到附近 2 名敵人';
        if (tB) tB.innerText = '💥 分支 B：超頻藍塔';
        if (dB) dB.innerText = '命中率提升至 10%\n秒殺成功時產生超頻脈衝\n對周圍敵人造成目標最大生命 20% 傷害';
    }
    setInterval(updateEvolveUI, 30);

    // ============ 存檔整合 ============
    function getEvolutionFromConfig(tower) {
        const n = tower.config && tower.config.name;
        if (n === '墨綠塔') return { base: 'green', branch: 'A' };
        if (n === '天狼之塔') return { base: 'green', branch: 'B' };
        if (n === '質量塔') return { base: 'purple', branch: 'A' };
        if (n === '霜凍塔') return { base: 'purple', branch: 'B' };
        if (n === '電磁鏈塔') return { base: 'blue', branch: 'A' };
        if (n === '超頻藍塔') return { base: 'blue', branch: 'B' };
        return null;
    }

    saveGame = function() {
        if (!currentDifficulty || gameState !== 'playing') return;
        try {
            const towerData = [];
            for (let i = 0; i < SPOTS.length; i++) {
                const s = SPOTS[i];
                if (s.tower) {
                    const evo = getEvolutionFromConfig(s.tower);
                    towerData.push({
                        idx: i,
                        type: evo ? evo.base : s.tower.type,
                        level: s.tower.level,
                        evolution: evo ? evo.branch : null,
                    });
                }
            }
            const data = {
                version: 1,
                difficulty: currentDifficulty,
                money: money,
                lives: lives,
                wave: wave,
                damageStats: damageStats,
                unlocked: Object.assign({}, unlocked),
                towers: towerData,
                timestamp: Date.now(),
            };
            localStorage.setItem(getSaveKey(), JSON.stringify(data));
        } catch (e) {}
    };

    loadGame = function() {
        if (!currentDifficulty) return false;
        try {
            const raw = localStorage.getItem(getSaveKey());
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (!data || data.version !== 1 || data.difficulty !== currentDifficulty || data.wave === 0) return false;
            money = data.money || DIFFICULTIES[currentDifficulty].startMoney;
            lives = data.lives || DIFFICULTIES[currentDifficulty].startLives;
            wave = data.wave || 0;
            damageStats = data.damageStats || {};
            if (data.unlocked) {
                for (const k in data.unlocked) {
                    if (unlocked.hasOwnProperty(k)) unlocked[k] = data.unlocked[k];
                }
            }
            for (let i = 0; i < SPOTS.length; i++) SPOTS[i].tower = null;
            const towers = data.towers || [];
            for (let i = 0; i < towers.length; i++) {
                const t = towers[i];
                const spot = SPOTS[t.idx];
                if (!spot) continue;
                const tower = createTower(spot, t.type);
                if (!tower) continue;
                tower.level = Math.min(t.level || 1, MAX_TOWER_LEVEL);
                if (tower.applyLevel) tower.applyLevel();
                spot.tower = tower;
                if (t.evolution) {
                    const oldSel = selectedTower;
                    selectedTower = tower;
                    try { window.evolveSelectedTower(t.evolution); } catch (e) {}
                    selectedTower = oldSel;
                }
            }
            for (const type in unlocked) {
                const btn = document.querySelector('.shop-btn[data-type="' + type + '"]');
                if (!btn) continue;
                if (unlocked[type]) btn.classList.remove('locked');
                else btn.classList.add('locked');
            }
            updateUI();
            return true;
        } catch (e) { return false; }
    };

    console.log('[進化] 藍塔進化系統載入完成');
})();
</script>
