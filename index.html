// ============ 合成 ============
const COMBOS = {
  'white+white': () => {
    const r = Math.random();
    if (r < 0.45) return 'green';
    if (r < 0.90) return 'blue';
    return 'cyan';
  },
  'purple+purple': () => 'orange',
  'orange+orange': () => 'red',
};

function canCombine(a, b) {
  if (!a || !b) return false;
  if (a === b) return false;
  if (a.type === 'magenta' || b.type === 'magenta') return false;
  return !!COMBOS[a.type + '+' + b.type];
}

function createTower(spot, type) {
  if (type === 'orange') return new BeamTower(spot);
  if (type === 'red') return new BossTower(spot);
  if (type === 'silver') return new SilverTower(spot);
  if (type === 'magenta') return new MagentaTower(spot);
  if (type === 'fireArrow') return new FireArrowTower(spot);
  if (!TOWER_TYPES[type]) return null;
  return new Tower(spot, type);
}

function unlockButton(type) {
  const btn = document.querySelector(`.shop-btn[data-type="${type}"]`);
  if (!btn) return;
  btn.classList.remove('locked');
  btn.classList.add('just-unlocked');
  setTimeout(() => btn.classList.remove('just-unlocked'), 2000);
}

function combineTowers(a, b) {
  const key = a.type + '+' + b.type;
  const resultType = COMBOS[key]();
  const spotA = a.spot, spotB = b.spot;
  spotA.tower = null; spotB.tower = null;
  const newTower = createTower(spotA, resultType);
  spotA.tower = newTower;
  sfxCombine();

  if (resultType === 'green' && !unlocked.green) {
    unlocked.green = true; unlockButton('green'); log('✨ 綠塔解鎖！');
  } else if (resultType === 'blue' && !unlocked.blue) {
    unlocked.blue = true; unlockButton('blue'); log('💙 藍塔解鎖！');
  } else if (resultType === 'orange' && !unlocked.orange) {
    unlocked.orange = true; unlockButton('orange'); log('🔥 橙塔解鎖！');
  } else if (resultType === 'cyan') {
    log('⚡ 青藍塔！專剋 Boss', 3000);
  } else if (resultType === 'red') {
    log('💼 紅塔！無良老闆登場');
  } else {
    const names = { green: '綠塔', blue: '藍塔', orange: '橙塔', red: '紅塔' };
    log(`合成：${names[resultType] || resultType}`);
  }
  selectedTower = null;
  updateTowerPanel();
  updateUI();
  saveGame();
}

function combineGold(towerList) {
  const firstSpot = towerList[0].spot;
  for (const t of towerList) t.spot.tower = null;
  const newTower = new Tower(firstSpot, 'gold');
  firstSpot.tower = newTower;
  goldBanner.classList.add('show');
  setTimeout(() => goldBanner.classList.remove('show'), 1800);
  sfxGold();
  log('✨✨✨ 金色傳說！', 4000);
  selectedTower = null;
  updateTowerPanel();
  updateUI();
  saveGame();
}

// ============ 波次 ============
function startWave() {
  if (waveActive || gameOver || gameState !== 'playing') return;
  const cfg = DIFFICULTIES[currentDifficulty];
  if (wave >= cfg.maxWave) return;

  wave++;
  waveActive = true;
  autoNextTimer = 0;

  const isBossWave = wave % 10 === 0;
  const baseHp = Math.floor(45 * Math.pow(cfg.hpGrowth, wave - 1));
  const baseSpeed = Math.min(180, 70 + (wave - 1) * 4);
  const count = 5 + Math.floor(wave * 1.5);

  spawnQueue = [];
  for (let i = 0; i < count; i++) {
    spawnQueue.push({ hp: baseHp, speed: baseSpeed, delay: i * 0.55, isBoss: false });
  }
  if (isBossWave) {
    const bossHp = Math.floor(baseHp * 20);
    const bossSpeed = baseSpeed * 0.6;
    spawnQueue.push({
      hp: bossHp, speed: bossSpeed,
      delay: count * 0.55 + 2.5, isBoss: true,
    });
    log(`⚠️ 第 ${wave} 波：BOSS！`, 3000);
    sfxBoss();
  }

  spawnTimer = 0;
  startWaveBtn.disabled = true;
  updateUI();
  saveGame();
}

// ============ 指標 ============
function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (BASE_W / rect.width),
    y: (e.clientY - rect.top) * (BASE_H / rect.height),
  };
}

function findSpotAt(x, y) {
  const radius = SPOT_SIZE * 0.55;
  for (const spot of SPOTS) {
    if (Math.hypot(x - spot.x, y - spot.y) <= radius) return spot;
  }
  return null;
}

function handleTowerTap(tower) {
  if (tower.type === 'magenta') {
    selectedTower = tower;
    updateTowerPanel();
    return;
  }
  comboSequence.push({ type: tower.type, tower });
  if (comboSequence.length === GOLD_RECIPE.length) {
    let fullMatch = true;
    for (let i = 0; i < GOLD_RECIPE.length; i++) {
      if (comboSequence[i].type !== GOLD_RECIPE[i]) { fullMatch = false; break; }
    }
    if (fullMatch) {
      combineGold(comboSequence.map(c => c.tower));
      comboSequence = [];
      return;
    }
  }
  let isPrefix = true;
  for (let i = 0; i < comboSequence.length; i++) {
    if (comboSequence[i].type !== GOLD_RECIPE[i]) { isPrefix = false; break; }
  }
  if (!isPrefix) {
    comboSequence = tower.type === GOLD_RECIPE[0] ? [{ type: tower.type, tower }] : [];
  }
  selectedTower = tower;
  updateTowerPanel();
}

// ============ 輸入處理 ============
function startDragAt(x, y) {
  if (gameOver || gameState !== 'playing') return;
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const pos = {
    x: (x - rect.left) * (BASE_W / rect.width),
    y: (y - rect.top) * (BASE_H / rect.height),
  };
  const spot = findSpotAt(pos.x, pos.y);
  if (!spot) {
    selectedTower = null;
    comboSequence = [];
    updateTowerPanel();
    return;
  }
  if (removeMode) {
    if (spot.tower) {
      const t = spot.tower;
      const refund = Math.floor((TOWER_TYPES[t.type].baseCost || 0) * 0.5);
      money += refund;
      spot.tower = null;
      selectedTower = null;
      comboSequence = [];
      sfxRemove();
      updateUI();
      updateTowerPanel();
      log(`已撤除，返還 ${refund} 💰`);
      saveGame();
    }
    return;
  }
  if (shopSelected) {
    if (spot.tower) return;
    const cfg = TOWER_TYPES[shopSelected];
    if (money < cfg.cost) { log('金幣不足'); return; }
    money -= cfg.cost;
    spot.tower = createTower(spot, shopSelected);
    sfxPlace();
    updateUI();
    saveGame();
    return;
  }
  if (spot.tower) {
    if (inputMode === 'mouse') {
      if (selectedTower && selectedTower !== spot.tower) {
        const a = selectedTower, b = spot.tower;
        if (canCombine(a, b)) {
          combineTowers(a, b);
          selectedTower = null;
          return;
        } else {
          const aSpot = a.spot, bSpot = b.spot;
          aSpot.tower = b; bSpot.tower = a;
          a.spot = bSpot; b.spot = aSpot;
          sfxPlace();
          saveGame();
          selectedTower = null;
          updateTowerPanel();
          return;
        }
      }
      handleTowerTap(spot.tower);
      return;
    }
    drag = {
      tower: spot.tower, spot: spot,
      startX: pos.x, startY: pos.y,
      currentX: pos.x, currentY: pos.y,
      isDragging: false,
    };
  } else {
    selectedTower = null;
    comboSequence = [];
    updateTowerPanel();
  }
}

function moveDragTo(x, y) {
  if (!drag) return;
  const rect = canvas.getBoundingClientRect();
  const pos = {
    x: (x - rect.left) * (BASE_W / rect.width),
    y: (y - rect.top) * (BASE_H / rect.height),
  };
  drag.currentX = pos.x;
  drag.currentY = pos.y;
  if (!drag.isDragging) {
    const dx = pos.x - drag.startX, dy = pos.y - drag.startY;
    if (Math.hypot(dx, dy) > 8) {
      drag.isDragging = true;
      selectedTower = null;
      comboSequence = [];
      updateTowerPanel();
    }
  }
}

function endDragAt(x, y) {
  if (!drag) return;
  const rect = canvas.getBoundingClientRect();
  const pos = {
    x: (x - rect.left) * (BASE_W / rect.width),
    y: (y - rect.top) * (BASE_H / rect.height),
  };
  if (drag.isDragging) {
    const targetSpot = findSpotAt(pos.x, pos.y);
    if (targetSpot && targetSpot !== drag.spot) {
      const a = drag.tower, aSpot = drag.spot;
      const b = targetSpot.tower;
      if (!b) {
        aSpot.tower = null;
        targetSpot.tower = a;
        a.spot = targetSpot;
        sfxPlace();
        saveGame();
      } else if (canCombine(a, b)) {
        combineTowers(a, b);
      } else {
        aSpot.tower = b;
        targetSpot.tower = a;
        a.spot = targetSpot;
        b.spot = aSpot;
        sfxPlace();
        saveGame();
      }
    }
  } else {
    handleTowerTap(drag.tower);
  }
  drag = null;
}

canvas.addEventListener('pointerdown', (e) => {
  if (inputMode !== 'pointer' || gameState !== 'playing') return;
  e.preventDefault();
  const now = performance.now();
  if (now - lastDownTime < 60) return;
  lastDownTime = now;
  startDragAt(e.clientX, e.clientY);
}, { passive: false });
document.addEventListener('pointermove', (e) => {
  if (inputMode !== 'pointer' || !drag) return;
  moveDragTo(e.clientX, e.clientY);
}, { passive: false });
document.addEventListener('pointerup', (e) => {
  if (inputMode !== 'pointer' || !drag) return;
  endDragAt(e.clientX, e.clientY);
}, { passive: false });
document.addEventListener('pointercancel', () => {
  if (inputMode !== 'pointer') return;
  drag = null;
});

canvas.addEventListener('mousedown', (e) => {
  if (inputMode !== 'mouse' || gameState !== 'playing') return;
  e.preventDefault();
  const now = performance.now();
  if (now - lastDownTime < 60) return;
  lastDownTime = now;
  startDragAt(e.clientX, e.clientY);
});
document.addEventListener('mousemove', (e) => {
  if (inputMode !== 'mouse' || !drag) return;
  moveDragTo(e.clientX, e.clientY);
});
document.addEventListener('mouseup', (e) => {
  if (inputMode !== 'mouse' || !drag) return;
  endDragAt(e.clientX, e.clientY);
});

// ============ 傷害統計面板 ============
let statsVisible = false;

function renderStats() {
  if (!statsVisible) return;
  const entries = Object.entries(damageStats).filter(([_, v]) => v > 0)
    .sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((sum, [_, v]) => sum + v, 0);
  if (entries.length === 0) {
    statsList.innerHTML = '<div style="color:#666;text-align:center;padding:12px 0;">還沒有傷害紀錄</div>';
    statsTotal.textContent = '0';
    return;
  }
  let html = '';
  for (const [type, dmg] of entries) {
    const cfg = TOWER_TYPES[type];
    const name = cfg ? cfg.name : type;
    const color = cfg ? cfg.color : '#666';
    const pct = ((dmg / total) * 100).toFixed(1);
    html += `<div class="stats-row">
      <div class="stats-dot" style="background:${color};"></div>
      <div class="stats-name">${name}</div>
      <div class="stats-num">${formatNum(dmg)}</div>
      <div class="stats-pct">${pct}%</div>
    </div>`;
  }
  statsList.innerHTML = html;
  statsTotal.textContent = formatNum(total);
}

statsBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  statsVisible = !statsVisible;
  statsPanel.classList.toggle('hidden', !statsVisible);
  statsBtn.classList.toggle('active', statsVisible);
  if (statsVisible) renderStats();
}, { passive: false });

// ============ 背景 ============
function drawBackground() {
  const grad = ctx.createRadialGradient(BASE_W / 2, BASE_H / 2, 50, BASE_W / 2, BASE_H / 2, 700);
  grad.addColorStop(0, '#1a1a3a');
  grad.addColorStop(0.5, '#0d0d20');
  grad.addColorStop(1, '#050510');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  for (let i = 0; i < 60; i++) {
    const sx = (i * 137.5) % BASE_W;
    const sy = (i * 73.3) % BASE_H;
    const sr = 0.5 + ((i * 17) % 10) / 10;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  }
}

function drawPath() {
  ctx.beginPath();
  ctx.moveTo(PATH[0].x, PATH[0].y);
  for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
  ctx.strokeStyle = hasGoldTower ? '#2a1f0a' : '#23233d';
  ctx.lineWidth = 42; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.strokeStyle = hasGoldTower ? '#4a3a15' : '#2e2e50';
  ctx.lineWidth = 32;
  ctx.stroke();
  if (hasGoldTower) {
    ctx.save();
    ctx.setLineDash([12, 18]);
    ctx.lineDashOffset = (performance.now() / 25) % 30;
    ctx.strokeStyle = 'rgba(120, 90, 10, 0.6)';
    ctx.lineWidth = 32;
    ctx.stroke();
    ctx.setLineDash([6, 24]);
    ctx.lineDashOffset = (performance.now() / 25) % 30;
    ctx.strokeStyle = 'rgba(241, 196, 15, 0.7)';
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.restore();
  }
}

function drawSpot(spot) {
  const x = spot.x, y = spot.y;
  const size = SPOT_SIZE, half = size / 2;
  if (spot.special === 'glow') {
    ctx.save();
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 20;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.fillRect(x - half, y - half, size, size);
    ctx.restore();
    ctx.fillStyle = '#2ecc71';
    ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const ax = x - 20 + i * 20, ay = y + 10;
      ctx.beginPath();
      ctx.moveTo(ax, ay); ctx.lineTo(ax - 8, ay + 12); ctx.lineTo(ax - 4, ay + 12);
      ctx.lineTo(ax - 4, ay + 22); ctx.lineTo(ax + 4, ay + 22); ctx.lineTo(ax + 4, ay + 12);
      ctx.lineTo(ax + 8, ay + 12); ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    return;
  }
  if (spot.special === 'void') {
    const grad = ctx.createRadialGradient(x, y, 0, x, y, half);
    grad.addColorStop(0, '#000000'); grad.addColorStop(0.6, '#0a0a14'); grad.addColorStop(1, '#1a1a30');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, half, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(80, 50, 120, 0.4)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      const startR = 5 + i * 12;
      for (let a = 0; a < Math.PI * 4; a += 0.2) {
        const r = startR + a * 2;
        if (r > half) break;
        const px = x + Math.cos(a + i) * r, py = y + Math.sin(a + i) * r;
        if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    return;
  }
  const grad = ctx.createLinearGradient(x - half, y - half, x + half, y + half);
  grad.addColorStop(0, '#c8c8c8'); grad.addColorStop(0.5, '#b0b0b0'); grad.addColorStop(1, '#888888');
  ctx.fillStyle = grad;
  const r = 6;
  ctx.beginPath();
  ctx.moveTo(x - half + r, y - half);
  ctx.lineTo(x + half - r, y - half);
  ctx.quadraticCurveTo(x + half, y - half, x + half, y - half + r);
  ctx.lineTo(x + half, y + half - r);
  ctx.quadraticCurveTo(x + half, y + half, x + half - r, y + half);
  ctx.lineTo(x - half + r, y + half);
  ctx.quadraticCurveTo(x - half, y + half, x - half, y + half - r);
  ctx.lineTo(x - half, y - half + r);
  ctx.quadraticCurveTo(x - half, y - half, x - half + r, y - half);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2; ctx.stroke();
}

function drawDragGhost() {
  if (!drag || !drag.isDragging) return;
  const x = drag.currentX, y = drag.currentY;
  const t = drag.tower;
  const size = 70, half = size / 2;
  const targetSpot = findSpotAt(x, y);
  let targetValid = false, targetSwap = false, targetSpotPos = null;
  if (targetSpot && targetSpot !== drag.spot) {
    if (!targetSpot.tower) {
      targetValid = true;
      targetSpotPos = { x: targetSpot.x, y: targetSpot.y };
    } else if (canCombine(t, targetSpot.tower)) {
      targetValid = true;
      targetSpotPos = { x: targetSpot.x, y: targetSpot.y };
    } else {
      targetSwap = true;
      targetSpotPos = { x: targetSpot.x, y: targetSpot.y };
    }
  }
  if (targetSpotPos) {
    ctx.save();
    if (targetValid) { ctx.strokeStyle = '#2ecc71'; ctx.shadowColor = '#2ecc71'; }
    else if (targetSwap) { ctx.strokeStyle = '#f1c40f'; ctx.shadowColor = '#f1c40f'; }
    else { ctx.strokeStyle = '#e74c3c'; ctx.shadowColor = '#e74c3c'; }
    ctx.lineWidth = 4; ctx.shadowBlur = 12;
    ctx.strokeRect(targetSpotPos.x - half - 5, targetSpotPos.y - half - 5, size + 10, size + 10);
    ctx.restore();
  }
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.translate(x, y);
  ctx.fillStyle = '#00000088';
  ctx.fillRect(-half + 2, -half + 3, size, size);
  let color = '#ffffff';
  if (TOWER_TYPES[t.type]) color = TOWER_TYPES[t.type].color;
  ctx.fillStyle = color;
  ctx.fillRect(-half, -half, size, size);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  ctx.strokeRect(-half, -half, size, size);
  ctx.restore();
  drawTowerIcon(t.type, x, y, size);
}

// ============ 遊戲迴圈 ============
let statsTimer = 0;
let saveTimer = 0;

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;

  if (gameState !== 'playing') {
    requestAnimationFrame(gameLoop);
    return;
  }

  dt *= speedMultiplier;
  hasGoldTower = SPOTS.some(s => s.tower && s.tower.type === 'gold');
  recomputeBuffs();

  if (!gameOver) {
    if (waveActive) {
      spawnTimer += dt;
      while (spawnQueue.length > 0 && spawnQueue[0].delay <= spawnTimer) {
        const s = spawnQueue.shift();
        enemies.push(new Enemy(s.hp, s.speed, s.isBoss));
      }
      if (spawnQueue.length === 0 && enemies.filter(e => e.alive).length === 0) {
        waveActive = false;
        startWaveBtn.disabled = false;
        if (autoNext) autoNextTimer = 2.0;
        saveGame();

        // 通關判定
        const cfg = DIFFICULTIES[currentDifficulty];
        if (wave >= cfg.maxWave) {
          finishGame(true);
        }
      }
    } else if (autoNext && autoNextTimer > 0) {
      autoNextTimer -= dt;
      if (autoNextTimer <= 0) startWave();
    }

    for (const e of enemies) e.update(dt);
    for (const spot of SPOTS) {
      if (spot.tower) spot.tower.update(dt);
    }
    for (const b of bullets) b.update(dt);

    for (const e of enemies) {
      if (!e.alive) {
        if (e.reachedEnd) lives -= e.isBoss ? 10 : 1;
        else {
          money += e.isBoss ? 250 : 10;
          if (!e.isBoss) sfxCoin();
        }
        updateUI();
      }
    }
    enemies = enemies.filter(e => e.alive);
    bullets = bullets.filter(b => b.alive);

    if (lives <= 0 && !gameOver) {
      finishGame(false);
    }

    saveTimer += dt;
    if (saveTimer >= SAVE_INTERVAL) {
      saveTimer = 0;
      saveGame();
    }
  }

  updateTowerPanel();

  statsTimer += dt;
  if (statsTimer > 0.2) {
    statsTimer = 0;
    renderStats();
  }

  drawBackground();
  drawPath();
  for (const spot of SPOTS) drawSpot(spot);
  for (const spot of SPOTS) {
    if (spot.tower) spot.tower.draw();
  }
  for (const e of enemies) e.draw();
  for (const b of bullets) b.draw();
  drawDragGhost();

  const boss = enemies.find(e => e.isBoss && e.alive);
  if (boss) {
    bossBar.classList.add('show');
    bossHpEl.style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%';
  } else bossBar.classList.remove('show');

  requestAnimationFrame(gameLoop);
}

// ============ 初始化 ============
updateMenuRecords();
requestAnimationFrame(gameLoop);
</script>
