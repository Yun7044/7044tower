<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>塔防</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #game {
    position: fixed;
    display: block;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  /* ===== 主選單 ===== */
  #mainMenu {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at top, #1a1a4a 0%, transparent 60%),
      radial-gradient(ellipse at bottom, #2a1a3a 0%, transparent 60%),
      #05050f;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    z-index: 50;
    gap: 14px;
    overflow-y: auto;
  }
  #mainMenu.show { display: flex; }

  #mainMenu .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  #mainMenu .stars::before,
  #mainMenu .stars::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 20%, #fff, transparent),
      radial-gradient(1px 1px at 35% 85%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, #fff, transparent),
      radial-gradient(1px 1px at 15% 55%, #fff, transparent);
    background-size: 100% 100%;
    opacity: 0.5;
    animation: twinkle 4s ease-in-out infinite;
  }
  #mainMenu .stars::after {
    background-position: 50% 50%;
    animation-delay: 2s;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  #mainMenu h1 {
    position: relative;
    font-size: clamp(36px, 10vw, 56px);
    font-weight: 900;
    letter-spacing: 10px;
    background: linear-gradient(180deg, #ffe680 0%, #ffd700 40%, #ff8800 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
    margin-bottom: 8px;
    text-align: center;
  }
  #mainMenu .subtitle {
    position: relative;
    font-size: 12px;
    color: #888;
    letter-spacing: 4px;
    margin-bottom: 24px;
  }

  .diff-btn {
    position: relative;
    width: min(320px, 88vw);
    padding: 16px 20px;
    border-radius: 12px;
    background: rgba(20, 20, 40, 0.85);
    border: 2px solid #33335a;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: 0.2s;
    font-family: inherit;
    text-align: left;
  }
  .diff-btn:active { transform: scale(0.98); }
  .diff-btn:hover {
    border-color: #ffd700;
    transform: translateX(4px);
    box-shadow: 0 4px 24px rgba(255, 215, 0, 0.15);
  }
  .diff-btn .badge {
    font-size: 28px;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .diff-btn[data-difficulty="easy"] .badge {
    background: rgba(46, 204, 113, 0.15);
    border: 1px solid rgba(46, 204, 113, 0.4);
  }
  .diff-btn[data-difficulty="normal"] .badge {
    background: rgba(241, 196, 15, 0.15);
    border: 1px solid rgba(241, 196, 15, 0.4);
  }
  .diff-btn[data-difficulty="hard"] .badge {
    background: rgba(231, 76, 60, 0.15);
    border: 1px solid rgba(231, 76, 60, 0.4);
  }
  .diff-btn .info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .diff-btn .title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 2px;
  }
  .diff-btn .desc {
    font-size: 11px;
    color: #999;
    letter-spacing: 1px;
  }
  .diff-btn .record {
    font-size: 11px;
    color: #ffd700;
    font-weight: 700;
    margin-top: 2px;
  }
  .diff-btn[data-difficulty="easy"] { border-left: 5px solid #2ecc71; }
  .diff-btn[data-difficulty="normal"] { border-left: 5px solid #f1c40f; }
  .diff-btn[data-difficulty="hard"] { border-left: 5px solid #e74c3c; }

  .menu-action {
    position: relative;
    width: min(320px, 88vw);
    padding: 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3a3a5a 0%, #1a1a3a 100%);
    border: 2px solid #4a4a7a;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    transition: 0.2s;
    margin-top: 8px;
  }
  .menu-action:active { transform: scale(0.98); }
  .menu-action:hover {
    border-color: #ffd700;
    color: #ffd700;
  }

  /* ===== 排行榜 ===== */
  #leaderboardPanel {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at top, #1a1a4a 0%, transparent 60%),
      #05050f;
    display: none;
    flex-direction: column;
    padding: 20px;
    z-index: 60;
    overflow-y: auto;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  #leaderboardPanel.show { display: flex; }

  .lb-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    max-width: 500px;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
  }
  .lb-header h2 {
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(180deg, #ffe680, #ff8800);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
  }
  .lb-close {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(20, 20, 40, 0.9);
    border: 2px solid #33335a;
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    font-family: inherit;
    transition: 0.15s;
  }
  .lb-close:hover { border-color: #ffd700; color: #ffd700; }

  .lb-tabs {
    display: flex;
    gap: 8px;
    max-width: 500px;
    width: 100%;
    margin: 0 auto 14px;
  }
  .lb-tab {
    flex: 1;
    padding: 10px 6px;
    border-radius: 10px;
    background: #16162a;
    border: 2px solid #33335a;
    color: #ccc;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    transition: 0.15s;
  }
  .lb-tab.active {
    background: linear-gradient(180deg, #ffd700, #ff8800);
    color: #0a0a14;
    border-color: #ffd700;
    box-shadow: 0 0 16px rgba(255, 215, 0, 0.4);
  }

  .lb-list {
    max-width: 500px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .lb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(20, 20, 40, 0.6);
    border-radius: 10px;
    border-left: 4px solid #333;
  }
  .lb-row.rank-1 {
    border-left-color: #ffd700;
    background: linear-gradient(90deg, rgba(255, 215, 0, 0.12), rgba(20, 20, 40, 0.6));
    box-shadow: 0 0 12px rgba(255, 215, 0, 0.15);
  }
  .lb-row.rank-2 { border-left-color: #c0c0c0; }
  .lb-row.rank-3 { border-left-color: #cd7f32; }

  .lb-rank {
    font-size: 15px;
    font-weight: 900;
    width: 30px;
    text-align: center;
    color: #888;
    flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
  }
  .lb-row.rank-1 .lb-rank { color: #ffd700; }
  .lb-row.rank-2 .lb-rank { color: #d0d0d0; }
  .lb-row.rank-3 .lb-rank { color: #cd7f32; }

  .lb-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .lb-wave {
    font-weight: 800;
    color: #fff;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .lb-damage {
    font-size: 12px;
    color: #ffd700;
    font-variant-numeric: tabular-nums;
  }
  .lb-date {
    font-size: 10px;
    color: #666;
    text-align: right;
    flex: 0 0 auto;
  }

  .lb-empty {
    text-align: center;
    padding: 60px 20px;
    color: #555;
    font-size: 14px;
    letter-spacing: 2px;
  }
  .lb-empty .icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  /* ===== 遊戲 UI ===== */
  #topBar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    background: linear-gradient(to bottom, rgba(10,10,20,0.9), rgba(10,10,20,0));
    font-size: 13px; font-weight: 700;
    pointer-events: none; z-index: 10;
    padding-top: max(6px, env(safe-area-inset-top));
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .stat {
    background: rgba(12,12,28,0.75);
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 4px 8px;
    white-space: nowrap;
    backdrop-filter: blur(4px);
    flex: 0 0 auto;
  }
  .topBtn {
    flex: 0 0 auto;
    pointer-events: auto;
    background: rgba(12,12,28,0.9);
    border: 2px solid #555;
    color: #ccc;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .topBtn.active {
    background: rgba(241, 196, 15, 0.15);
    border-color: #ffd700;
    color: #ffd700;
    box-shadow: 0 0 12px #ffd70066;
  }
  #statsBtn { margin-left: auto; }
  #speedBtn.active {
    background: rgba(46, 204, 113, 0.15);
    border-color: #2ecc71;
    color: #2ecc71;
    box-shadow: 0 0 12px #2ecc7166;
  }
  #muteBtn.active {
    background: rgba(192, 57, 43, 0.15);
    border-color: #e74c3c;
    color: #e74c3c;
    box-shadow: 0 0 12px #e74c3c66;
  }
  #musicBtn.active {
    background: rgba(192, 57, 43, 0.15);
    border-color: #e74c3c;
    color: #e74c3c;
  }
  #emuBtn.active {
    background: rgba(155, 89, 182, 0.15);
    border-color: #9b59b6;
    color: #9b59b6;
    box-shadow: 0 0 12px #9b59b666;
  }
  #removeBtn.active {
    background: rgba(192, 57, 43, 0.9);
    border-color: #e74c3c;
    color: #fff;
    box-shadow: 0 0 12px #e74c3c;
  }

  #bottomBar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 4px;
    padding: 6px 8px;
    background: linear-gradient(to top, rgba(10,10,20,0.95), rgba(10,10,20,0.6));
    padding-bottom: max(6px, env(safe-area-inset-bottom));
    z-index: 10; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
  }
  #bottomBar::-webkit-scrollbar { display: none; }

  .shop-btn {
    flex: 0 0 auto; width: 52px; height: 46px;
    border-radius: 8px;
    background: #16162a;
    border: 2px solid #33335a;
    color: #ccc; font-size: 11px; font-weight: 700;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px; transition: 0.12s; padding: 0;
    font-family: inherit;
  }
  .shop-btn .dot {
    width: 14px; height: 14px;
    border-radius: 4px;
    border: 1px solid #00000066;
  }
  .shop-btn .price { font-size: 10px; color: #ffd700; }
  .shop-btn.selected {
    border-color: #ffd700;
    box-shadow: 0 0 10px #ffd70088;
    background: #22224a;
  }
  .shop-btn.locked { opacity: 0.3; cursor: not-allowed; }
  .shop-btn[data-type="white"]     .dot { background: #f0f0f0; }
  .shop-btn[data-type="green"]     .dot { background: #2ecc71; }
  .shop-btn[data-type="blue"]      .dot { background: #3498db; }
  .shop-btn[data-type="purple"]    .dot { background: #9b59b6; }
  .shop-btn[data-type="orange"]    .dot { background: #e67e22; }
  .shop-btn[data-type="silver"]    .dot { background: linear-gradient(135deg, #f0f0f0, #808080); }
  .shop-btn[data-type="amethyst"]  .dot { background: #B088FF; }
  .shop-btn[data-type="jade"]      .dot { background: #66FF66; }
  .shop-btn[data-type="magenta"]   .dot { background: #FF33CC; }
  .shop-btn[data-type="fireArrow"] .dot { background: #FF4500; }

  @keyframes unlockFlash {
    0%, 100% { box-shadow: 0 0 0 0 #ffd700; border-color: #33335a; }
    50% { box-shadow: 0 0 20px 4px #ffd700; border-color: #ffd700; }
  }
  .shop-btn.just-unlocked {
    animation: unlockFlash 0.6s ease-in-out 3;
  }

  #startWave {
    flex: 0 0 auto;
    background: #e67e22; color: #fff;
    border: none; border-radius: 8px;
    padding: 0 14px; height: 46px;
    font-weight: 700; font-size: 13px;
    cursor: pointer; transition: 0.15s;
    white-space: nowrap;
    font-family: inherit;
  }
  #startWave:disabled { opacity: 0.4; }

  .auto-toggle {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 4px;
    font-size: 12px; color: #bbb;
    padding: 6px 8px; height: 46px;
    border-radius: 8px;
    background: #16162a;
    border: 1px solid #33335a;
    cursor: pointer; white-space: nowrap;
  }
  .auto-toggle.active { border-color: #2ecc71; color: #2ecc71; }
  .auto-toggle input { width: 16px; height: 16px; }

  #log {
    position: fixed; bottom: 62px; left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    background: rgba(12, 12, 28, 0.95);
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    padding: 6px 14px;
    pointer-events: none; opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap; z-index: 20;
    max-width: 90vw;
    overflow: hidden; text-overflow: ellipsis;
  }
  #log.show { opacity: 1; }

  #statsPanel {
    position: fixed;
    top: 42px;
    right: 10px;
    width: 230px;
    max-height: 70vh;
    overflow-y: auto;
    background: rgba(12, 12, 28, 0.96);
    border: 2px solid #ffd700;
    border-radius: 10px;
    padding: 10px 12px;
    z-index: 15;
    box-shadow: 0 0 24px rgba(255, 215, 0, 0.35);
    font-size: 12px;
    padding-top: max(10px, calc(env(safe-area-inset-top) + 40px));
  }
  #statsPanel.hidden { display: none; }
  #statsPanel .stats-title {
    font-size: 13px;
    font-weight: 700;
    color: #ffd700;
    margin-bottom: 8px;
    text-align: center;
    letter-spacing: 1px;
  }
  #statsPanel .stats-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    border-bottom: 1px solid #1a1a2e;
  }
  #statsPanel .stats-row:last-child { border-bottom: none; }
  #statsPanel .stats-dot {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex: 0 0 auto;
    border: 1px solid #00000055;
  }
  #statsPanel .stats-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #statsPanel .stats-num {
    color: #ffd700;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  #statsPanel .stats-pct {
    color: #888;
    font-size: 10px;
    width: 38px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #statsPanel .stats-total {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 2px solid #ffd70055;
    font-weight: 700;
    text-align: right;
    color: #ffd700;
  }

  #bossBar {
    position: fixed; top: 42px; left: 50%;
    transform: translateX(-50%);
    width: min(420px, 70vw);
    background: rgba(12, 12, 28, 0.92);
    border: 2px solid #8B4513;
    border-radius: 8px;
    padding: 4px 8px;
    pointer-events: none; display: none;
    box-shadow: 0 0 16px rgba(139, 69, 19, 0.6);
    z-index: 5;
    padding-top: max(4px, calc(env(safe-area-inset-top) + 30px));
  }
  #bossBar.show { display: block; }
  #bossBar .label {
    font-size: 10px; font-weight: 700;
    color: #ffd700; text-align: center;
    margin-bottom: 3px; letter-spacing: 2px;
  }
  #bossBar .bar-bg {
    width: 100%; height: 8px;
    background: #000; border-radius: 4px;
    overflow: hidden;
  }
  #bossBar .bar-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #8B4513, #d35400);
    transition: width 0.1s;
  }

  #goldBanner {
    position: fixed; top: 45%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    font-size: clamp(24px, 6vw, 42px);
    font-weight: 900; color: #ffd700;
    text-shadow: 0 0 30px #ffd700, 0 0 60px #ffaa00;
    letter-spacing: 4px;
    pointer-events: none; opacity: 0;
    transition: opacity 0.4s, transform 0.4s;
    white-space: nowrap; z-index: 20;
  }
  #goldBanner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #towerPanel {
    position: fixed; top: 42px; left: 50%;
    transform: translateX(-50%);
    background: rgba(12, 12, 28, 0.96);
    border: 2px solid #ffd700;
    border-radius: 10px;
    padding: 8px 14px;
    display: flex; align-items: center; gap: 12px;
    pointer-events: auto; z-index: 10;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    font-size: 12px;
    padding-top: max(8px, calc(env(safe-area-inset-top) + 34px));
    max-width: 90vw;
  }
  #towerPanel.hidden { display: none; }
  #towerInfo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  #towerName { font-weight: 700; font-size: 13px; }
  #towerStats { font-size: 11px; color: #aaa; line-height: 1.5; white-space: pre-line; }
  #towerStats .up { color: #2ecc71; }
  #towerStats .same { color: #666; }
  #upgradeBtn {
    background: #f1c40f; color: #0a0a14;
    border: none; border-radius: 6px;
    padding: 8px 14px;
    font-weight: 700; cursor: pointer;
    font-size: 12px;
    flex: 0 0 auto;
    font-family: inherit;
  }
  #upgradeBtn:disabled { opacity: 0.4; }

  #confirmModal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  #confirmModal.show { display: flex; }
  #confirmBox {
    background: rgba(20, 20, 40, 0.98);
    border: 2px solid #ffd700;
    border-radius: 12px;
    padding: 20px 24px;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
  }
  #confirmBox .modal-title {
    font-size: 16px; font-weight: 700;
    color: #ffd700;
    margin-bottom: 10px;
  }
  #confirmBox .modal-text {
    font-size: 13px; color: #ccc;
    line-height: 1.6;
    margin-bottom: 18px;
  }
  #confirmBox .modal-btns {
    display: flex; gap: 10px; justify-content: center;
  }
  #confirmBox button {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  #confirmBox .btn-cancel {
    background: #333; color: #ccc;
  }
  #confirmBox .btn-confirm {
    background: #e74c3c; color: #fff;
  }

  #victoryModal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  #victoryModal.show { display: flex; }
  #victoryBox {
    background: linear-gradient(180deg, rgba(40, 30, 10, 0.98), rgba(20, 20, 40, 0.98));
    border: 2px solid #ffd700;
    border-radius: 16px;
    padding: 26px 24px;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
  }
  #victoryBox .v-title {
    font-size: 24px; font-weight: 900;
    background: linear-gradient(180deg, #ffe680, #ff8800);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 6px;
    margin-bottom: 16px;
  }

  const dispW = BASE_W * scale;
  const dispH = BASE_H * scale;
  canvas.style.width = dispW + 'px';
  canvas.style.height = dispH + 'px';
  canvas.style.left = ((winW - dispW) / 2) + 'px';
  canvas.style.top = ((winH - dispH) / 2) + 'px';
}
window.addEventListener('resize', resize);

let audioCtx = null;
let muted = false;
let musicEnabled = true;
let musicStarted = false;
let musicGain = null;

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.35;
      musicGain.connect(audioCtx.destination);
    } catch (e) {
      audioCtx = null;
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().then(() => {
      if (musicEnabled && !musicStarted && gameState === 'playing') {
        musicStarted = true;
        startBgm();
      }
    }).catch(() => {});
  } else if (audioCtx && audioCtx.state === 'running' && musicEnabled && !musicStarted && gameState === 'playing') {
    musicStarted = true;
    startBgm();
  }
}

function playTone(opts) {
  if (!audioCtx || muted) return;
  const {
    freq = 440, slideTo = null, duration = 0.1,
    type = 'sine', volume = 0.3, delay = 0,
  } = opts;
  try {
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
  } catch (e) {}
}

const throttleMap = {};
function throttled(key, ms, fn) {
  const now = performance.now();
  if (throttleMap[key] && now - throttleMap[key] < ms) return;
  throttleMap[key] = now;
  fn();
}

function sfxShoot() { throttled('s', 60, () => playTone({ freq: 900, duration: 0.05, type: 'square', volume: 0.18 })); }

// ============ 背景音樂 ============
const BGM_TEMPO = 0.32;
const BGM_LOOKAHEAD = 0.12;
const BGM_INTERVAL = 25;

const NOTES = {
  A2: 110.00, F2: 87.31, C3: 130.81, G2: 98.00,
  A3: 220.00, C4: 261.63, E4: 329.63, G4: 392.00, B4: 493.88,
  F3: 174.61, D4: 293.66, D5: 587.33, F4: 349.23, G3: 196.00,
};

const BGM_MELODY = [
  'A3','E4','A3','E4','A3','E4','A3','E4',
  'F3','C4','F3','C4','F3','C4','F3','C4',
  'C4','G4','C4','G4','C4','G4','C4','G4',
  'G3','D4','G3','D4','G3','D4','G3','D4',
];
const BGM_BASS = ['A2', 'F2', 'C3', 'G2'];

let bgmPlaying = false;
let bgmTimer = null;
let bgmNextTime = 0;
let bgmStep = 0;

function scheduleBgmNote(freq, time, duration, volume, type) {
  if (!audioCtx || !musicGain) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(volume, time + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
    osc.connect(gain);
    gain.connect(musicGain);
    osc.start(time);
    osc.stop(time + duration + 0.05);
  } catch (e) {}
}

function bgmScheduler() {
  if (!audioCtx || !bgmPlaying) return;
  if (document.hidden) return;
  const horizon = audioCtx.currentTime + BGM_LOOKAHEAD;
  while (bgmNextTime < horizon) {
    const step = bgmStep % 32;
    const bar = Math.floor(step / 8);
    const melodyNote = BGM_MELODY[step];
    if (melodyNote && NOTES[melodyNote]) {
      scheduleBgmNote(NOTES[melodyNote], bgmNextTime, 0.45, 0.28, 'triangle');
    }
    if (step % 4 === 0) {
      const bassNote = BGM_BASS[bar];
      if (bassNote && NOTES[bassNote]) {
        scheduleBgmNote(NOTES[bassNote], bgmNextTime, 1.2, 0.45, 'sine');
      }
    }
    bgmNextTime += BGM_TEMPO;
    bgmStep++;
  }
}

function startBgm() {
  if (bgmPlaying || !audioCtx || muted) return;
  bgmPlaying = true;
  bgmNextTime = audioCtx.currentTime + 0.1;
  bgmStep = 0;
  if (bgmTimer) clearInterval(bgmTimer);
  bgmTimer = setInterval(bgmScheduler, BGM_INTERVAL);
}

function stopBgm() {
  if (!bgmPlaying) return;
  bgmPlaying = false;
  if (bgmTimer) clearInterval(bgmTimer);
  bgmTimer = null;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopBgm();

// ============ 塔位 ============
const ROW_Y = [80, 240, 400];
const COL_X = [130, 290, 450, 610, 770];
const SPOT_SIZE = 90;

const SPOTS = [];
for (let r = 0; r < 3; r++) {
  for (let c = 0; c < 5; c++) {
    SPOTS.push({
      col: c, row: r,
      x: COL_X[c], y: ROW_Y[r],
      tower: null, special: null,
    });
  }
}
SPOTS[10].special = 'glow';
SPOTS[13].special = 'void';
SPOTS[14].special = 'void';

function getAdjacentSpots(spot) {
  const result = [];
  for (const other of SPOTS) {
    if (other === spot) continue;
    const dr = Math.abs(other.row - spot.row);
    const dc = Math.abs(other.col - spot.col);
    if (dr <= 1 && dc <= 1) result.push(other);
  }
  return result;
}

// ============ 路徑 ============
const PATH = [
  { x: -40, y: 400 }, { x: 60,  y: 400 }, { x: 60,  y: 160 },
  { x: 370, y: 160 }, { x: 370, y: 480 }, { x: 940, y: 480 },
];

const PATH_SEGMENTS = [];
let PATH_TOTAL = 0;
for (let i = 0; i < PATH.length - 1; i++) {
  const a = PATH[i], b = PATH[i + 1];
  const len = Math.hypot(b.x - a.x, b.y - a.y);
  PATH_SEGMENTS.push({ a, b, len, start: PATH_TOTAL });
  PATH_TOTAL += len;
}

function getPosOnPath(distance) {
  if (distance <= 0) {
    const a = PATH[0], b = PATH[1];
    return { x: a.x, y: a.y, angle: Math.atan2(b.y - a.y, b.x - a.x) };
  }
  if (distance >= PATH_TOTAL) {
    const a = PATH[PATH.length - 2], b = PATH[PATH.length - 1];
    return { x: b.x, y: b.y, angle: Math.atan2(b.y - a.y, b.x - a.x) };
  }
  for (const seg of PATH_SEGMENTS) {
    if (distance <= seg.start + seg.len) {
      const t = (distance - seg.start) / seg.len;
      return {
        x: seg.a.x + (seg.b.x - seg.a.x) * t,
        y: seg.a.y + (seg.b.y - seg.a.y) * t,
        angle: Math.atan2(seg.b.y - seg.a.y, seg.b.x - seg.a.x),
      };
    }
  }
  return { x: PATH[PATH.length - 1].x, y: PATH[PATH.length - 1].y, angle: 0 };
}

let logTimer = null;
function log(msg, ms = 2200) {
  logEl.textContent = msg;
  logEl.classList.add('show');
  clearTimeout(logTimer);
  logTimer = setTimeout(() => logEl.classList.remove('show'), ms);
}

function updateUI() {
  moneyEl.textContent = Math.floor(money);
  livesEl.textContent = lives;
  waveEl.textContent = wave;
  towerCountEl.textContent = SPOTS.filter(s => s.tower).length;
}

function getUpgradeCost(tower) {
  const baseCost = TOWER_TYPES[tower.type].baseCost || 50;
  return Math.floor(baseCost * tower.level * 1.5);
}

// ============ 排行榜系統 ============
function getLeaderboard() {
  try {
    const raw = localStorage.getItem(LEADERBOARD_KEY);
    if (!raw) return { easy: [], normal: [], hard: [] };
    const data = JSON.parse(raw);
    if (!data.easy) data.easy = [];
    if (!data.normal) data.normal = [];
    if (!data.hard) data.hard = [];
    return data;
  } catch (e) {
    return { easy: [], normal: [], hard: [] };
  }
}

function saveLeaderboard(lb) {
  try {
    localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(lb));
  } catch (e) {}
}

function recordScore(difficulty, waveReached, totalDamage, towerStats, didVictory) {
  const lb = getLeaderboard();
  if (!lb[difficulty]) lb[difficulty] = [];
  lb[difficulty].push({
    date: Date.now(),
    wave: waveReached,
    damage: Math.floor(totalDamage),
    towerStats: towerStats || {},
    victory: !!didVictory,
  });
  lb[difficulty].sort((a, b) => {
    if (b.wave !== a.wave) return b.wave - a.wave;
    return b.damage - a.damage;
  });
  lb[difficulty] = lb[difficulty].slice(0, LEADERBOARD_MAX);
  saveLeaderboard(lb);
}

function getBestRecord(difficulty) {
  const lb = getLeaderboard();
  const list = lb[difficulty] || [];
  if (list.length === 0) return null;
  return list[0];
}

function updateMenuRecords() {
  for (const diff of ['easy', 'normal', 'hard']) {
    const rec = getBestRecord(diff);
    const el = $('rec' + diff.charAt(0).toUpperCase() + diff.slice(1));
    if (!el) continue;
    if (!rec) {
      el.textContent = '尚無紀錄';
    } else {
      const v = rec.victory ? ' 👑' : '';
      el.textContent = `最佳：第 ${rec.wave} 波 ｜ 傷害 ${formatNum(rec.damage)}${v}`;
    }
  }
}

function formatNum(n) {
  n = Math.floor(n);
  if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n.toString();
}

function formatDate(ts) {
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  return `${y}/${m}/${day} ${h}:${min}`;
}

let lbCurrentTab = 'easy';

function renderLeaderboard() {
  const lb = getLeaderboard();
  const list = lb[lbCurrentTab] || [];

  if (list.length === 0) {
    lbList.innerHTML = `
      <div class="lb-empty">
        <div class="icon">🏆</div>
        <div>還沒有紀錄</div>
        <div style="font-size:12px;margin-top:6px;color:#444;">去挑戰一下吧</div>
      </div>
    `;
    return;
  }

  let html = '';
  for (let i = 0; i < list.length; i++) {
    const rec = list[i];
    const rank = i + 1;
    const crown = rec.victory ? ' 👑' : '';
    const cls = rank <= 3 ? ` rank-${rank}` : '';
    html += `
      <div class="lb-row${cls}">
        <div class="lb-rank">${rank}</div>
        <div class="lb-info">
          <div class="lb-wave">第 ${rec.wave} 波${crown}</div>
          <div class="lb-damage">傷害 ${formatNum(rec.damage)}</div>
        </div>
        <div class="lb-date">${formatDate(rec.date)}</div>
      </div>
    `;
  }
  lbList.innerHTML = html;
}

// ============ 存檔系統 ============
function getSaveKey() {
  return SAVE_KEY_PREFIX + (currentDifficulty || 'default');
}

function saveGame() {
  if (!currentDifficulty || gameState !== 'playing') return;
  try {
    const towerData = [];
    for (let i = 0; i < SPOTS.length; i++) {
      const s = SPOTS[i];
      if (s.tower) towerData.push({ idx: i, type: s.tower.type, level: s.tower.level });
    }
    const data = {
      version: 1,
      difficulty: currentDifficulty,
      money, lives, wave,
      damageStats,
      unlocked: Object.assign({}, unlocked),
      towers: towerData,
      timestamp: Date.now(),
    };
    localStorage.setItem(getSaveKey(), JSON.stringify(data));
  } catch (e) {}
}

function loadGame() {
  if (!currentDifficulty) return false;
  try {
    const raw = localStorage.getItem(getSaveKey());
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || data.version !== 1) return false;
    if (data.difficulty !== currentDifficulty) return false;
    if (data.wave === 0) return false;

    money = data.money ?? DIFFICULTIES[currentDifficulty].startMoney;
    lives = data.lives ?? DIFFICULTIES[currentDifficulty].startLives;
    wave = data.wave ?? 0;
    damageStats = data.damageStats || {};

    if (data.unlocked) {
      for (const k in data.unlocked) {
        if (unlocked.hasOwnProperty(k)) unlocked[k] = data.unlocked[k];
      }
    }

    for (const s of SPOTS) s.tower = null;
    for (const t of (data.towers || [])) {
      const spot = SPOTS[t.idx];
      if (!spot) continue;
      const tower = createTower(spot, t.type);
      if (!tower) continue;
      tower.level = Math.min(t.level || 1, MAX_TOWER_LEVEL);
      if (tower.applyLevel) tower.applyLevel();
      spot.tower = tower;
    }

    for (const type in unlocked) {
      const btn = document.querySelector(`.shop-btn[data-type="${type}"]`);
      if (!btn) continue;
      if (unlocked[type]) btn.classList.remove('locked');
      else btn.classList.add('locked');
    }

    updateUI();
    return true;
  } catch (e) {
    return false;
  }
}

function clearSave() {
  if (!currentDifficulty) return;
  try { localStorage.removeItem(getSaveKey()); } catch (e) {}
}

function hasSave(difficulty) {
  try {
    const raw = localStorage.getItem(SAVE_KEY_PREFIX + difficulty);
    if (!raw) return false;
    const data = JSON.parse(raw);
    return data && data.wave > 0;
  } catch (e) { return false; }
}

// ============ 遊戲開始/結束 ============
function startGame(difficulty) {
  currentDifficulty = difficulty;
  const cfg = DIFFICULTIES[difficulty];

  money = cfg.startMoney;
  lives = cfg.startLives;
  wave = 0;
  enemies = [];
  bullets = [];
  waveActive = false;
  spawnQueue = [];
  spawnTimer = 0;
  gameOver = false;
  victory = false;
  damageStats = {};
  comboSequence = [];
  selectedTower = null;
  shopSelected = null;
  removeMode = false;
  speedMultiplier = 1;
  autoNext = false;
  autoNextTimer = 0;
  drag = null;

  unlocked = Object.assign({}, DEFAULT_UNLOCKED);

  for (const s of SPOTS) s.tower = null;
  for (const type in unlocked) {
    const btn = document.querySelector(`.shop-btn[data-type="${type}"]`);
    if (!btn) continue;
    btn.classList.toggle('locked', !unlocked[type]);
    btn.classList.remove('selected');
  }

  speedBtn.textContent = '⏩ x1';
  speedBtn.classList.remove('active');
  removeBtn.classList.remove('active');
  autoToggle.classList.remove('active');
  autoNextEl.checked = false;
  statsVisible = false;
  statsPanel.classList.add('hidden');
  statsBtn.classList.remove('active');

  gameState = 'playing';
  mainMenu.classList.remove('show');
  leaderboardPanel.classList.remove('show');
  document.body.classList.remove('in-menu');

  updateUI();

  const loaded = loadGame();
  if (loaded) {
    log(`已載入存檔（第 ${wave} 波）`, 2500);
  } else {
    log(`${cfg.label}模式 開始！`, 2000);
  }

  if (musicEnabled && !muted && audioCtx) {
    musicStarted = true;
    startBgm();
  }
}

function backToMenu() {
  gameState = 'menu';
  stopBgm();
  saveGame();
  mainMenu.classList.add('show');
  document.body.classList.add('in-menu');
  towerPanel.classList.add('hidden');
  bossBar.classList.remove('show');
  statsPanel.classList.add('hidden');
  victoryModal.classList.remove('show');
  updateMenuRecords();
}

function finishGame(didVictory) {
  if (gameOver) return;
  gameOver = true;
  victory = didVictory;

  let totalDamage = 0;
  for (const k in damageStats) totalDamage += damageStats[k];

  recordScore(currentDifficulty, wave, totalDamage, Object.assign({}, damageStats), didVictory);
  clearSave();

  stopBgm();
  if (didVictory) sfxVictory();
  else sfxGameOver();

  const cfg = DIFFICULTIES[currentDifficulty];
  $('vTitle').textContent = didVictory ? '🎉 通關！' : '💀 遊戲結束';
  $('vMode').textContent = cfg.label + '模式';
  $('vWave').textContent = `第 ${wave} 波`;
  $('vDamage').textContent = formatNum(totalDamage);

  setTimeout(() => {
    victoryModal.classList.add('show');
  }, 400);
}

// ============ 升級數值預覽 ============
function fmt(n, digits = 1) {
  if (!isFinite(n)) return '∞';
  return n.toFixed(digits).replace(/\.0+$/, '');
}

function previewLine(label, cur, next, unit = '', digits = 1) {
  const curStr = fmt(cur, digits) + unit;
  if (next === null || next === undefined || Math.abs(next - cur) < 0.001) {
    return `${label}：${curStr} <span class="same">(不變)</span>`;
  }
  const diff = next - cur;
  const sign = diff > 0 ? '+' : '';
  return `${label}：${curStr} → ${fmt(next, digits)}${unit} <span class="up">(${sign}${fmt(diff, digits)})</span>`;
}

function getTowerPreviewHTML(tower) {
  const cfg = TOWER_TYPES[tower.type];
  const lv = tower.level;
  const nl = lv + 1;
  const maxed = lv >= MAX_TOWER_LEVEL;
  let lines = [];

  if (tower.critRateBonus !== undefined && (tower.critRate > 0 || tower.critDmgBonus > 0)) {
    lines.push(`爆擊：${(tower.critRate * 100).toFixed(0)}% / ${(tower.critDamage * 100).toFixed(0)}%`);
  }

  if (tower.type === 'silver') {
    const dmg = cfg.baseDamage * (1 + (lv - 1) * 0.25);
    lines.push(`每發傷害：${fmt(dmg, 1)}`);
    lines.push(`同時發射：${lv} 發`);
    lines.push(`成長：${tower.attackCount}/${cfg.attacksPerLevel} 次 (自動)`);
    lines.push(`距離降等：${(cfg.decayTime - tower.idleTimer).toFixed(1)}s`);
    return lines.join('\n');
  }
  if (tower.type === 'magenta') {
    lines.push(`倒數：${Math.max(0, tower.timer).toFixed(1)}s`);
    lines.push(`成功：${(cfg.successRate * 100).toFixed(0)}%`);
    lines.push(`效果：隨機塔 +${cfg.levelBoost} 級`);
    return lines.join('\n');
  }
  if (tower.type === 'orange') {
    const curDps = cfg.dps * Math.pow(1.5, lv - 1);
    const nextDps = cfg.dps * Math.pow(1.5, nl - 1);
    const curBeams = cfg.beamCount + (lv - 1);
    const nextBeams = cfg.beamCount + (nl - 1);
    lines.push(maxed ? `DPS：${fmt(curDps, 0)}（MAX）` : previewLine('DPS', curDps, nextDps, '', 0));
    lines.push(maxed ? `目標數：${curBeams}` : previewLine('目標數', curBeams, nextBeams, '', 0));
    return lines.join('\n');
  }
  if (tower.type === 'red') {
    const curT = cfg.buffTargets + (lv - 1);
    const nextT = cfg.buffTargets + (nl - 1);
    const curD = cfg.buffDuration + (lv - 1) * 2;
    const nextD = cfg.buffDuration + (nl - 1) * 2;
    const curI = Math.max(2, cfg.buffInterval - (lv - 1) * 0.5);
    const nextI = Math.max(2, cfg.buffInterval - (nl - 1) * 0.5);
    lines.push(maxed ? `目標數：${curT}` : previewLine('目標數', curT, nextT, '', 0));
    lines.push(maxed ? `持續：${curD}s` : previewLine('持續', curD, nextD, 's'));
    lines.push(maxed ? `間隔：${curI}s` : previewLine('間隔', curI, nextI, 's'));
    return lines.join('\n');
  }
  if (tower.type === 'fireArrow') {
    const curDmg = cfg.damage * Math.pow(1.5, lv - 1);
    const nextDmg = cfg.damage * Math.pow(1.5, nl - 1);
    lines.push(maxed ? `傷害：${fmt(curDmg, 2)}` : previewLine('傷害', curDmg, nextDmg, '', 2));
    lines.push('小怪：每 10 秒 1 發');
    lines.push('Boss：100 發/秒');
    return lines.join('\n');
  }

  if (cfg.damage !== undefined) {
    const curDmg = cfg.damage * Math.pow(1.5, lv - 1);
    const nextDmg = cfg.damage * Math.pow(1.5, nl - 1);
    lines.push(maxed ? `傷害：${fmt(curDmg, 1)}` : previewLine('傷害', curDmg, nextDmg, '', 1));
  }
  if (cfg.fireInterval !== undefined) {
    const curI = cfg.fireInterval * Math.pow(0.88, lv - 1);
    const nextI = cfg.fireInterval * Math.pow(0.88, nl - 1);
    lines.push(maxed ? `攻速：${fmt(curI, 2)}s` : previewLine('攻速', curI, nextI, 's', 2));
  }
  if (cfg.range !== undefined && isFinite(cfg.range)) {
    const curR = cfg.range + 20 * (lv - 1);
    const nextR = cfg.range + 20 * nl - 20;
    lines.push(maxed ? `射程：${fmt(curR / 90, 1)} 格` : previewLine('射程', curR / 90, nextR / 90, ' 格'));
  }
  if (tower.type === 'white') lines.push(`秒殺：${(cfg.killChance * 100).toFixed(0)}% (不變)`);
  if (tower.type === 'blue') lines.push(`命中：5% (不變) ｜ 命中即秒殺`);
  if (tower.type === 'purple') lines.push(`緩速：${(100 - cfg.slowFactor * 100).toFixed(0)}% 持續 ${cfg.slowDuration}s`);
  if (tower.type === 'cyan') lines.push(`對 Boss 傷害 ×${cfg.antiBossMultiplier}`);
  if (tower.type === 'amethyst') lines.push(`增益：周圍 +${(cfg.critRateBuff * 100).toFixed(0)}% 爆擊率`);
  if (tower.type === 'jade') lines.push(`增益：周圍 +${(cfg.critDmgBuff * 100).toFixed(0)}% 爆擊傷害`);
  return lines.join('\n');
}

function updateTowerPanel() {
  if (gameState !== 'playing') {
    towerPanel.classList.add('hidden');
    return;
  }
  if (!selectedTower || !SPOTS.some(s => s.tower === selectedTower)) {
    towerPanel.classList.add('hidden');
    return;
  }
  towerPanel.classList.remove('hidden');
  const cfg = TOWER_TYPES[selectedTower.type];
  towerName.textContent = `${cfg.name} Lv.${selectedTower.level}`;
  towerStats.innerHTML = getTowerPreviewHTML(selectedTower);

  if (selectedTower.type === 'magenta') {
    upgradeBtn.disabled = true;
    upgradeBtn.textContent = '不可升級';
    return;
  }
  if (selectedTower.type === 'silver') {
    upgradeBtn.disabled = true;
    upgradeBtn.textContent = '自動成長';
    return;
  }
  if (selectedTower.level >= MAX_TOWER_LEVEL) {
    upgradeBtn.disabled = true;
    upgradeBtn.textContent = 'MAX';
  } else {
    const cost = getUpgradeCost(selectedTower);
    upgradeBtn.disabled = money < cost;
    upgradeBtn.textContent = `升級 ${cost}`;
  }
}

function upgradeTower(tower) {
  if (!tower || tower.level >= MAX_TOWER_LEVEL) return;
  if (tower.type === 'silver' || tower.type === 'magenta') return;
  const cost = getUpgradeCost(tower);
  if (money < cost) { log('金幣不足'); return; }
  money -= cost;
  tower.level++;
  if (tower.applyLevel) tower.applyLevel();
  sfxUpgrade();
  updateUI();
  updateTowerPanel();
  log(`${TOWER_TYPES[tower.type].name} → Lv.${tower.level}`);
  saveGame();
}

// ============ 增益重算 ============
function recomputeBuffs() {
  for (const spot of SPOTS) {
    if (spot.tower) {
      spot.tower.critRateBonus = 0;
      spot.tower.critDmgBonus = 0;
    }
  }
  for (const spot of SPOTS) {
    if (!spot.tower) continue;
    const t = spot.tower;
    if (t.type === 'amethyst') {
      const buff = TOWER_TYPES.amethyst.critRateBuff;
      for (const n of getAdjacentSpots(spot)) {
        if (n.tower && n.tower !== t) n.tower.critRateBonus += buff;
      }
    } else if (t.type === 'jade') {
      const buff = TOWER_TYPES.jade.critDmgBuff;
      for (const n of getAdjacentSpots(spot)) {
        if (n.tower && n.tower !== t) n.tower.critDmgBonus += buff;
      }
    }
  }
}

// ============ 敵人 ============
class Enemy {
  constructor(hp, speed, isBoss = false) {
    this.hp = hp;
    this.maxHp = hp;
    this.baseSpeed = speed;
    this.slowFactor = 1;
    this.slowTimer = 0;
    this.distance = 0;
    this.alive = true;
    this.reachedEnd = false;
    this.isBoss = isBoss;
    this.elapsed = 0;
    this.damageReduction = isBoss ? 0.4 : 0;
  }
  takeDamage(amount) {
    const actual = amount * (1 - this.damageReduction);
    this.hp -= actual;
    if (this.hp <= 0) this.alive = false;
    return actual;
  }
  update(dt) {
    if (!this.alive) return;
    if (this.hp <= 0) { this.alive = false; return; }
    this.elapsed += dt;
    let rageMultiplier = 1;
    if (this.isBoss) rageMultiplier = Math.min(2.2, 1 + this.elapsed * 0.025);
    if (this.slowTimer > 0) {
      this.slowTimer -= dt;
      if (this.slowTimer <= 0) this.slowFactor = 1;
    }
    let effSlow = this.slowFactor;
    if (this.isBoss) effSlow = 1 - (1 - this.slowFactor) * 0.5;
    let speed = this.baseSpeed * effSlow * rageMultiplier;
    if (hasGoldTower) {
      speed += TOWER_TYPES.gold.conveyorSpeed * (this.isBoss ? TOWER_TYPES.gold.conveyorBossFactor : 1);
    }
    this.distance += speed * dt;
    if (this.distance >= PATH_TOTAL) { this.alive = false; this.reachedEnd = true; }
    if (this.distance < 0) this.distance = 0;
  }
  getPos() { return getPosOnPath(this.distance); }
  draw() {
    if (!this.alive) return;
    const p = this.getPos();
    const r = this.isBoss ? 22 : 13;
    if (this.isBoss && this.elapsed > 1) {
      const rage = Math.min(1, (this.elapsed - 1) / 20);
      const glow = 0.3 + 0.4 * Math.sin(this.elapsed * 6) * rage;
      ctx.fillStyle = `rgba(231, 76, 60, ${glow})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 10, 0, Math.PI * 2); ctx.fill();
    }
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    if (this.isBoss) { grad.addColorStop(0, '#c68642'); grad.addColorStop(1, '#5a2e0a'); }
    else { grad.addColorStop(0, '#ff7675'); grad.addColorStop(1, '#c0392b'); }
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    if (this.isBoss) {
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#ffd700';
      const crownY = p.y - r - 5, cw = r * 1.2;
      ctx.beginPath();
      ctx.moveTo(p.x - cw/2, crownY); ctx.lineTo(p.x - cw/2, crownY - 7);
      ctx.lineTo(p.x - cw/4, crownY - 2); ctx.lineTo(p.x, crownY - 10);
      ctx.lineTo(p.x + cw/4, crownY - 2); ctx.lineTo(p.x + cw/2, crownY - 7);
      ctx.lineTo(p.x + cw/2, crownY); ctx.closePath(); ctx.fill();
    }
    if (this.slowTimer > 0) {
      ctx.strokeStyle = 'rgba(155, 89, 182, 0.85)';
      ctx.lineWidth = this.isBoss ? 3 : 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 3, 0, Math.PI * 2); ctx.stroke();
    }
    if (!this.isBoss) {
      const w = 24;
      const hpPct = Math.max(0, this.hp / this.maxHp);
      ctx.fillStyle = '#000000aa'; ctx.fillRect(p.x - w / 2, p.y - r - 8, w, 3);
      ctx.fillStyle = hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f1c40f' : '#e74c3c';
      ctx.fillRect(p.x - w / 2, p.y - r - 8, w * hpPct, 3);
    }
  }
}

// ============ 塔圖案 ============
function drawTowerIcon(type, x, y, size) {
  ctx.save();
  switch (type) {
    case 'white':
      ctx.fillStyle = '#555';
      ctx.beginPath(); ctx.arc(x, y, size * 0.16, 0, Math.PI * 2); ctx.fill();
      break;
    case 'green': {
      ctx.fillStyle = '#0a4d26';
      const h = size * 0.32, s = size * 0.3;
      ctx.beginPath();
      ctx.moveTo(x, y - h); ctx.lineTo(x - s, y + h * 0.6); ctx.lineTo(x + s, y + h * 0.6);
      ctx.closePath(); ctx.fill(); break;
    }
    case 'blue': {
      ctx.fillStyle = '#0a2d5c';
      ctx.beginPath();
      ctx.moveTo(x + size * 0.02, y - size * 0.28);
      ctx.lineTo(x - size * 0.14, y + size * 0.02);
      ctx.lineTo(x - size * 0.02, y + size * 0.02);
      ctx.lineTo(x - size * 0.06, y + size * 0.28);
      ctx.lineTo(x + size * 0.14, y - size * 0.04);
      ctx.lineTo(x + size * 0.02, y - size * 0.04);
      ctx.closePath(); ctx.fill(); break;
    }
    case 'purple': {
      ctx.fillStyle = '#2d1445';
      ctx.beginPath();
      const outer = size * 0.3, inner = size * 0.13;
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const r = i % 2 === 0 ? outer : inner;
        const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); break;
    }
    case 'cyan':
      ctx.fillStyle = '#003d4d';
      ctx.fillRect(x - size * 0.07, y - size * 0.28, size * 0.14, size * 0.56);
      ctx.fillRect(x - size * 0.28, y - size * 0.07, size * 0.56, size * 0.14);
      break;
    case 'orange': {
      ctx.fillStyle = '#4d2200';
      ctx.beginPath(); ctx.arc(x, y, size * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#4d2200'; ctx.lineWidth = 3;
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * size * 0.2, y + Math.sin(a) * size * 0.2);
        ctx.lineTo(x + Math.cos(a) * size * 0.3, y + Math.sin(a) * size * 0.3);
        ctx.stroke();
      }
      break;
    }
    case 'red':
      ctx.fillStyle = '#ffd700';
      ctx.font = `bold ${size * 0.55}px system-ui`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$', x, y + 1); break;
    case 'gold': {
      ctx.save(); ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#8b6914';
      ctx.beginPath();
      const outer = size * 0.32, inner = size * 0.14;
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const r = i % 2 === 0 ? outer : inner;
        const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); ctx.restore(); break;
    }
    case 'silver':
      ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, size * 0.22, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, size * 0.12, 0, Math.PI * 2); ctx.stroke();
      break;
    case 'amethyst':
      ctx.fillStyle = '#3d1a5c';
      ctx.beginPath();
      ctx.moveTo(x, y - size * 0.28); ctx.lineTo(x + size * 0.22, y);
      ctx.lineTo(x, y + size * 0.28); ctx.lineTo(x - size * 0.22, y);
      ctx.closePath(); ctx.fill(); break;
    case 'jade': {
      ctx.fillStyle = '#003300';
      ctx.beginPath();
      const r = size * 0.28;
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 - Math.PI / 2;
        const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); break;
    }
    case 'magenta':
      ctx.fillStyle = '#ffffff';
      ctx.font = `${size * 0.5}px ${EMU_FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('♥', x, y + 1); break;
    case 'fireArrow': {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.moveTo(x, y - size * 0.3);
      ctx.bezierCurveTo(x + size * 0.22, y - size * 0.1, x + size * 0.18, y + size * 0.18, x, y + size * 0.3);
      ctx.bezierCurveTo(x - size * 0.18, y + size * 0.18, x - size * 0.22, y - size * 0.1, x, y - size * 0.3);
      ctx.fill();
      ctx.fillStyle = '#ff4500';
      ctx.beginPath();
      ctx.moveTo(x, y - size * 0.18);
      ctx.bezierCurveTo(x + size * 0.12, y - size * 0.05, x + size * 0.1, y + size * 0.1, x, y + size * 0.18);
      ctx.bezierCurveTo(x - size * 0.1, y + size * 0.1, x - size * 0.12, y - size * 0.05, x, y - size * 0.18);
      ctx.fill(); break;
    }
  }
  ctx.restore();
}

function drawLevelStars(level, x, y, size) {
  if (level <= 1) return;
  let stars = [];
  if (level <= 3) stars = new Array(level).fill('⭐');
  else if (level <= 6) stars = new Array(level - 3).fill('🌟');
  else stars = ['💫', '💫'];
  const fontSize = size * 0.4;
  const spacing = fontSize * 0.95;
  const totalWidth = (stars.length - 1) * spacing;
  ctx.save();
  ctx.font = `${fontSize}px ${EMU_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < stars.length; i++) {
    const sx = x - totalWidth / 2 + i * spacing;
    ctx.fillText(stars[i], sx, y);
  }
  ctx.restore();
}

// ============ 一般塔 ============
class Tower {
  constructor(spot, type) {
    this.spot = spot;
    this.type = type;
    this.config = TOWER_TYPES[type];
    this.level = 1;
    this.cooldown = 0;
    this.fireFlash = 0;
    this.hastedTimer = 0;
    this.critRateBonus = 0;
    this.critDmgBonus = 0;
    this.applyLevel();
  }
  get x() { return this.spot.x; }
  get y() { return this.spot.y; }
  get critRate() { return Math.min(1.0, this.critRateBonus); }
  get critDamage() { return Math.min(5.0, 2.0 + this.critDmgBonus); }
  applyLevel() {
    const lv = this.level;
    this.damage = this.config.damage * Math.pow(1.5, lv - 1);
    this.baseFireInterval = this.config.fireInterval * Math.pow(0.88, lv - 1);
    this.range = (this.config.range || 220) + 20 * (lv - 1);
    if (this.hastedTimer <= 0) this.fireInterval = this.baseFireInterval;
    this.hitChance = this.config.hitChance;
    this.killChance = this.config.killChance || 0;
    this.slowFactor = this.config.slowFactor;
    this.slowDuration = this.config.slowDuration;
    this.antiBossMultiplier = this.config.antiBossMultiplier;
  }
  applyHaste(duration, newInterval) {
    this.fireInterval = newInterval;
    this.hastedTimer = duration;
  }
  update(dt) {
    this.fireFlash = Math.max(0, this.fireFlash - dt * 6);
    if (this.hastedTimer > 0) {
      this.hastedTimer -= dt;
      if (this.hastedTimer <= 0) this.fireInterval = this.baseFireInterval;
    }
    this.cooldown -= dt;
    if (this.cooldown > 0) return;
    const target = this.findTarget();
    if (target) { this.fire(target); this.cooldown = this.fireInterval; }
  }
  findTarget() {
    let best = null, bestDist = this.range;
    for (const e of enemies) {
      if (!e.alive) continue;
      const p = e.getPos();
      const d = Math.hypot(p.x - this.x, p.y - this.y);
      if (d <= bestDist) { bestDist = d; best = e; }
    }
    return best;
  }
  fire(target) {
    this.fireFlash = 1;
    bullets.push(new Bullet(this, target));
    if (this.type !== 'blue') sfxShoot();
  }
  drawBody(x, y, alpha = 1) {
    const size = 70, half = size / 2;
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
    ctx.fillStyle = '#00000066';
    ctx.fillRect(-half + 2, -half + 3, size, size);
    if (this.type === 'gold') {
      const grad = ctx.createLinearGradient(-half, -half, half, half);
      grad.addColorStop(0, '#fff6b0'); grad.addColorStop(0.5, '#f1c40f'); grad.addColorStop(1, '#b8860b');
      ctx.fillStyle = grad;
    } else ctx.fillStyle = this.config.color;
    ctx.fillRect(-half, -half, size, size);
    ctx.strokeStyle = this.type === 'gold' ? '#fff6b0' :
      (this.type === 'cyan' ? '#7ff7ff' : '#00000066');
    ctx.lineWidth = 2;
    ctx.strokeRect(-half, -half, size, size);
    ctx.restore();
    drawTowerIcon(this.type, x, y, size);
  }
  draw() {
    const x = this.x, y = this.y;
    const size = 70, half = size / 2;
    if (selectedTower === this) {
      ctx.fillStyle = 'rgba(255, 215, 0, 0.08)';
      ctx.beginPath(); ctx.arc(x, y, this.range, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (this.type === 'amethyst' || this.type === 'jade') {
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 300);
      ctx.save(); ctx.shadowColor = this.config.color; ctx.shadowBlur = 18 * pulse;
      ctx.strokeStyle = this.config.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, half + 8, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    if (this.critRateBonus > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(176, 136, 255, 0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, half + 3, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    if (this.critDmgBonus > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(102, 255, 102, 0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, half + 6, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    const isDragging = drag && drag.tower === this && drag.isDragging;
    if (!isDragging) {
      ctx.save(); ctx.translate(x, y);
      const scale = 1 + this.fireFlash * 0.08;
      ctx.scale(scale, scale); ctx.translate(-x, -y);
      this.drawBody(x, y, 1); ctx.restore();
      if (this.fireFlash > 0) {
        ctx.save();
        ctx.fillStyle = `rgba(255,255,255,${this.fireFlash * 0.4})`;
        ctx.fillRect(x - half, y - half, size, size);
        ctx.restore();
      }
    }
    drawLevelStars(this.level, x, y - half - 12, size);
    if (this.hastedTimer > 0) {
      ctx.save(); ctx.shadowColor = '#e74c3c'; ctx.shadowBlur = 14;
      ctx.strokeStyle = `rgba(231, 76, 60, ${0.6 + 0.4 * Math.sin(this.hastedTimer * 12)})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, half + 5, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
  }
}

// ============ 銀塔 ============
class SilverTower {
  constructor(spot) {
    this.spot = spot;
    this.type = 'silver';
    this.config = TOWER_TYPES.silver;
    this.level = 1;
    this.attackCount = 0;
    this.idleTimer = 0;
    this.cooldown = 0;
    this.fireFlash = 0;
    this.range = this.config.range;
    this.pulse = 0;
    this.critRateBonus = 0;
    this.critDmgBonus = 0;
  }
  get x() { return this.spot.x; }
  get y() { return this.spot.y; }
  get critRate() { return Math.min(1.0, this.critRateBonus); }
  get critDamage() { return Math.min(5.0, 2.0 + this.critDmgBonus); }
  update(dt) {
    this.pulse += dt;
    this.fireFlash = Math.max(0, this.fireFlash - dt * 5);
    this.idleTimer += dt;
    if (this.idleTimer >= this.config.decayTime) {
      this.idleTimer = 0;
      if (this.level > 1) this.level--;
    }
    this.cooldown -= dt;
    if (this.cooldown > 0) return;
    const targets = this.findTargets(this.level);
    if (targets.length === 0) return;
    this.fire(targets);
    this.cooldown = this.config.fireInterval;
    this.idleTimer = 0;
    this.attackCount++;
    if (this.attackCount >= this.config.attacksPerLevel) {
      this.attackCount = 0;
      if (this.level < this.config.maxLevel) this.level++;
    }
  }
  findTargets(count) {
    const inRange = [];
    for (const e of enemies) {
      if (!e.alive) continue;
      const p = e.getPos();
      const d = Math.hypot(p.x - this.x, p.y - this.y);
      if (d <= this.range) inRange.push(e);
    }
    if (inRange.length === 0) return [];
    let focus = inRange[0];
    for (const e of inRange) if (e.hp > focus.hp) focus = e;
    return new Array(count).fill(focus);
  }
  fire(targets) {
    this.fireFlash = 1;
    for (const target of targets) bullets.push(new SilverBullet(this, target));
  }
  drawBody(x, y, alpha = 1) {
    const size = 70, half = size / 2;
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
    ctx.fillStyle = '#00000066';
    ctx.fillRect(-half + 2, -half + 3, size, size);
    const grad = ctx.createLinearGradient(-half, -half, half, half);
    grad.addColorStop(0, '#f0f0f0'); grad.addColorStop(0.5, '#c0c0c0'); grad.addColorStop(1, '#707070');
    ctx.fillStyle = grad;
    ctx.fillRect(-half, -half, size, size);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.strokeRect(-half, -half, size, size);
    ctx.restore();
    drawTowerIcon('silver', x, y, size);
  }
  draw() {
    const x = this.x, y = this.y;
    const size = 70, half = size / 2;
    if (selectedTower === this) {
      ctx.fillStyle = 'rgba(255, 215, 0, 0.08)';
      ctx.beginPath(); ctx.arc(x, y, this.range, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (this.critRateBonus > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(176, 136, 255, 0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, half + 3, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    if (this.critDmgBonus > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(102, 255, 102, 0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, half + 6, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    if (this.level > 1) {
      const intensity = this.level / this.config.maxLevel;
      ctx.save(); ctx.shadowColor = '#c0c0c0'; ctx.shadowBlur = 8 + intensity * 16;
      ctx.fillStyle = `rgba(220, 220, 240, ${0.08 + intensity * 0.25})`;
      ctx.beginPath(); ctx.arc(x, y, half + 4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    const isDragging = drag && drag.tower === this && drag.isDragging;
    if (!isDragging) {
      ctx.save(); ctx.translate(x, y);
      const scale = 1 + this.fireFlash * 0.12;
      ctx.scale(scale, scale); ctx.translate(-x, -y);
      this.drawBody(x, y, 1); ctx.restore();
    }
    if (this.level > 1) {
      ctx.save(); ctx.fillStyle = '#ffd700';
      ctx.font = `bold 14px system-ui`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`Lv${this.level}`, x, y - half - 12); ctx.restore();
      const remain = this.config.decayTime - this.idleTimer;
      if (remain < 0.8) {
        ctx.save();
        ctx.strokeStyle = `rgba(231, 76, 60, ${0.4 + 0.4 * Math.sin(this.pulse * 20)})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, half + 5, -Math.PI / 2, -Math.PI / 2 + (remain / 0.8) * Math.PI * 2);
        ctx.stroke(); ctx.restore();
      }
    }
  }
}

// ============ 橙塔 ============
class BeamTower {
  constructor(spot) {
    this.spot = spot;
    this.type = 'orange';
    this.config = TOWER_TYPES.orange;
    this.level = 1;
    this.beamTargets = [];
    this.reacquireTimer = 0;
    this.pulse = 0;
    this.hastedTimer = 0;
    this.critRateBonus = 0;
    this.critDmgBonus = 0;
    this.applyLevel();
  }
  get x() { return this.spot.x; }
  get y() { return this.spot.y; }
  applyLevel() {
    const lv = this.level;
    this.dps = this.config.dps * Math.pow(1.5, lv - 1);
    this.beamCount = this.config.beamCount + (lv - 1);
  }
  applyHaste(duration) { this.hastedTimer = duration; }
  update(dt) {
    this.pulse += dt;
    this.reacquireTimer -= dt;
    if (this.hastedTimer > 0) this.hastedTimer -= dt;
    if (this.reacquireTimer <= 0) {
      this.beamTargets = this.pickRandom(this.beamCount);
      this.reacquireTimer = this.config.reacquireInterval;
    }
    this.beamTargets = this.beamTargets.filter(e => e.alive);
    const dpsMult = this.hastedTimer > 0 ? 3 : 1;
    for (const target of this.beamTargets) {
      const actual = target.takeDamage(this.dps * dt * dpsMult);
      addDamage('orange', actual);
    }
  }
  pickRandom(n) {
    const alive = enemies.filter(e => e.alive);
    for (let i = alive.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [alive[i], alive[j]] = [alive[j], alive[i]];
    }
    return alive.slice(0, n);
  }
  drawBody(x, y, alpha = 1) {
    const size = 70, half = size / 2;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.fillStyle = '#00000066';
    ctx.fillRect(x - half + 2, y - half + 3, size, size);
    ctx.fillStyle = this.config.color;
    ctx.fillRect(x - half, y - half, size, size);
    ctx.strokeStyle = '#00000066'; ctx.lineWidth = 2;
    ctx.strokeRect(x - half, y - half, size, size);
    ctx.restore();
    drawTowerIcon('orange', x, y, size);
    ctx.save();
    const glow = 0.6 + 0.4 * Math.sin(this.pulse * 8);
    ctx.fillStyle = `rgba(255, 220, 120, ${glow * 0.6})`;
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  draw() {
    const x = this.x, y = this.y;
    const size = 70, half = size / 2;
    if (selectedTower === this) {
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3;
      ctx.strokeRect(x - half - 3, y - half - 3, size + 6, size + 6);
    }
    if (this.critRateBonus > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(176, 136, 255, 0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, half + 3, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    if (this.critDmgBonus > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(102, 255, 102, 0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, half + 6, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    const isDragging = drag && drag.tower === this && drag.isDragging;
    if (!isDragging) this.drawBody(x, y, 1);
    if (!isDragging) {
      ctx.save(); ctx.shadowColor = '#e67e22'; ctx.shadowBlur = 12; ctx.lineWidth = 3;
      for (const target of this.beamTargets) {
        if (!target.alive) continue;
        const tp = target.getPos();
        ctx.strokeStyle = `rgba(255, 180, 80, ${0.7 + 0.3 * Math.sin(this.pulse * 12)})`;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tp.x, tp.y); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 200, 120, 0.9)';
        ctx.beginPath(); ctx.arc(tp.x, tp.y, 8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    drawLevelStars(this.level, x, y - half - 12, size);
    if (this.hastedTimer > 0) {
      ctx.save(); ctx.shadowColor = '#e74c3c'; ctx.shadowBlur = 14;
      ctx.strokeStyle = `rgba(231, 76, 60, ${0.6 + 0.4 * Math.sin(this.pulse * 12)})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, half + 5, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
  }
}

// ============ 紅塔 ============
class BossTower {
  constructor(spot) {
    this.spot = spot;
    this.type = 'red';
    this.config = TOWER_TYPES.red;
    this.level = 1;
    this.buffTimer = this.config.buffInterval;
    this.buffFlash = 0;
    this.activeBuffs = [];
    this.critRateBonus = 0;
    this.critDmgBonus = 0;
    this.applyLevel();
  }
  get x() { return this.spot.x; }
  get y() { return this.spot.y; }
  applyLevel() {
    const lv = this.level;
    this.buffTargets = this.config.buffTargets + (lv - 1);
    this.buffDuration = this.config.buffDuration + (lv - 1) * 2;
    this.buffInterval = Math.max(2, this.config.buffInterval - (lv - 1) * 0.5);
  }
  update(dt) {
    this.buffFlash = Math.max(0, this.buffFlash - dt * 3);
    for (const buff of this.activeBuffs) buff.timer -= dt;
    this.activeBuffs = this.activeBuffs.filter(b =>
      b.timer > 0 && SPOTS.some(s => s.tower === b.tower));
    this.buffTimer -= dt;
    if (this.buffTimer <= 0) {
      this.triggerBuff();
      this.buffTimer = this.buffInterval;
    }
  }
  triggerBuff() {
    const others = SPOTS.map(s => s.tower)
      .filter(t => t && t !== this && typeof t.applyHaste === 'function');
    if (others.length === 0) return;
    for (let i = others.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [others[i], others[j]] = [others[j], others[i]];
    }
    const count = Math.min(this.buffTargets, others.length);
    for (let i = 0; i < count; i++) {
      const t = others[i];
      t.applyHaste(this.buffDuration, this.config.buffFireInterval);
      const existing = this.activeBuffs.find(b => b.tower === t);
      if (existing) existing.timer = this.buffDuration;
      else this.activeBuffs.push({ tower: t, timer: this.buffDuration });
    }
    this.buffFlash = 1;
  }
  drawBody(x, y, alpha = 1) {
    const size = 70, half = size / 2;
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
    ctx.fillStyle = '#00000066';
    ctx.fillRect(-half + 2, -half + 3, size, size);
    ctx.fillStyle = '#7b1f1f';
    ctx.fillRect(-half, -half, size, size);
    ctx.strokeStyle = '#00000066'; ctx.lineWidth = 2;
    ctx.strokeRect(-half, -half, size, size);
    if (this.buffFlash > 0) {
      ctx.fillStyle = `rgba(231, 76, 60, ${this.buffFlash * 0.6})`;
      ctx.fillRect(-half, -half, size, size);
    }
    ctx.restore();
    drawTowerIcon('red', x, y, size);
  }
  draw() {
    const x = this.x, y = this.y;
    const size = 70, half = size / 2;
    const isDragging = drag && drag.tower === this && drag.isDragging;
    if (!isDragging) this.drawBody(x, y, 1);
    if (selectedTower === this) {
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3;
      ctx.strokeRect(x - half - 3, y - half - 3, size + 6, size + 6);
    }
    drawLevelStars(this.level, x, y - half - 12, size);
  }
}

// ============ 品紅塔 ============
class MagentaTower {
  constructor(spot) {
    this.spot = spot;
    this.type = 'magenta';
    this.config = TOWER_TYPES.magenta;
    this.level = 1;
    this.timer = this.config.triggerTime;
    this.triggered = false;
    this.pulse = 0;
    this.critRateBonus = 0;
    this.critDmgBonus = 0;
  }
  get x() { return this.spot.x; }
  get y() { return this.spot.y; }
  get critRate() { return 0; }
  get critDamage() { return 2.0; }
  applyLevel() {}
  update(dt) {
    if (this.triggered) return;
    this.pulse += dt;
    this.timer -= dt;
    if (this.timer <= 0) { this.trigger(); this.triggered = true; }
  }
  trigger() {
    this.spot.tower = null;
    const candidates = SPOTS.filter(s =>
      s.tower && s.tower !== this && s.tower.type !== 'magenta' &&
      s.tower.type !== 'silver' && s.tower.level < MAX_TOWER_LEVEL);
    if (candidates.length === 0) { log('品紅塔：沒有可升級的目標', 2500); return; }
    if (Math.random() < this.config.successRate) {
      const targetSpot = candidates[Math.floor(Math.random() * candidates.length)];
      const t = targetSpot.tower;
      const oldLevel = t.level;
      t.level = Math.min(MAX_TOWER_LEVEL, t.level + this.config.levelBoost);
      if (t.applyLevel) t.applyLevel();
      sfxUpgrade();
      log(`💖 品紅塔成功！${TOWER_TYPES[t.type].name} Lv.${oldLevel} → Lv.${t.level}`, 3500);
    } else log('💔 品紅塔失敗了...', 2500);
  }
  drawBody(x, y, alpha = 1) {
    const size = 70, half = size / 2;
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
    ctx.fillStyle = '#00000066';
    ctx.fillRect(-half + 2, -half + 3, size, size);
    const grad = ctx.createLinearGradient(-half, -half, half, half);
    grad.addColorStop(0, '#FF66DD'); grad.addColorStop(1, '#CC0099');
    ctx.fillStyle = grad;
    ctx.fillRect(-half, -half, size, size);
    ctx.strokeStyle = '#ffd6f5'; ctx.lineWidth = 2;
    ctx.strokeRect(-half, -half, size, size);
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${size * 0.55}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.ceil(Math.max(0, this.timer)), 0, 1);
    ctx.restore();
  }
  draw() {
    const x = this.x, y = this.y;
    const size = 70, half = size / 2;
    if (selectedTower === this) {
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3;
      ctx.strokeRect(x - half - 3, y - half - 3, size + 6, size + 6);
    }
    const progress = 1 - Math.max(0, this.timer) / this.config.triggerTime;
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 100);
    ctx.save(); ctx.shadowColor = '#FF33CC';
    ctx.shadowBlur = 10 + progress * 25 + pulse * 8;
    ctx.fillStyle = `rgba(255, 51, 204, ${0.15 + progress * 0.4})`;
    ctx.beginPath(); ctx.arc(x, y, half + 6 + progress * 8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    const isDragging = drag && drag.tower === this && drag.isDragging;
    if (!isDragging) this.drawBody(x, y, 1);
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 51, 204, 0.9)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, half + 5, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
    ctx.stroke(); ctx.restore();
  }
}

// ============ 火矢塔 ============
class FireArrowTower {
  constructor(spot) {
    this.spot = spot;
    this.type = 'fireArrow';
    this.config = TOWER_TYPES.fireArrow;
    this.level = 1;
    this.cooldown = 0;
    this.fireFlash = 0;
    this.pulse = 0;
    this.beams = [];
    this.critRateBonus = 0;
    this.critDmgBonus = 0;
    this.hastedTimer = 0;
    this.applyLevel();
  }
  get x() { return this.spot.x; }
  get y() { return this.spot.y; }
  get critRate() { return Math.min(1.0, this.critRateBonus); }
  get critDamage() { return Math.min(5.0, 2.0 + this.critDmgBonus); }
  applyLevel() {
    this.damage = this.config.damage * Math.pow(1.5, this.level - 1);
  }
  applyHaste(duration) { this.hastedTimer = duration; }
  update(dt) {
    this.pulse += dt;
    this.fireFlash = Math.max(0, this.fireFlash - dt * 20);
    for (const b of this.beams) b.timer -= dt;
    this.beams = this.beams.filter(b => b.timer > 0 && b.target && b.target.alive);
    this.cooldown -= dt;
    if (this.cooldown > 0) return;
    const target = this.findTarget();
    if (!target) return;
    this.fireAt(target);
    const hasBoss = enemies.some(e => e.isBoss && e.alive);
    this.cooldown = hasBoss ? this.config.fireIntervalBoss : this.config.fireIntervalNormal;
  }
  findTarget() {
    for (const e of enemies) if (e.alive && e.isBoss) return e;
    let best = null, bestDist = Infinity;
    for (const e of enemies) {
      if (!e.alive) continue;
      const p = e.getPos();
      const d = Math.hypot(p.x - this.x, p.y - this.y);
      if (d < bestDist) { bestDist = d; best = e; }
    }
    return best;
  }
  fireAt(target) {
    let dmg = this.damage;
    if (this.critRate > 0 && Math.random() < this.critRate) dmg *= this.critDamage;
    const actual = target.takeDamage(dmg);
    addDamage('fireArrow', actual);
    this.fireFlash = 1;
    this.beams.push({ target, timer: 0.06 });
  }
  drawBody(x, y, alpha = 1) {
    const size = 70, half = size / 2;
    const hasBoss = enemies.some(e => e.isBoss && e.alive);
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
    ctx.fillStyle = '#00000066';
    ctx.fillRect(-half + 2, -half + 3, size, size);
    const grad = ctx.createLinearGradient(-half, -half, half, half);
    if (hasBoss) {
      grad.addColorStop(0, '#ffcc66'); grad.addColorStop(0.5, '#ff6600'); grad.addColorStop(1, '#991100');
    } else {
      grad.addColorStop(0, '#cc4400'); grad.addColorStop(0.5, '#882200'); grad.addColorStop(1, '#441100');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(-half, -half, size, size);
    ctx.strokeStyle = hasBoss ? '#ffd700' : '#552200'; ctx.lineWidth = 2;
    ctx.strokeRect(-half, -half, size, size);
    ctx.restore();
    drawTowerIcon('fireArrow', x, y, size);
    if (hasBoss) {
      ctx.save();
      const glow = 0.6 + 0.4 * Math.sin(this.pulse * 20);
      ctx.shadowColor = '#FF4500'; ctx.shadowBlur = 20 * glow;
      ctx.strokeStyle = `rgba(255, 200, 100, ${glow})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, half + 4, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
  }
  draw() {
    const x = this.x, y = this.y;
    const size = 70, half = size / 2;
    if (selectedTower === this) {
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3;
      ctx.strokeRect(x - half - 3, y - half - 3, size + 6, size + 6);
    }
    if (this.critRateBonus > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(176, 136, 255, 0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, half + 3, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    if (this.critDmgBonus > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(102, 255, 102, 0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, half + 6, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    const isDragging = drag && drag.tower === this && drag.isDragging;
    if (!isDragging) this.drawBody(x, y, 1);
    if (!isDragging) {
      ctx.save(); ctx.shadowColor = '#FF4500'; ctx.shadowBlur = 14;
      for (const b of this.beams) {
        if (!b.target || !b.target.alive) continue;
        const tp = b.target.getPos();
        const alpha = b.timer / 0.06;
        ctx.strokeStyle = `rgba(255, 180, 50, ${alpha})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tp.x, tp.y); ctx.stroke();
      }
      ctx.restore();
    }
    drawLevelStars(this.level, x, y - half - 12, size);
  }
}

// ============ 子彈 ============
class Bullet {
  constructor(tower, target) {
    this.x = tower.x; this.y = tower.y;
    this.target = target;
    this.alive = true;
    this.speed = 600;
    this.color = tower.config.color;
    this.towerType = tower.type;
    this.damage = tower.damage;
    this.killChance = tower.killChance || 0;
    this.slowFactor = tower.slowFactor;
    this.slowDuration = tower.slowDuration;
    this.antiBossMultiplier = tower.antiBossMultiplier;
    this.isHit = Math.random() < tower.hitChance;
    this.critRate = tower.critRate || 0;
    this.critDamage = tower.critDamage || 2.0;
  }
  update(dt) {
    if (!this.alive) return;
    if (!this.target.alive) { this.alive = false; return; }
    const tp = this.target.getPos();
    const dx = tp.x - this.x, dy = tp.y - this.y;
    const dist = Math.hypot(dx, dy), move = this.speed * dt;
    if (dist <= move) {
      if (this.isHit) {
        const procsKill = this.killChance > 0 && Math.random() < this.killChance;
        if (procsKill) {
          if (this.target.isBoss) {
            const d = this.target.takeDamage(this.target.maxHp * 0.01);
            addDamage(this.towerType, d);
          } else {
            addDamage(this.towerType, this.target.hp);
            this.target.hp = 0;
            this.target.alive = false;
          }
        } else {
          let dmg = this.damage;
          if (this.target.isBoss && this.antiBossMultiplier) dmg *= this.antiBossMultiplier;
          if (this.critRate > 0 && Math.random() < this.critRate) dmg *= this.critDamage;
          const actual = this.target.takeDamage(dmg);
          addDamage(this.towerType, actual);
        }
        if (this.slowFactor !== undefined) {
          this.target.slowFactor = this.slowFactor;
          this.target.slowTimer = this.slowDuration;
        }
        sfxHit();
      }
      this.alive = false;
    } else {
      this.x += (dx / dist) * move;
      this.y += (dy / dist) * move;
    }
  }
  draw() {
    if (!this.alive) return;
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI * 2); ctx.fill();
  }
}
