<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a3a"/>
      <stop offset="1" stop-color="#050510"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd700" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c0"/>
      <stop offset="0.4" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#b87000"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="220" fill="url(#halo)"/>

  <polygon points="256,80 400,180 340,420 172,420 112,180"
           fill="url(#crystal)" stroke="#fff8c0" stroke-width="6" stroke-linejoin="round"/>

  <polygon points="256,80 320,180 256,420 192,180"
           fill="#ffffff" fill-opacity="0.35"/>

  <polygon points="256,80 400,180 340,420 172,420 112,180"
           fill="none" stroke="#ffd700" stroke-width="3" stroke-linejoin="round"/>

  <circle cx="256" cy="80" r="14" fill="#ffffff"/>
  <circle cx="256" cy="80" r="22" fill="#ffffff" fill-opacity="0.3"/>

  <text x="256" y="300" font-family="system-ui, sans-serif"
        font-size="120" font-weight="900"
        fill="#0a0518" text-anchor="middle" opacity="0.85">塔</text>
</svg>